  mk.rotation.x=-Math.PI/2; mk.position.set(x,0.07,z); scene.add(mk); return mk;
}
function flapWings(e,dt,speed){ const W=e.mesh.userData.wings; if(!W) return; e.flap=(e.flap||0)+dt*speed; W.forEach(([w,sx])=>w.rotation.z=sx*Math.sin(e.flap)*0.5); }
function updateEagle(e,dt,ux,uz,d){
  const p=e.mesh.position, T=e.tier;
  flapWings(e,dt,e.state==='dive'?3:8);
  if(e.state==='chase' || e.state==='circle'){
    e.state='circle';
    e.ang=(e.ang===undefined?Math.atan2(p.z-P.z,p.x-P.x):e.ang)+dt*(0.55+0.04*T)*e.dir;
    const tx=P.x+Math.cos(e.ang)*14, tz=P.z+Math.sin(e.ang)*14, dx=tx-p.x, dz=tz-p.z, dd=Math.hypot(dx,dz)||1, sp=Math.min(dd,e.speed*dt*2.2);
    p.x+=dx/dd*sp; p.z+=dz/dd*sp; p.y+=(7-p.y)*Math.min(1,dt*2);
    if(dd>0.05) e.mesh.rotation.y=Math.atan2(-dx,-dz);
    e.t-=dt; e.fT=(e.fT===undefined?2:e.fT)-dt;
    if(T>=3 && e.fT<=0){ e.fT=Math.max(1.2,2.4-0.2*T); aimShot(e,ux,uz,d,3,0.25,e.bdmg,{mat:spineMat}); sfx('eshot'); }
    if(e.t<=0){ e.state='mark'; e.t=1.0; e.tx=P.x; e.tz=P.z; if(e.mk){ scene.remove(e.mk); } e.mk=ringMarker(e.tx,e.tz); sfx('screech'); }
    return e.speed;
  }
  if(e.state==='mark'){
    e.t-=dt; e.mesh.rotation.y=Math.atan2(-(e.tx-p.x),-(e.tz-p.z)); p.y+=(8-p.y)*Math.min(1,dt*3);
    if(e.mk) e.mk.material.opacity=0.45+0.35*Math.abs(Math.sin(performance.now()/90));
    if(e.t<=0){ e.state='dive'; e.sx=p.x; e.sy=p.y; e.sz=p.z; e.t=0; sfx('whoosh'); }
    return 0;
  }
  if(e.state==='dive'){
    e.t+=dt/0.55; const k=Math.min(1,e.t);
    p.x=e.sx+(e.tx-e.sx)*k; p.z=e.sz+(e.tz-e.sz)*k; p.y=e.sy+(1.0-e.sy)*k;
    if(k>=1){
      if(e.mk){ scene.remove(e.mk); e.mk.material.dispose(); e.mk=null; }
      burst(e.tx,0.5,e.tz,0xd9c29a,24); P.shake=Math.max(P.shake,0.35); sfx('thud');
      if(Math.hypot(P.x-e.tx,P.z-e.tz)<3.2) hurtPlayer(e.chargeDmg,'melee');
      e.chain=(e.chain||0)+1;
      if(T>=4 && e.chain<2){ e.state='mark'; e.t=0.7; e.tx=P.x; e.tz=P.z; e.mk=ringMarker(e.tx,e.tz); }
      else { e.chain=0; e.state='rise'; e.t=1.4; }
    }
    return 20;
  }
  // rise: 땅 가까이 잠깐 머무름 (공격 기회!)
  e.t-=dt; if(e.t<0.6) p.y+=(7-p.y)*Math.min(1,dt*1.5);
  if(e.t<=0){ e.state='circle'; e.t=Math.max(2.2,4.2-0.3*T); e.dir=Math.random()<0.5?1:-1; }
  return 3;
}
function updateChick(e,dt,ux,uz,d){
  const p=e.mesh.position; flapWings(e,dt,12);
  p.y+=(2.2-p.y)*Math.min(1,dt*3);
  e.back=Math.max(0,(e.back||0)-dt); const dir=e.back>0?-1:1;

  return e.speed;
}
function updateGolem(e,dt,ux,uz,d){

  return e.speed;
}
function updateCactling(e,dt,ux,uz,d){ strafe(e,dt,ux,uz,d,5,9); e.t-=dt; if(e.t<=0){ e.t=2.6; aimShot(e,ux,uz,d,3,0.3,e.bdmg,{mat:spineMat}); } return e.speed; }
function twinAlive(e){ return e.kind==='twins' && e.partner && e.partner!==e && enemies.includes(e.partner) && e.partner.hp>0; }

function buildRailyard(avoid){
  const rail=tmat('rail',0x8a8a8a), tie=tmat('tie',0x5d4037), L=ARENA*2+20;
  for(const z of RAIL_Z){
    for(const dz of [-0.75,0.75]) addBox(decor,L,0.12,0.12,rail,0,0.12,z+dz);
    const n=140, ties=new THREE.InstancedMesh(boxGeo(0.35,0.08,2.2),tie,n), dm=new THREE.Object3D();
    for(let i=0;i<n;i++){ dm.position.set(-L/2+i*(L/n),0.05,z); dm.updateMatrix(); ties.setMatrixAt(i,dm.matrix); }

let train=null, trainT=18, trainWarned=false;
function makeTrain(){

    trainT-=dt;

    if(trainT<=0){ const dir=Math.random()<0.5?1:-1, g=makeTrain(); g.rotation.y=dir>0?0:Math.PI; train={g,dir,x:-dir*(ARENA+70),hitP:0}; g.position.set(train.x,0,RAIL_Z[1]); scene.add(g); sfx('rumble'); sfx('horn'); }
    return;

  train.x+=train.dir*42*dt; train.g.position.x=train.x;
  if(Math.random()<0.4) burst(train.x+train.dir*2.4,4.6,RAIL_Z[1],0x9e9e9e,1);
  const back=train.x-train.dir*58, minX=Math.min(train.x,back)-4, maxX=Math.max(train.x,back)+4;

let onlineRush2=[], failedRush2=[], lastRush2=null;
function cleanRush2(x){ const r=cleanRush(x); if(!r) return null; r.name=String(x.name||'???').slice(0,40); return r; }
function localRush2(){ const a=LS.get('sheriffRush2',[]); return Array.isArray(a)?a.map(cleanRush2).filter(Boolean):[]; }
function rush2Runs(){ const wk=rushPlan().wk; return ((((db||fb) && boardState!=='error') ? onlineRush2.concat(failedRush2) : localRush2()).filter(r=>r.wk===wk && nameVisible(r.name))).sort((a,b)=>a.t-b.t || a.date.localeCompare(b.date)).slice(0,10); }
async function saveRush2(en){
  lastRush2=en;
  if(fb){
    try{ const fields={name:{stringValue:en.name}, t:{integerValue:String(en.t)}, wk:{stringValue:en.wk}, date:{stringValue:en.date}}; if(en.tt) fields.tt={stringValue:en.tt};
      const r=await fetch(fbBase()+'/scores_rush2?key='+encodeURIComponent(fb.apiKey),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields})});
      if(!r.ok) throw new Error('HTTP '+r.status); onlineRush2.push(en); return; }
    catch(e){ failedRush2.push(en); }
  } else if(db && myId){
    try{ const ref=db.collection('scores').doc(myId), snap=await ref.get(), d=snap.exists?snap.data():null;
      const a=(d&&Array.isArray(d.rush2))?d.rush2.map(cleanRush2).filter(Boolean):[]; a.push(en); a.sort((x,y)=>x.t-y.t);
      if(snap.exists) await ref.update({rush2:a.slice(0,10)}); else await ref.set({rush2:a.slice(0,10)});
      onlineRush2.push(en); return; }
    catch(e){ failedRush2.push(en); }
  }
  const a=localRush2(); a.push(en); a.sort((x,y)=>x.t-y.t); LS.set('sheriffRush2',a.slice(0,20));
}
async function fbLoadRush2(){
  const r=await fetch(fbBase()+':runQuery?key='+encodeURIComponent(fb.apiKey),{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({structuredQuery:{from:[{collectionId:'scores_rush2'}],where:{fieldFilter:{field:{fieldPath:'wk'},op:'EQUAL',value:{stringValue:rushPlan().wk}}},limit:200}})});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const rows=await r.json(), v=(f,k,t)=>f[k]?f[k][t]:undefined;
  return rows.filter(x=>x.document).map(x=>{ const f=x.document.fields||{}; return cleanRush2({name:v(f,'name','stringValue'), t:v(f,'t','integerValue'), wk:v(f,'wk','stringValue'), date:v(f,'date','stringValue'), tt:v(f,'tt','stringValue')}); }).filter(Boolean);
}

function badName(n){
  const raw=String(n||''), s=raw.toLowerCase().replace(/[\s._\-~!@#$%^&*()+=|\\/?,'"`:;<>\[\]{}·]/g,'');
  if(/@|https?|www|\.com|\.kr|\.net/i.test(raw)) return '이메일·주소는 이름으로 쓸 수 없어요';
  if(/\d{3,}[\s-]?\d{3,}/.test(raw) || /01[016789]\d{3,}/.test(s)) return '전화번호 같은 숫자는 이름으로 쓸 수 없어요';
  if(BAD_WORDS.some(w=>s.includes(w))) return '쓸 수 없는 말이 들어 있어요';
  return '';
}

function aimAssist(dt){
  const lv=SET.assist|0; if(!lv || mode!=='play' || view==='photo') return;
  const range=0.07*lv, fx=-Math.sin(P.yaw), fz=-Math.cos(P.yaw);
  let best=null, bd=range;
  for(const e of enemies){
    if(e.hidden || e.dummy && !practice) continue;
    const p=e.mesh.position, dx=p.x-P.x, dz=p.z-P.z, dist=Math.hypot(dx,dz);
    if(dist<2 || dist>45) continue;
    const a=Math.atan2(-dx,-dz), diff=Math.atan2(Math.sin(a-P.yaw),Math.cos(a-P.yaw));
    if(Math.abs(diff)<bd){ bd=Math.abs(diff); best=diff; }
  }
  if(best!==null) P.yaw+=best*Math.min(1,dt*2.2*lv);
}

let onlineEvent=[], failedEvent=[], lastEvent=null;
function cleanEvent(x){
  if(!x||typeof x!=='object') return null;

  return {name:String(x.name||'???').slice(0,12), score:sc, wave:Math.max(0,Math.floor(Number(x.wave)||0)), wk:String(x.wk||'').slice(0,10), date:String(x.date||'').slice(0,40), ...(x.tt?{tt:String(x.tt).slice(0,12)}:{})};

async function saveEvent(en){
  saveNote='';
  if(fb){
    try{ const fields={name:{stringValue:en.name}, score:{integerValue:String(en.score)}, wave:{integerValue:String(en.wave)}, wk:{stringValue:en.wk}, date:{stringValue:en.date}}; if(en.tt) fields.tt={stringValue:en.tt};
      const r=await fetch(fbBase()+'/scores_event?key='+encodeURIComponent(fb.apiKey),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields})});
      if(!r.ok) throw new Error('HTTP '+r.status); onlineEvent.push(en); fbLoad(); return; }
    catch(e){ saveNote='온라인 순위표에 저장하지 못해 이 기기에만 저장했어요.'; failedEvent.push(en); }
  } else if(db && myId){
    try{ const ref=db.collection('scores').doc(myId), snap=await ref.get(), d=snap.exists?snap.data():null;
      const a=(d&&Array.isArray(d.event))?d.event.map(cleanEvent).filter(Boolean):[]; a.push(en); a.sort((x,y)=>y.score-x.score);
      if(snap.exists) await ref.update({event:a.slice(0,10)}); else await ref.set({event:a.slice(0,10)});
      onlineEvent.push(en); return; }
    catch(e){ saveNote='공용 순위표에 저장할 권한이 없어 이 기기에만 저장했어요.'; failedEvent.push(en); }
  }
  const a=localEvent(); a.push(en); a.sort((x,y)=>y.score-x.score); LS.set('sheriffEvent',a.slice(0,30));
}
async function fbLoadEvent(){
  const r=await fetch(fbBase()+':runQuery?key='+encodeURIComponent(fb.apiKey),{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({structuredQuery:{from:[{collectionId:'scores_event'}],where:{fieldFilter:{field:{fieldPath:'wk'},op:'EQUAL',value:{stringValue:weekKey()}}},limit:300}})});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const rows=await r.json(), v=(f,k,t)=>f[k]?f[k][t]:undefined;
  return rows.filter(x=>x.document).map(x=>{ const f=x.document.fields||{}; return cleanEvent({name:v(f,'name','stringValue'), score:v(f,'score','integerValue'), wave:v(f,'wave','integerValue'), wk:v(f,'wk','stringValue'), date:v(f,'date','stringValue'), tt:v(f,'tt','stringValue')}); }).filter(Boolean);
}

function updateMountFx(dt){
  P.dashT=Math.max(0,(P.dashT||0)-dt); P.dashCd=Math.max(0,(P.dashCd||0)-dt); P.skillCd=Math.max(0,(P.skillCd||0)-dt); P.mSpdT=Math.max(0,(P.mSpdT||0)-dt);

  const M=curMount();
  if(P.chargeT>0){ P.chargeT-=dt;
    const fx=-Math.sin(P.yaw), fz=-Math.cos(P.yaw); P.x+=fx*24*dt; P.z+=fz*24*dt;
    const pp={x:P.x,z:P.z}; pushOut(pp,M?M.rad:0.6); clampArena(pp,3); P.x=pp.x; P.z=pp.z;
    if(Math.random()<0.8) burst(P.x,0.3,P.z,0xbcaaa4,2);
    for(const e of enemies.slice()){ if(e.hidden||e.hp<=0||e.chg===P.chargeId) continue; const p=e.mesh.position, d=Math.hypot(p.x-P.x,p.z-P.z);
      if(d<e.rad+(M?M.rad:0.6)+0.9){ e.chg=P.chargeId; hitEnemy(e,sdmg(20),false); if(!e.boss && !e.mirror && e.hp>0 && d>0.01){ p.x+=(p.x-P.x)/d*7; p.z+=(p.z-P.z)/d*7; } P.shake=Math.max(P.shake,0.25); } }
  }
  if(P.noReloadT>0){ P.noReloadT-=dt; if(!WEAPONS[P.weapon].thrown){ P.ammo[P.weapon]=wMag(P.weapon); P.reload=0; } }
  if(P.trailT>0){ P.trailT-=dt; P.trailAcc=(P.trailAcc||0)+dt; if(P.trailAcc>=0.45){ P.trailAcc=0; makeFire(P.x+Math.sin(P.yaw)*2.5,P.z+Math.cos(P.yaw)*2.5,0.6); } }
  if(P.jumpT>0){ P.jumpT-=dt; const k=1-Math.max(0,P.jumpT)/0.9, jy=Math.sin(k*Math.PI)*3.2;
    if(M){ M.obj.position.y+=jy; sheriff.position.y+=jy; }
    if(P.jumpT<=0){ aoeHit(P.x,P.z,4.5,sdmg(8),4); fxRing(P.x,P.z,4.5,0xffab40); burst(P.x,0.4,P.z,0xd9c29a,20); P.shake=Math.max(P.shake,0.35); sfx('thud'); } }
  for(let i=mBombs.length-1;i>=0;i--){ const b=mBombs[i]; b.t-=dt; b.m.scale.setScalar(1+0.15*Math.sin(b.t*30)); if(Math.random()<0.5) burst(b.x,0.9,b.z,0xffeb3b,1);
    if(b.t<=0){ scene.remove(b.m); mBombs.splice(i,1); explode(b.x,b.z,1.6*(1+0.06*(mLv('cart')-1)),1.2); } }
  for(let i=mRings.length-1;i>=0;i--){ const r=mRings[i]; r.life-=dt; const k=1-r.life/0.45; r.m.scale.setScalar((0.15+0.85*k)*r.r/4); r.m.material.opacity=0.85*(1-k);
    if(r.life<=0){ scene.remove(r.m); r.m.material.dispose(); mRings.splice(i,1); } }
}

let onlineRace=[], failedRace=[], lastRace=null;
function cleanRace(x){
  if(!x||typeof x!=='object') return null;
  const t=Math.floor(Number(x.t)), c=Math.floor(Number(x.c));
  if(!(t>=200 && t<36000) || !COURSES[c]) return null;
  return {name:String(x.name||'???').slice(0,12), t, c, mt:MOUNTS[x.mt]?String(x.mt):'horse', date:String(x.date||'').slice(0,40), ...(x.tt?{tt:String(x.tt).slice(0,12)}:{})};
}
const sameRace=(a,b)=>a&&b&&a.date===b.date&&a.name===b.name&&a.t===b.t;
function localRace(){ const a=LS.get('sheriffRaceRuns',[]); return Array.isArray(a)?a.map(cleanRace).filter(Boolean):[]; }
function localSaveRace(en){ const a=localRace(); a.push(en); a.sort((x,y)=>x.t-y.t); LS.set('sheriffRaceRuns',a.slice(0,45)); }
function raceRuns(c){ return ((((db||fb) && boardState!=='error') ? onlineRace.concat(failedRace) : localRace())).filter(r=>r.c===c && nameVisible(r.name)).sort((a,b)=>a.t-b.t||a.date.localeCompare(b.date)).slice(0,10); }
async function saveRace(en){
  saveNote='';
  if(fb){
    try{ const fields={name:{stringValue:en.name}, t:{integerValue:String(en.t)}, c:{integerValue:String(en.c)}, mt:{stringValue:en.mt}, date:{stringValue:en.date}}; if(en.tt) fields.tt={stringValue:en.tt};
      const r=await fetch(fbBase()+'/scores_race?key='+encodeURIComponent(fb.apiKey),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields})});
      if(!r.ok) throw new Error('HTTP '+r.status); if(!onlineRace.some(r2=>sameRace(r2,en))) onlineRace.push(en); }
    catch(e){ saveNote='온라인 순위표에 저장하지 못해 이 기기에만 저장했어요.'; failedRace.push(en); localSaveRace(en); }
    return;
  }
  if(db && myId){
    try{ const ref=db.collection('scores').doc(myId), snap=await ref.get(), d=snap.exists?snap.data():null;
      const rr=(d&&Array.isArray(d.race))?d.race.map(cleanRace).filter(Boolean):[]; rr.push(en);
      const keep=[]; for(const c of COURSES.keys()) keep.push(...rr.filter(r=>r.c===c).sort((a,b)=>a.t-b.t).slice(0,5));
      if(snap.exists) await ref.update({race:keep}); else await ref.set({race:keep});
      if(!onlineRace.some(r=>sameRace(r,en))) onlineRace.push(en); return;
    }catch(e){ saveNote='공용 순위표에 저장할 권한이 없어 이 기기에만 저장했어요.'; failedRace.push(en); localSaveRace(en); return; }
  }
  localSaveRace(en);
}
async function fbLoadRace(){
  const r=await fetch(fbBase()+':runQuery?key='+encodeURIComponent(fb.apiKey),{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({structuredQuery:{from:[{collectionId:'scores_race'}],orderBy:[{field:{fieldPath:'t'},direction:'ASCENDING'}],limit:150}})});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const rows=await r.json(), v=(f,k,t)=>f[k]?f[k][t]:undefined;
  return rows.filter(x=>x.document).map(x=>{ const f=x.document.fields||{}; return cleanRace({name:v(f,'name','stringValue'), t:v(f,'t','integerValue'), c:v(f,'c','integerValue'), mt:v(f,'mt','stringValue'), date:v(f,'date','stringValue'), tt:v(f,'tt','stringValue')}); }).filter(Boolean);
}

function hzMesh(h){

  if(e.ph2 && !e.hidden){ e.hzT-=dt; if(e.hzT<=0){ e.hzT=Math.max(4,6.5-0.25*(e.tier||1)); if(hazards.length<14) spawnBossHazard(e); } }
}
function segDist(px,pz,h){ const dx=-Math.sin(h.a), dz=-Math.cos(h.a), rx=px-h.x, rz=pz-h.z, t=Math.max(0,Math.min(h.L,rx*dx+rz*dz)); return Math.hypot(rx-dx*t,rz-dz*t); }
function hzHits(x,z,h){ // 이 위치가 지금 맞는지
  if(h.t==='quick'||h.t==='tornado'||h.t==='wisp') return Math.hypot(x-h.x,z-h.z)<h.r;
  if(h.t==='rock') return Math.hypot(x-h.x,z-h.z)<h.r;
  if(h.t==='crack') return segDist(x,z,h)<h.w/2+0.5;
  return Math.hypot(x-h.bx,z-h.bz)<h.rad+0.7;
}
function updateHazards(dt){
  P.hzSlow=1;
  const SG=sharedHost()?sharedGuests():[];
  for(let i=hazards.length-1;i>=0;i--){ const h=hazards[i]; h.age+=dt; h.life-=dt; h.tick-=dt;
    const hurtAll=(dmg,kind,once)=>{ if(once){ if(!h.hitMe && hzHits(P.x,P.z,h)){ h.hitMe=1; hurtPlayer(dmg,kind); } for(const g of SG){ h.hitF=h.hitF||{}; if(!h.hitF[g.id] && hzHits(g.x,g.z,h)){ h.hitF[g.id]=1; hitFriend(g,dmg); } } }
      else { if(hzHits(P.x,P.z,h)) hurtPlayer(dmg,kind); for(const g of SG) if(hzHits(g.x,g.z,h)) hitFriend(g,dmg); } };
    if(h.t==='quick'){ if(h.spin) h.spin.rotation.z+=dt; if(hzHits(P.x,P.z,h)) P.hzSlow=0.5; if(h.tick<=0){ h.tick=0.5; hurtAll(h.dmg,'melee'); } h.g.children[0].material.opacity=0.75*Math.min(1,h.life); }
    else if(h.t==='rock'){ const k=Math.min(1,h.age/h.warn); h.rock.position.y=22*(1-k*k)+0.7; h.rock.rotation.x+=dt*4;
      if(h.age>=h.warn && !h.st){ h.st=1; burst(h.x,0.6,h.z,0x8d8478,20); P.shake=Math.max(P.shake,0.3); sfx('thud'); hurtAll(h.dmg,'ranged',true); } }
    else if(h.t==='crack'){ if(h.age>=h.warn && !h.st){ h.st=1; h.line.material.color.setHex(0xff5722); h.line.material.opacity=0.85; h.line.scale.y=12; sfx('boom');
        for(let k=0;k<10;k++){ const t=Math.random()*h.L; burst(h.x-Math.sin(h.a)*t,0.5,h.z-Math.cos(h.a)*t,0x8d6e63,4); } hurtAll(h.dmg,'melee',true); } }
    else if(h.t==='boulder'||h.t==='barrel'){
      if(h.age>=h.warn){ if(!h.st){ h.st=1; h.ball.visible=true; } const t=(h.age-h.warn)*h.sp; h.bx=h.x-Math.sin(h.a)*t; h.bz=h.z-Math.cos(h.a)*t; h.ball.position.z=-t; h.ball.rotation.x-=dt*h.sp/1.6;
        if(h.st===1 && (hzHits(P.x,P.z,h) || SG.some(g=>hzHits(g.x,g.z,h)))){ h.st=2; if(h.t==='barrel'){ bossBoom(h.bx,h.bz,h.dmg,4.5); h.life=0; } else { hurtAll(h.dmg,'melee',true); h.st=1; } }
        if(h.t==='barrel' && h.life<=0.05 && h.st===1){ h.st=2; bossBoom(h.bx,h.bz,h.dmg,4.5); } } }
    else { // 회오리·망령
      const tx=P.x, tz=P.z, d=Math.hypot(tx-h.x,tz-h.z)||1; h.x+=(tx-h.x)/d*h.sp*dt+Math.sin(h.age*2)*dt*2; h.z+=(tz-h.z)/d*h.sp*dt+Math.cos(h.age*2)*dt*2; h.g.position.set(h.x,0,h.z); h.spin.rotation.y+=dt*6;
      if(d<h.r+4 && d>0.3 && !(P.iframe>0)){ P.x+=(h.x-P.x)/d*h.pull*dt; P.z+=(h.z-P.z)/d*h.pull*dt; }
      if(h.tick<=0){ h.tick=0.5; hurtAll(h.dmg,'melee'); }
      if(Math.random()<0.4) burst(h.x+(Math.random()-0.5)*h.r,0.5+Math.random()*4,h.z+(Math.random()-0.5)*h.r,h.t==='wisp'?0x80d8ff:0xbcaaa4,1); }
    if(h.life<=0 || (h.t!=='tornado'&&h.t!=='wisp'&&h.t!=='quick'&&!h.tumble&&!enemies.some(e=>e.boss) && h.st)){ removeHazard(h); hazards.splice(i,1); }
  }
  if(!enemies.some(e=>e.boss && !e.mirror) && !sharedGuest()) for(let i=hazards.length-1;i>=0;i--){ const h=hazards[i]; if(h.t==='quick'||h.t==='tornado'||h.t==='wisp'){ h.life=Math.min(h.life,0.6); } }
}
// ---------- 협동: 방장의 지형 공격을 친구 화면에도 ----------
function hzSnap(){ const r1=v=>Math.round(v*10); return hazards.slice(0,10).map(h=>[h.id, HZ_T.indexOf(h.t), r1(h.x), r1(h.z), Math.round((h.a||0)*100), h.st, r1(h.r||h.L||0), r1(h.age)]); }
function hzMirror(list,dt){
  const seen=new Set(); P.hzSlow=1;
  for(const a of (list||[])){ const [id,ti,x,z,an,st,r,age]=a, t=HZ_T[ti]; if(!t) continue; seen.add(id);
    let h=mirrorHz.get(id);
    if(!h){ h={id,t,x:x/10,z:z/10,a:an/100,st,age:age/10,mirror:true,r:r/10,L:r/10,w:2.6,warn:1.2,sp:16,rad:1.7}; h.g=hzMesh(h); mirrorHz.set(id,h); }
    h.x=x/10; h.z=z/10; h.age=Math.max(h.age,age/10); h.g.position.set(h.x,0,h.z);
    if(t==='quick'){ if(Math.hypot(P.x-h.x,P.z-h.z)<h.r) P.hzSlow=0.5; }
    if(t==='rock' && h.rock){ const k=Math.min(1,h.age/1.3); h.rock.position.y=22*(1-k*k)+0.7; }
    if((t==='boulder'||t==='barrel') && st>=1 && h.ball){ h.ball.visible=true; h.ball.position.z=-Math.max(0,(h.age-1.3)*16); }
    if(t==='crack' && st && h.line){ h.line.material.opacity=0.85; }
    if(h.spin) (t==='quick'?h.spin.rotation.z+=dt:h.spin.rotation.y+=dt*6);
    h.age+=dt;
  }
  for(const [id,h] of mirrorHz) if(!seen.has(id)){ removeHazard(h); mirrorHz.delete(id); }
}

const I18N=new Map(I18N_RAW.split('\n').filter(l=>l.includes('|')).map(l=>{ const i=l.indexOf('|'); return [l.slice(0,i), l.slice(i+1)]; }));
const I18N_RE=new RegExp([...I18N.keys()].sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
const I18N_EXACT={'나':'Me','시작':'Start','크게':'Large','아주 크게':'Extra large','보통':'Normal','끔':'Off'};
const trCache=new Map();
function tr(s){
  if(LANG!=='en' || !s || !/[가-힣]/.test(s)) return s;
  let r=trCache.get(s); if(r!==undefined) return r;
  if(I18N_EXACT[s.trim()]) return I18N_EXACT[s.trim()];
  const ord=n=>n+(['th','st','nd','rd'][(n%100>10&&n%100<14)?0:Math.min(n%10,4)%4]||'th');
  r=s.replace(/총 (\d+)장/g,'$1 chapters').replace(/(\d+)장(?=\s?[·:]|\s시작|$)/g,'Ch. $1').replace(/(\d+)\s?시간/g,'$1 h').replace(/(\d+)일 연속/g,'$1-day streak').replace(/^(\d+)일$/,'Day $1').replace(/(\d+)\s?바퀴/g,'$1 laps').replace(/(\d)\s?초/g,'$1s').replace(/(\d)\s?분/g,'$1 min').replace(/(\d+)\s?등/g,(m,n)=>ord(+n)).replace(/(\d)\s?명/g,'$1 players').replace(/(\d)\s?마리/g,'$1').replace(/(\d)\s?점/g,'$1 pts').replace(/(\d)\s?번/g,'$1×').replace(/(\d)\s?단계/g,'tier $1');
  r=r.replace(I18N_RE,m=>I18N.get(m)).replace(/(\d)\s?개(?![가-힣])/g,'$1').replace(/(\d+)s마다/g,'every $1 s').replace(/Wave마다/g,'each wave').replace(/([A-Za-z0-9)])(으로|에서|을|를|이|가|은|는|과|와|로|에|의)(?=[\s·,.!?)~]|$)/g,'$1');
  if(trCache.size>4000) trCache.clear(); trCache.set(s,r); return r;
}
let trBusy=false;
function trNode(root){
  if(LANG!=='en') return;
  trBusy=true;
  try{
    if(root.nodeType===3){ if(root.parentElement && root.parentElement.closest('.nm,.mpnm,[data-notr]')) return; const v=root.nodeValue, t=tr(v); if(t!==v) root.nodeValue=t; }
    else if(root.nodeType===1){
      const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement && n.parentElement.closest('.nm,.mpnm,[data-notr],input,textarea') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT}); let n; while((n=w.nextNode())){ const v=n.nodeValue, t=tr(v); if(t!==v) n.nodeValue=t; }
      const els=root.querySelectorAll ? [root,...root.querySelectorAll('[placeholder],[title]')] : [];
      for(const el of els){ if(!el.getAttribute) continue; for(const a of ['placeholder','title']){ const v=el.getAttribute(a); if(v){ const t=tr(v); if(t!==v) el.setAttribute(a,t); } } }
    }
  } finally { trBusy=false; }
}
const trObs=new MutationObserver(list=>{ if(trBusy || LANG!=='en') return; for(const m of list){ if(m.type==='characterData') trNode(m.target); else for(const n of m.addedNodes) trNode(n); } });
function setLang(l){ LANG=l; SET.lang=l; saveSet(); if(l==='ko'){ if(mode==='play'||mode==='paused'||mode==='settings'){ toast('🌐 한국어로 바꿨어요','다음 판부터 모두 한국어로 보여요'); } else { location.reload(); return; } } applyLang(); if(mode==='menu') showMenu(); }
function applyLang(){
  document.documentElement.lang=LANG;
  document.title = LANG==='en' ? 'Badge of the Frontier - Hold the Town, Sheriff!' : '황야의 배지 - 마을을 지켜라, 보안관!';
  trObs.disconnect();
  if(LANG==='en'){ trObs.observe(document.body,{childList:true,subtree:true,characterData:true}); trNode(document.body); }

  const local=()=>{ const a=localCards(); a.push(en); a.sort((x,y)=>y.score-x.score); LS.set('sheriffCardsRuns',a.slice(0,20)); };
  if(fb){ try{ const f={name:{stringValue:en.name}, score:{integerValue:String(en.score)}, wave:{integerValue:String(en.wave)}, date:{stringValue:en.date}}; if(en.tt) f.tt={stringValue:en.tt};
      const r=await fetch(fbBase()+'/scores_cards?key='+encodeURIComponent(fb.apiKey),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:f})}); if(!r.ok) throw new Error('HTTP '+r.status); onlineCards.push(en); }
    catch(e){ saveNote='온라인 순위표에 저장하지 못해 이 기기에만 저장했어요.'; failedCards.push(en); local(); } return; }
  if(db && myId){ try{ const ref=db.collection('scores').doc(myId), snap=await ref.get(), d=snap.exists?snap.data():null; const cc=(d&&Array.isArray(d.cards)?d.cards.map(cleanCards).filter(Boolean):[]); cc.push(en); cc.sort((a,b)=>b.score-a.score);
      if(snap.exists) await ref.update({cards:cc.slice(0,10)}); else await ref.set({cards:cc.slice(0,10)}); onlineCards.push(en); return; }
    catch(e){ saveNote='공용 순위표에 저장할 권한이 없어 이 기기에만 저장했어요.'; failedCards.push(en); local(); return; } }
  local();
}
async function fbLoadCards(){
  const r=await fetch(fbBase()+':runQuery?key='+encodeURIComponent(fb.apiKey),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({structuredQuery:{from:[{collectionId:'scores_cards'}],orderBy:[{field:{fieldPath:'score'},direction:'DESCENDING'}],limit:30}})});
  if(!r.ok) throw new Error('HTTP '+r.status); const rows=await r.json(), v=(f,k,t)=>f[k]?f[k][t]:undefined;
  return rows.filter(x=>x.document).map(x=>{ const f=x.document.fields||{}; return cleanCards({name:v(f,'name','stringValue'), score:v(f,'score','integerValue'), wave:v(f,'wave','integerValue'), date:v(f,'date','stringValue'), tt:v(f,'tt','stringValue')}); }).filter(Boolean);
}

function updateBounty(dt){
  if(!bounty || bounty.done) return;
  const B=bounty.B;
  if(B.type==='boss'){
    if(!enemies.some(e=>e.boss) && toSpawn===0){ bounty.spawnT-=dt;
      if(bounty.spawnT<=0){ if(bounty.bi>=B.bosses.length){ bountyFinish(true); return; } bossSpawned=B.tier-1-(D().bossTier||0); const k=B.bosses[bounty.bi++]; spawnBoss(k); const b=enemies.find(e=>e.boss&&e.kind===k); if(b) b.gearFree=1; bounty.spawnT=2.5; } }
  } else if(B.type==='hunt'||B.type==='survive'){
    bounty.spawnT-=dt; const cap=B.type==='survive'?Math.min(22,8+bounty.t/5):10;
    if(bounty.spawnT<=0 && enemies.length<cap){ spawnEnemy(); bounty.spawnT=B.type==='survive'?Math.max(0.35,1.0-bounty.t/120):0.8; }
    if(B.type==='hunt' && bounty.kills>=B.n){ bountyFinish(true); return; }
    if(B.type==='survive' && bounty.t>=B.lim){ bountyFinish(true); return; }
  }
}

function raceItemsSetup(){

  const n=race.n;
  for(let i=0;i<n;i++){ if(i%2) continue; const a=race.gates[i], b=race.gates[(i+1)%n];
    for(const off of [-3,0,3]){ const dx=b.x-a.x, dz=b.z-a.z, dl=Math.hypot(dx,dz)||1, x=(a.x+b.x)/2+(-dz/dl)*off, z=(a.z+b.z)/2+(dx/dl)*off;
      const m=new THREE.Mesh(boxGeo(1.1,1.1,1.1),new THREE.MeshLambertMaterial({color:0xffca28,emissive:0x664400,transparent:true,opacity:0.92})); m.position.set(x,1.1,z); raceG.add(m);

}

function todoState(){

function towerSpawn(){

function startReplay(c){
  const gs=LS.get('sheriffRaceGhost'+c,null); if(!gs || !gs.pts || !MOUNTS[gs.mt]){ toast('🎞 이 코스에는 아직 내 최고 기록이 없어요'); return; }
  startRace({c, mount:gs.mt, bots:false, ghost:false, force:true, replay:gs});
  race.state='go'; race.rt=0; race.spd=1; showMsg('🎞 최고 기록 리플레이',2,'⏱ '+fmtRace(gs.t)+' · 📷 '+(TOUCH?'📷 버튼':'O 키')+'로 사진 · 1/2/3 키로 속도');
}
function replayTick(dt){
  const R=race.replay, pts=R.pts; race.rt+=dt*race.spd; const f=race.rt*10, i=Math.min(pts.length-1,Math.floor(f)), j=Math.min(pts.length-1,i+1), u=f-Math.floor(f);
  const A=pts[i], B=pts[j]; P.x=(A[0]+(B[0]-A[0])*u)/10; P.z=(A[1]+(B[1]-A[1])*u)/10; P.yaw=A[2]/100+(((B[2]-A[2])/100+Math.PI*3)%(Math.PI*2)-Math.PI)*u; P.lastYaw=P.yaw;
  const M=curMount(); if(M){ P.walk+=dt*M.gait*race.spd; M.obj.position.set(P.x,Math.abs(Math.sin(P.walk))*M.bob,P.z); M.obj.rotation.y=P.yaw; sheriff.position.set(P.x,M.seat,P.z); sheriff.rotation.y=P.yaw; (M.obj.userData.legs||[]).forEach(([g,s])=>g.rotation.x=Math.sin(P.walk)*0.8*s); }
  const ht='🎞 리플레이 · ⏱ '+fmtRace(Math.min(race.rt,R.t))+' / '+fmtRace(R.t)+' · ×'+race.spd+' (1·2·3)';
  if(raceHud.textContent!==ht) raceHud.textContent=ht; raceHud.style.display=mode==='play'?'block':'none';
  if(race.rt>=R.t+1 && !race.done){ race.done=true; mode='over'; try{ document.exitPointerLock(); }catch(e){} raceHud.style.display='none';
    showOverlay('<h1>🎞 리플레이 끝</h1><p>'+race.C.name+' · ⏱ '+fmtRace(R.t)+'</p><button id="rpAgain">🔁 다시 보기</button><button class="sec" id="rpMenu">🏇 경주 메뉴</button>',false);
    const c=race.c; $('rpAgain').onclick=()=>startReplay(c); $('rpMenu').onclick=()=>{ raceCleanup(); runMode='normal'; openRace(); }; }
}

// ---------- ⚡ 무대 장식 합치기 (그리기 횟수 줄이기) ----------
function mergeDecor(){
  decor.updateMatrixWorld(true);
  const groups=new Map(), drop=[];
  decor.traverse(o=>{
    if(!o.isMesh || o.isInstancedMesh || !o.geometry || !o.geometry.attributes.position) return;
    const g=o.geometry, attrs=Object.keys(g.attributes).filter(a=>a==='position'||a==='normal'||a==='color').sort().join(',');
    if(!g.attributes.normal) return;
    const key=o.material.uuid+'|'+attrs+'|'+(o.castShadow?1:0)+(o.receiveShadow?1:0);
    if(!groups.has(key)) groups.set(key,{mat:o.material, attrs:attrs.split(','), list:[], cast:o.castShadow, recv:o.receiveShadow});
    groups.get(key).list.push(o);
  });
  let before=0, after=0;
  for(const G of groups.values()){
    before+=G.list.length; if(G.list.length<2){ after++; continue; }
    const parts=G.list.map(o=>{ let g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone(); g.applyMatrix4(o.matrixWorld); return g; });
    const total=parts.reduce((a,g)=>a+g.attributes.position.count,0), out=new THREE.BufferGeometry();
    for(const a of G.attrs){ const it=parts[0].attributes[a].itemSize, arr=new Float32Array(total*it); let off=0; for(const g of parts){ arr.set(g.attributes[a].array, off); off+=g.attributes[a].array.length; } out.setAttribute(a,new THREE.BufferAttribute(arr,it)); }
    parts.forEach(g=>g.dispose()); out.computeBoundingSphere();
    const m=new THREE.Mesh(out,G.mat); m.castShadow=G.cast; m.receiveShadow=G.recv; m.matrixAutoUpdate=false;
    for(const o of G.list){ drop.push(o); }
    m.userData.merged=1; decor.add(m); after++;
  }
  for(const o of drop){ if(o.parent) o.parent.remove(o); if(!o.geometry.userData.cached) o.geometry.dispose(); }
  // 빈 그룹 정리
  for(const c of decor.children.slice()) if(c.isGroup && !c.children.length) decor.remove(c);
  return {before, after};
}

const BACKUP_KEYS=['sheriffName','sheriffCoins','sheriffLv','sheriffStats','sheriffAch','sheriffOwned','sheriffLook','sheriffDex','sheriffKits','sheriffDog','sheriffDogXp','sheriffHpPerm','sheriffGarage','sheriffPets','sheriffPet','sheriffSeason','sheriffOffice','sheriffBounty','sheriffRaceBest','sheriffMiniBest','sheriffGPWins','sheriffDailyKinds','sheriffRole','sheriffSet','sheriffKeys','sheriffBtnPos','sheriffBtnScale','sheriffUnlockAll','sheriffFeatSeen','sheriffTips','sheriffFriends','sheriffLeague','sheriffBoard','sheriffCardsRuns','sheriffTowerRuns','sheriffRaceRuns','sheriffDuel','sheriffRush','sheriffEvent','gunGame3DBest','sheriffDiff','sheriffMode'];
function b64enc(str){ const bytes=new TextEncoder().encode(str); let bin=''; for(let i=0;i<bytes.length;i+=8192) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192)); return btoa(bin); }
function b64dec(b){ const bin=atob(b), bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
function checksum(s){ let h=2166136261; for(let i=0;i<s.length;i++) h=Math.imul(h^s.charCodeAt(i),16777619)>>>0; return h.toString(36); }
function makeBackup(){
  const d={v:1, at:new Date().toISOString(), k:{}};
  for(const k of BACKUP_KEYS){ try{ const v=localStorage.getItem(k); if(v!==null) d.k[k]=v; }catch(e){} }
  const body=b64enc(JSON.stringify(d)); return 'SHERIFF1-'+checksum(body)+'-'+body;
}
function readBackup(code){
  code=String(code||'').trim().replace(/\s+/g,'');
  const m=/^SHERIFF1-([0-9a-z]+)-(.+)$/.exec(code); if(!m) return {err:'백업 코드 모양이 아니에요 (SHERIFF1- 로 시작해야 해요)'};
  if(checksum(m[2])!==m[1]) return {err:'코드가 잘렸거나 바뀌었어요. 처음부터 끝까지 모두 복사했는지 확인해 주세요'};
  try{ const d=JSON.parse(b64dec(m[2])); if(!d || !d.k) throw 0; return {d}; }catch(e){ return {err:'코드를 읽지 못했어요'}; }
}

function buildTrophies(){

  const g=new THREE.Group(), wood=lam(0x5d3a1a);

function monthKey(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1); }
function monthBoss(){ const ks=['gunner','bull','snake','miner','ghost','gang','eagle','golem','twins','lava','croc','cav'], d=new Date(); return ks[(d.getFullYear()*12+d.getMonth())%ks.length]; }
var sboss=null;
function startSBoss(){
  pendingRun='sboss'; startGame(playerName||(($('nameIn')||{}).value)||''); if(mode!=='play'){ pendingRun=null; return; }
  sboss={t:0, spawned:false, kind:monthBoss()}; const st=bossStage(sboss.kind); applyTheme((st>=0?st:0)%10,[{x:0,z:0}]); markPlayed('sboss');
  showMsg('🌟 이달의 보스',3,'황금빛 '+BOSSES[sboss.kind].name+' · 처음부터 2페이즈!');
}
function updateSBoss(dt){
  if(!sboss) return; sboss.t+=dt;
  if(!sboss.spawned && sboss.t>2.5){ sboss.spawned=true; bossSpawned=Math.min(8,3+Math.floor(prog.lv/8)); spawnBoss(sboss.kind);
    for(const B of enemies.filter(e=>e.boss)){ B.maxHp=Math.round(B.maxHp*1.3); B.hp=B.maxHp; B.name='🌟 황금빛 '+B.name; B.ph2=1; B.hzT=2; B.baseEm=0x5a4200; setEmissive(B,B.baseEm); B.shockDmg=B.shockDmg||Math.round(B.dmg*0.8); } toSpawn=0; }
  if(sboss.spawned && !enemies.some(e=>e.boss)){ sbossWin(); return; }
  const B=enemies.find(e=>e.boss), ht='🌟 이달의 보스 · ⏱ '+fmtTime(Math.round(sboss.t*10)/10)+(B?' · '+Math.round(B.hp/B.maxHp*100)+'%':'');
  if(raceHud.textContent!==ht) raceHud.textContent=ht; raceHud.style.display=mode==='play'?'block':'none';
}
function sbossWin(){
  const t=Math.round(sboss.t*10)/10, mk=monthKey(), rec=LS.get('sheriffSBoss',{}), first=rec.m!==mk;
  const best=first||!rec.t||t<rec.t; LS.set('sheriffSBoss',{m:mk, t:best?t:rec.t}); sboss=null;
  const c=first?300:50; addCoins(c); gainXP(150); if(first){ track('sbossWin'); seasonStar(3,'이달의 보스'); }
  mode='over'; try{ document.exitPointerLock(); }catch(e){} raceHud.style.display='none'; sfx('reward');
  showOverlay('<h1>🌟 이달의 보스 격파!</h1><p>⏱ '+fmtTime(t)+(best?' · 🎉 이달 최고 기록':'')+'</p><p>💰 +'+c+(first?' (이달 첫 격파 보너스)':'')+'</p><button id="sbAgain">🔁 다시 도전</button><button class="sec" id="sbMenu">🏠 시작 화면</button>',false);
  $('sbAgain').onclick=startSBoss; $('sbMenu').onclick=showMenu;
}

function mpGhostDance(G,fp,riding,down){
  const u=G.g.userData;
  if(fp.dn && !riding && !down){
    const tt=performance.now()/1000*Math.PI*4;
    G.g.position.y=Math.abs(Math.sin(tt/2))*0.18; G.g.rotation.y=G.yw+Math.sin(tt*0.4)*0.6;
    u.armR.rotation.set(2+Math.sin(tt)*0.45,0,0.2); u.armL.rotation.set(2-Math.sin(tt)*0.45,0,-0.2);
    u.legL.rotation.x=Math.max(0,Math.sin(tt/2))*0.9; u.legR.rotation.x=Math.max(0,-Math.sin(tt/2))*0.9; G.dn=1;
  } else if(G.dn){ G.dn=0; u.armR.rotation.set(0,0,0); u.armL.rotation.set(0,0,0); }
  // 방장이 축하 무대를 열면 친구 화면에서도 같이 춤추기
  if(fp.host && fp.dn===1 && typeof sharedGuest==='function' && sharedGuest() && mode==='play' && !celeb && !P.down && fp.wv && celebratedWave!==fp.wv){
    celebratedWave=fp.wv; startCelebration(fp.wv);

}

const GH_OFF=23328;   // 36^3/2
function ghostEncode(pts){
  let s=''; for(let i=0;i<pts.length;i+=2){ const p=pts[i]; const yw=((p[2]%628)+628)%628;
    for(const v of [p[0]+GH_OFF, p[1]+GH_OFF, yw]) s+=Math.max(0,Math.min(46655,Math.round(v))).toString(36).padStart(3,'0'); }
  return s;
}
function ghostDecode(s){
  const raw=[]; for(let i=0;i+9<=s.length;i+=9){ raw.push([parseInt(s.slice(i,i+3),36)-GH_OFF, parseInt(s.slice(i+3,i+6),36)-GH_OFF, parseInt(s.slice(i+6,i+9),36)]); }
  const out=[]; for(let i=0;i<raw.length;i++){ const A=raw[i], B=raw[i+1]||A; out.push(A); let dy=B[2]-A[2]; if(dy>314) dy-=628; if(dy<-314) dy+=628; out.push([(A[0]+B[0])/2,(A[1]+B[1])/2,A[2]+dy/2]); }
  return out;
}

function update(dt){
  if(celeb){ updateCelebration(dt); return; }
  if(cine){ updateCine(dt); return; }
  if(vpose){ updateVPose(dt); return; }
  if(vposeQ>0){ vposeQ-=dt; if(vposeQ<=0) startVPose('boss'); }

  // ---- 시점 ----
  if(!locked && !TOUCH){
    const ax=(mouse.nx-0.5)*2, ay=(mouse.ny-0.5)*2;
    if(Math.abs(ax)>0.3) P.yaw -= Math.sign(ax)*(Math.abs(ax)-0.3)*3*dt;
    if(Math.abs(ay)>0.3) P.pitch -= Math.sign(ay)*(Math.abs(ay)-0.3)*2*dt;
  }
  if(keys.KeyQ) P.yaw += 2*dt;
  if(keys.KeyE) P.yaw -= 2*dt;
  P.pitch = Math.max(-0.6, Math.min(0.5, P.pitch));

  { const Mt=curMount(); if(Mt && Mt.slowTurn && P.lastYaw!==undefined){ let dy=Math.atan2(Math.sin(P.yaw-P.lastYaw),Math.cos(P.yaw-P.lastYaw)); P.yaw=P.lastYaw+dy*0.55; } P.lastYaw=P.yaw; }

  // ---- 이동 ----

  if(P.dodgeT>0 && !M0){ const k=1-P.dodgeT/DODGE_TIME; sheriff.rotation.x=-k*Math.PI*2; sheriff.position.y=Math.sin(k*Math.PI)*(ruleIs('lowg')?2.4:0.7); }

  SH.armR.rotation.x = P.pitch + (P.reload>0?0.5:0);

  } else if(autoWave && wave>0 && wave%20!==0 && !mission){

  if(toSpawn>0){

    if(spawnT<=0 && enemies.length<45){ { const ne=spawnEnemy(); if(mission && mission.obj && Math.random()<0.55) ne.toW=true; } toSpawn--; spawnT=Math.max(0.3,(bossAlive?1.8:1.1)-wave*0.06); }
  }

  // ---- 적 ----
  const poisonDead=[], edt=dt*wxSlow()*(ruleIs('lowg')?0.85:1);
  for(const e of enemies){
    const p=e.mesh.position;
    if(!e.mutd){ e.mutd=1; applyMuts(e); }
    const tw = e.toW && mission && mission.obj; let tX = tw ? mission.obj.x : P.x, tZ = tw ? mission.obj.z : P.z;
    if(!tw && SG.length){ let best=P.down?1e9:Math.hypot(P.x-p.x,P.z-p.z); for(const g of SG){ const dg=Math.hypot(g.x-p.x,g.z-p.z); if(dg<best){ best=dg; tX=g.x; tZ=g.z; } } }
    const dx=tX-p.x, dz=tZ-p.z, d=Math.hypot(dx,dz)||1, ux=dx/d, uz=dz/d;

      if(e.pull){ const px=e.pull.x-p.x, pz=e.pull.z-p.z, pd=Math.hypot(px,pz); if(pd<0.3) e.pull=null; else { const st=Math.min(pd,22*dt); p.x+=px/pd*st; p.z+=pz/pd*st; if(Math.random()<0.5) burst(p.x,0.3,p.z,0xd9c29a,1); } } if(Math.random()<0.15) burst(p.x,0.3,p.z,0xb0b4ba,1); }
    else if(e.bounty) ms=updateBountyMove(e,edt,ux,uz);
    else if(AI) ms=AI(e,e.ph2?edt*1.3:edt,ux,uz,d);
    else { p.x+=ux*e.speed*edt; p.z+=uz*e.speed*edt; e.mesh.rotation.y=Math.atan2(-ux,-uz); ms=e.speed; }
    if(!(e.kind==='bull'&&e.state==='charge') && !e.hidden){ pushOut(p,e.rad); clampArena(p,1.5); }
    if(muts.regen && e.hp>0 && e.hp<e.maxHp) e.hp=Math.min(e.maxHp, e.hp+e.maxHp*0.02*muts.regen*dt);
    bossTick(e,dt);
    if(e.boss && e.tier>=2 && !e.hidden){
      e.summon-=dt;
      if(e.summon<=0){ e.summon=Math.max(4,8-0.5*e.tier); summonMinions(e); }
    }
    if(e.poisonT>0 && !e.invuln){
      e.poisonT-=dt; e.pAcc=(e.pAcc||0)+dt*(2+e.maxHp*0.02);
      if(e.pAcc>=1){ const pd=Math.floor(e.pAcc); e.pAcc-=pd; e.hp-=pd; if(Math.random()<0.4) burst(p.x,1.2*e.s,p.z,0x76ff03,2); if(e.hp<=0) poisonDead.push(e); }
    }
    e.ph+=dt*ms*2.4;
    for(const [g,s] of e.legs) g.rotation.x = ms>0?Math.sin(e.ph)*0.7*s:0;
    if(e.flash>0){ e.flash-=dt; if(e.flash<=0) setEmissive(e, e.state==='windup'?0x660000:(e.baseEm||0)); }
    e.atk=Math.max(0,e.atk-dt); e.trample=Math.max(0,e.trample-dt);

    if(!(e.held>0) && !e.dummy && !e.noMelee && e.kind!=='bull' && !(e.kind==='calf'&&e.state==='charge') && !e.hidden && e.kind!=='decoy' && nd<e.rad+(M0?M0.rad:0.6) && e.atk<=0){ e.atk=0.8; hurtPlayer(e.dmg,'melee'); if(P.relics.includes('thorn')) hitEnemy(e,2,false); }

    if(e.kind==='bull' && e.state==='chase' && nd<e.rad+0.8 && e.atk<=0){ e.atk=1.0; hurtPlayer(e.dmg,'melee'); }

    if(M0 && moving && !e.hidden && p.y<2 && nd<e.rad+M0.reach && e.trample<=0){

  // ---- 적 총알 ----
  for(let i=ebullets.length-1;i>=0;i--){

    for(const o of obstacles) if(Math.hypot(m.x-o.x,m.z-o.z)<o.r){ b.life=0; break; }
    if(Math.hypot(m.x,m.z)>ARENA) b.life=0;
    if(b.life<=0){ scene.remove(b.mesh); ebullets.splice(i,1); }
  }

  }
  // ---- 다이너마이트 / 폭발 ----
  for(let i=dynamites.length-1;i>=0;i--){
    const dn=dynamites[i], m=dn.mesh.position; dn.life-=dt;
    dn.vy-=dn.g*dt; m.x+=dn.vx*dt; m.y+=dn.vy*dt; m.z+=dn.vz*dt;
    dn.mesh.rotation.x+=dt*12; dn.mesh.rotation.z+=dt*7;

  for(let i=puddles.length-1;i>=0;i--){
    const pu=puddles[i]; pu.life-=dt; pu.tick-=dt;

      else if(it.type==='ammo'){ P.ammo=P.ammo.map((a,k)=>Math.min(wMag(k),a+Math.ceil(wMag(k)/2))); sfx('pickup'); mpGift(); tutEvent('pick'); }

    }

  updateCorpses(dt); updateWeather(dt); updateHostage(dt); updateDog(dt); updateTraps(dt); updateMission(dt); updateFloaters(dt); updateFires(dt); updateTrain(dt); updatePet(dt);
  // ---- 파티클 / 트레이서 ----
  for(let i=particles.length-1;i>=0;i--){
    const q=particles[i]; q.life-=dt; q.vy-=(ruleIs('lowg')?5:18)*dt;

  }
  for(let i=tracers.length-1;i>=0;i--){
    const t=tracers[i]; t.life-=dt; t.line.material.opacity=Math.max(0,t.life/0.07);
    if(t.life<=0){ scene.remove(t.line); t.line.geometry.dispose(); t.line.material.dispose(); tracers.splice(i,1); }
  }

  P.hurt=Math.max(0,P.hurt-dt);
  if(popT>0){ popT-=dt; if(popT<=0) $('pop').style.opacity=0; }
  if(msgT>0){ msgT-=dt; if(msgT<=0) $('msg').style.opacity=0; }

}

function gameOver(){
  if(mode==='over') return;
  if(runMode==='raid' && raid){ raidEnd(false); return; }   // 같은 순간 두 번 불려도 한 번만 (이야기 실패 화면이 덮이지 않게)
  if(runMode==='bounty'){ bountyFinish(false); return; }
  if(runMode==='story' && story && !mp){ garageSave(); track('games'); storyFail(); return; }
  if(runMode==='sboss'){ sboss=null; raceHud.style.display='none'; }
  garageSave(); track('games'); if(tut) endTut(false); invitePayAfterGame();
  ghostSave();
  if(runMode==='rush' && rush){ rushEnd(false); return; }
  mode='over'; mouse.down=false; bossAlive=null; sfx('over'); vib(300);
  if(score>best){ best=score; try{ localStorage.setItem('gunGame3DBest',best); }catch(e){} }
  try{ document.exitPointerLock(); }catch(e){}
  const entry = {name:playerName, score, wave, bosses:bossKills, date:new Date().toISOString(), diff, tt:titleOf(prog.lv)};
  const earned=Math.floor(score/10*(runMode==='event'?2:runMode==='daily'?todayRule().coin:1)); addCoins(earned); dailyEnd();
  if(runMode==='normal' && wave>=6) todoDone('classic'); if(bossKills>0) todoDone('boss'); if(runMode==='cards') todoDone('cards'); if(runMode==='daily') todoDone('daily');
  const xg=gainXP(runXP());
  seasonStar(Math.floor(wave/5),'웨이브 '+wave);
  boardTab = runMode==='event' ? 'event' : diff;
  lastEntry = entry;
  showOverlay('<h1>GAME OVER</h1><p>🤠 <b id="ovName"></b> · '+(runMode==='event'?'🎉 '+curEvent().name:runMode==='daily'?todayRule().icon+' '+todayRule().name:D().icon+' '+D().name)+' · 점수 <b>'+score+'</b> · 웨이브 <b>'+wave+'</b> · 보스 <b>'+bossKills+'</b></p>'
    +'<p>💰 코인 <b>+'+earned+'</b> (보유 '+coins.toLocaleString()+') · ⭐ 경험치 <b>+'+xg.gained+'</b> (Lv '+prog.lv+(xg.ups?' 레벨 업!':'')+')</p>'

const mm=$('minimap'), mctx=mm.getContext('2d'); let mmFrame=0;
const ITEM_COL = {hp:'#66bb6a', ammo:'#42a5f5', chest:'#ffd54f', relic:'#b388ff'};
function drawMinimap(){
  const css=mm.clientWidth; if(!css) return;
  const dpr=Math.min(devicePixelRatio||1,2), W=Math.round(css*dpr);
  if(mm.width!==W){ mm.width=W; mm.height=W; }
  const c=mctx, R=W/2, sc=(R-5*dpr)/ARENA, t=performance.now()/1000;
  const fx=-Math.sin(P.yaw), fz=-Math.cos(P.yaw), rx=Math.cos(P.yaw), rz=-Math.sin(P.yaw);
  const X=(x,z)=>R+(x*rx+z*rz)*sc, Y=(x,z)=>R-(x*fx+z*fz)*sc;
  const dot=(x,z,r,col,stroke)=>{ c.beginPath(); c.arc(X(x,z),Y(x,z),r,0,7); c.fillStyle=col; c.fill(); if(stroke){ c.lineWidth=dpr; c.strokeStyle=stroke; c.stroke(); } };
  c.clearRect(0,0,W,W);
  c.save();
  c.beginPath(); c.arc(R,R,R-dpr,0,7); c.fillStyle='rgba(20,12,6,.62)'; c.fill();
  c.lineWidth=2*dpr; c.strokeStyle='rgba(255,213,79,.85)'; c.stroke(); c.clip();
  // 장애물
  for(const o of obstacles) dot(o.x,o.z,Math.max(1.1*dpr,o.r*sc),'rgba(205,185,150,.7)');
  // 독 웅덩이·지뢰
  for(const pu of puddles) dot(pu.x,pu.z,Math.max(2*dpr,2.6*sc),'rgba(118,255,3,.45)');
  for(const mn of mines) dot(mn.x,mn.z,1.6*dpr,'#ff1744');
  // 아이템
  for(const it of items){
    const p=it.mesh.position, big=it.type==='chest'||it.type==='relic';
    const col = it.type==='armor' ? '#'+TIERC[it.tier].toString(16).padStart(6,'0') : ITEM_COL[it.type];
    dot(p.x,p.z,(big?3.2:2)*dpr*(big?1+0.25*Math.sin(t*6):1),col,big?'#fff':null);
  }
  // 적
  for(const e of enemies){
    if(e.hidden) continue;
    const p=e.mesh.position;
    if(e.bounty) dot(p.x,p.z,(3.8+Math.sin(t*8))*dpr,'#ffd54f','#000');
    else if(e.boss) dot(p.x,p.z,(4.5+Math.sin(t*8))*dpr,'#ff1744','#fff');
    else if(e.dummy) dot(p.x,p.z,2.2*dpr,'#d9b45a');
    else if(e.kind==='lieut') dot(p.x,p.z,2.6*dpr,'#ff9800');
    else if(e.kind==='decoy') dot(p.x,p.z,2.6*dpr,'#80d8ff');
    else if(e.minion) dot(p.x,p.z,2.2*dpr,'#ff7043');
    else dot(p.x,p.z,(e.dex==='tank'?2.6:1.8)*dpr,SET.cb?'#e040fb':'#ef5350');
  }
  for(const pg of pings) dot(pg.x,pg.z,(3+Math.sin(t*10))*dpr,'#'+pg.col.toString(16).padStart(6,'0'),'#fff');
  for(const t of traps) dot(t.x,t.z,1.8*dpr,t.kind==='bear'?'#cfd8dc':'#ff6d00','#000');
  if(dog) dot(dog.x,dog.z,2.4*dpr,'#80d8ff','#fff');
  if(mission && mission.obj){ const o=mission.obj, ox=X(o.x,o.z), oy=Y(o.x,o.z), r=3.6*dpr; c.fillStyle='#69f0ae'; c.fillRect(ox-r,oy-r,r*2,r*2); c.lineWidth=dpr; c.strokeStyle='#000'; c.strokeRect(ox-r,oy-r,r*2,r*2);
    if(o.to) dot(o.to.x,o.to.z,2.6*dpr,'#fff','#69f0ae'); }
  if(merchant){ const qx=X(merchant.x,merchant.z), qy=Y(merchant.x,merchant.z), r=(4.5+Math.sin(t*5))*dpr;
    c.beginPath(); c.moveTo(qx,qy-r); c.lineTo(qx+r,qy); c.lineTo(qx,qy+r); c.lineTo(qx-r,qy); c.closePath(); c.fillStyle='#ffd54f'; c.fill(); c.lineWidth=dpr; c.strokeStyle='#fff'; c.stroke(); }
  if(hostage){ const hx=X(hostage.x,hostage.z), hy=Y(hostage.x,hostage.z), r=(4+Math.sin(t*6))*dpr;
    c.fillStyle='#69f0ae'; c.fillRect(hx-r,hy-r,r*2,r*2); c.lineWidth=dpr; c.strokeStyle='#fff'; c.strokeRect(hx-r,hy-r,r*2,r*2); }
  for(const h of hazards.concat([...mirrorHz.values()])){ const hx=h.bx!==undefined?h.bx:h.x, hz=h.bx!==undefined?h.bz:h.z; dot(hx,hz,Math.max(2*dpr,(h.r||1.7)*sc),h.t==='quick'?'rgba(141,110,64,.8)':h.t==='wisp'?'rgba(128,216,255,.7)':'rgba(255,87,34,.75)'); }
  if(race) raceMinimap(c,X,Y,dot,dpr,t);
  // 나 (항상 위를 향하는 화살표)
  c.translate(X(P.x,P.z),Y(P.x,P.z));
  c.beginPath(); c.moveTo(0,-6.5*dpr); c.lineTo(4.8*dpr,5*dpr); c.lineTo(0,2.4*dpr); c.lineTo(-4.8*dpr,5*dpr); c.closePath();
  c.fillStyle='#4fc3f7'; c.fill(); c.lineWidth=1.2*dpr; c.strokeStyle='#fff'; c.stroke();
  c.restore();
  // 북쪽 표시
  const nx=X(0,-ARENA)-R, ny=Y(0,-ARENA)-R, nl=Math.hypot(nx,ny)||1;
  c.font='bold '+(10*dpr)+'px sans-serif'; c.textAlign='center'; c.textBaseline='middle';
  c.fillStyle='#ffd54f'; c.fillText('N', R+nx/nl*(R-8*dpr), R+ny/nl*(R-8*dpr));
}

const WDESC = ['정확한 단발','근거리 산탄 8발','누르고 있으면 연사','120발 초고속 연사','조준점에 던져 범위 폭발','일직선의 적을 모두 관통','빠르고 강한 연사','적을 꿰뚫는 화살 · 머리 3배','적을 끌어와 묶기 (사거리 22m)','바닥에 5초 불길 · 계속 피해'];
function bagItem(icon,title,lines,state){
  return '<div class="it '+(state||'')+'"><div class="ic">'+icon+'</div><div><b>'+title+'</b><div class="sub">'+lines.join('<br>')+'</div></div></div>';
}
function pct(x){ return Math.round(x*100)+'%'; }
function bagHTML(){
  // 현재 받는 피해 계산
  const m=curMount(), A=P.armor;
  const base = (m ? m.armor : 1) * D().dmg;
  const vest = A.vest ? ARMOR.vest.red[A.vest.tier] : 0;
  const rRed = Math.min(0.75, vest + (A.hat ? ARMOR.hat.red[A.hat.tier] : 0));
  const mRed = Math.min(0.75, vest + (A.boots ? ARMOR.boots.red[A.boots.tier] : 0));
  const dodge = P.relics.includes('cloak') ? ' · 회피 25%' : '';
  const nb = bossAlive ? null : (Math.floor(wave/5)+1)*5;
  let h = '<button id="bagX" class="sec xbtn">✕</button><h1>🎒 가방</h1><div class="bag">';
  h += '<div class="stat">⭐ Lv '+prog.lv+' 「'+titleOf(prog.lv)+'」<br>'+D().icon+' 난이도 <b>'+D().name+'</b> · ❤️ 체력 <b>'+Math.ceil(P.hp)+' / '+P.maxHp+'</b> · 📍 '+themeName(curTheme)+' · 웨이브 '+wave
     + '<br>🛡️ 받는 피해: 총알·폭발 <b>'+pct(base*(1-rRed))+'</b> · 몸통·돌진 <b>'+pct(base*(1-mRed))+'</b>'+dodge
     + '<br>🪤 곰덫 <b>'+P.traps.bear+'</b> · 🛢 폭약통 <b>'+P.traps.barrel+'</b>'+(TOUCH?' (함정 버튼)':' (T 곰덫 · G 폭약통)')+(dog?' · '+dog.D.icon+' 보안견 <b>'+dog.D.name+'</b>':'')+' · 💰 '+coins.toLocaleString()
     + '<br>👑 '+(bossAlive ? '보스 전투 중: '+bossAlive.name : '다음 보스: 웨이브 '+nb+' · '+BOSSES[stageBoss(nb)].name)+'</div>';

    const how = w.base ? '' : (i===6 ? '열차 강도단 두목의 유물' : i===4 ? '보스 보물 상자 · 광부의 유물' : '보스 보물 상자');
    const lines = [WDESC[i], (w.thrown?'폭발':'피해 '+w.dmg+(w.pellets>1?' × '+w.pellets+'발':''))+' · 탄창 '+wMag(i)+(wLv(i)?' · ⭐ 강화 ★'+wLv(i)+' (피해 ×'+wDmg(i).toFixed(1)+')':'')];
    if(w.owned) lines.push('['+(i+1)+'] 키 · 남은 탄 '+P.ammo[i]); else lines.push('🔒 얻는 곳: '+how);
    h += bagItem(w.owned?'✅':'🔒', w.name+(i===P.weapon&&w.owned?' (사용 중)':''), lines, w.owned?(i===P.weapon?'on':''):'lock');
  });
  h += '</div>';

  // 탈것
  h += '<h3>🐎 탈것 <span style="font-size:12px;opacity:.7">F 타기/내리기 · C 변경</span></h3><div class="grid">';
  for(const id in MOUNTS){
    const M=MOUNTS[id], own=P.mounts.includes(id), cur=own&&P.mount===id;
    const lines=['속도 '+M.speed+' · 짓밟기 '+M.trample, '받는 피해 '+pct(M.armor)+(M.sit?' · 지붕 위 탑승':'')];
    if(M.desc) lines.push(M.desc);
    lines.push('⭐ Lv '+mLv(id)+' · '+(mLv(id)>=3?'기술 '+MSKILL[id].icon+' '+MSKILL[id].name+' ('+skillKeyName()+')':'Lv 3에 기술 '+MSKILL[id].icon+' '+MSKILL[id].name)+' · 💨 대시');
    if(!own) lines.push('🔒 얻는 곳: 보스 보물 상자');
    else if(cur) lines.push(P.riding?'타는 중':'선택됨 (내린 상태)');
    h += bagItem(M.icon, M.name, lines, own?(cur?'on':''):'lock');
  }
  h += '</div>';

  // 방어구

      h += bagItem(R.icon, '<span style="color:'+col+'">'+TIERN[a.tier]+'</span> '+R.name, lines, 'on');

      h += bagItem(R.icon, R.name+' (없음)', [R.desc+' 감소 (동 '+pct(R.red[1])+' ~ 다이아 '+pct(R.red[4])+')','🔒 얻는 곳: 악당이 가끔 떨어뜨림 · 보스는 금(10% 확률로 💎다이아)'], 'lock');
    }
  }
  h += '</div>';

  // 유물
  h += '<h3>💎 유물 <span style="font-size:12px;opacity:.7">보스마다 전용 유물 1개</span></h3><div class="grid">';

  }
  h += '</div></div>';
  h += '<div style="text-align:center"><button id="bagClose">닫기 '+(TOUCH?'':'(Tab)')+'</button></div>';
  return h;
}

let dexData = {};
try { dexData = JSON.parse(localStorage.getItem('sheriffDex')||'{}') || {}; } catch(e){ dexData = {}; }
function dexCount(){ return DEX_ORDER.filter(k=>dexData[k]>0).length; }
function dexName(k){ return BOSSES[k] ? BOSSES[k].name : DEX[k].name; }
function dexRecord(k){
  if(runMode==='practice') return;
  if(!DEX[k]) return;
  const first = !(dexData[k]>0);
  const beforeDex=dexData[k]||0; dexData[k] = beforeDex + 1;
  try{ localStorage.setItem('sheriffDex', JSON.stringify(dexData)); }catch(e){}
  dexMedalCheck(k,beforeDex);
  track('dex', dexCount(), true);
  if(first){ popText('📖 도감 등록: '+DEX[k].icon+' '+dexName(k), '#d1b3ff', 2); sfx('pickup'); }
}
function bossAppear(k){
  const out=[];
  for(let w=5; w<=100; w+=5) if(stageBoss(w)===k) out.push('웨이브 '+w+' ('+themeOf(Math.floor((w-1)/5)).pl.name+')');
  return out.join(', ');
}
// ---- 3D 미리보기 ----
let dexR=null, dexScene=null, dexCam=null, dexModel=null, dexKey=null, dexOpen=false, dexFrom='menu';
const dexBlack = new THREE.MeshBasicMaterial({color:0x0c0c0c});
function dexBuild(k){
  switch(k){
    case 'bandit': return makeBandit(0x8b2b2b,1,false).mesh;
    case 'runner': return makeBandit(0xd4b020,0.8,false,'runner').mesh;
    case 'tank':   return makeBandit(0x5b2d7a,1.5,false,'tank').mesh;
    case 'lieut':  return makeBandit(0x37474f,1.4,true,'lieut').mesh;
    case 'decoy':  return makeGhost(2).mesh;
    case 'ghost':  return makeGhost(2).mesh;
    case 'gunner': return makeBandit(0x2b2b2b,2.2,true,'gunner').mesh;
    case 'bull':   return makeBull(2).mesh;
    case 'miner':  return makeMiner(2).mesh;
    case 'gang':   return makeGangBoss(2.1).mesh;
    case 'lava':   return makeLavaGiant(1.5).mesh;
    case 'croc':   return makeCroc(1.6).mesh;
    case 'cav':    return makeCavalry(1.3).mesh;
    case 'shield': return makeShieldman().mesh;
    case 'bomber': return makeBomber().mesh;
    case 'sniper': return makeSniper().mesh;
    case 'eagle':  return makeEagle(1.6).mesh;
    case 'golem':  return makeGolem(1.6).mesh;
    case 'twins':  { const g=new THREE.Group(), a=makeBandit(0x8e1b1b,1.8,true,'gunner').mesh, b=makeBandit(0x1b3a8e,1.8,true,'gunner').mesh; a.position.x=-1; b.position.x=1; g.add(a); g.add(b); return g; }
    case 'snake': {
      const md=makeSnake(1.4), g=new THREE.Group(); g.add(md.mesh);
      md.segs.forEach((sg,i)=>{ const a=0.9+i*0.55, r=1.3+i*0.16; sg.position.set(Math.sin(a)*r, sg.position.y, Math.cos(a)*r); sg.rotation.y=a+Math.PI/2; g.add(sg); });
      return g;
    }
  }
}
function dexDispose(){
  if(!dexModel) return;
  dexScene.remove(dexModel);
  dexModel.traverse(o=>{ if(o.isMesh){ if(!o.geometry.userData.cached) o.geometry.dispose(); if(o.material!==dexBlack) o.material.dispose(); if(o.userData.orig) o.userData.orig.dispose(); } });
  dexModel=null;
}
function dexShowModel(k, locked){
  if(!dexR){
    dexR = new THREE.WebGLRenderer({antialias:true, alpha:true});
    dexR.setPixelRatio(Math.min(devicePixelRatio,2));
    dexScene = new THREE.Scene();
    dexScene.add(new THREE.HemisphereLight(0xfff4e0,0x6a5040,1.0));
    const dl=new THREE.DirectionalLight(0xffffff,0.7); dl.position.set(3,6,4); dexScene.add(dl);
    dexCam = new THREE.PerspectiveCamera(35,1,0.1,200);
  }
  const holder=$('dexview'); if(!holder) return;
  holder.appendChild(dexR.domElement);
  const w=holder.clientWidth||300, h=holder.clientHeight||240;
  dexR.setSize(w,h,false); dexCam.aspect=w/h; dexCam.updateProjectionMatrix();
  dexDispose();
  const g=dexBuild(k);
  if(locked) g.traverse(o=>{ if(o.isMesh){ o.userData.orig=o.material; o.material=dexBlack; } });
  // 크기에 맞춰 화면 가운데에
  const box=new THREE.Box3().setFromObject(g), size=new THREE.Vector3(), c=new THREE.Vector3();
  box.getSize(size); box.getCenter(c);
  const wrap=new THREE.Group(); g.position.set(-c.x, -box.min.y, -c.z); wrap.add(g);
  dexModel=wrap; dexScene.add(wrap); dexKey=k;
  const r=Math.max(size.x,size.y,size.z);
  const flat = size.y < r*0.5;   // 뱀처럼 납작한 모델은 위에서 내려다보기
  dexCam.position.set(0, flat ? r*0.9 : size.y*0.6, r*(flat?1.5:2.25)+1.2); dexCam.lookAt(0, size.y*0.48, 0);
}
function dexLoop(){
  if(!dexOpen) return;
  requestAnimationFrame(dexLoop);
  if(dexModel){ dexModel.rotation.y += 0.012; dexR.render(dexScene,dexCam); }
}
function dexDetailHTML(k){
  const own = dexData[k]>0, d=DEX[k], boss=!!BOSSES[k];
  let h = '<div class="dexview" id="dexview"></div>';
  if(!own){
    h += '<h2>???</h2><div class="cat">'+(boss?'보스':d.cat)+'</div>';
    h += '<p>아직 쓰러뜨리지 못한 적입니다. 처치하면 정보가 공개됩니다.</p>';
    h += '<div class="row">📍 출현: '+(boss?bossAppear(k):d.appear)+'</div>';
    return h;
  }
  h += '<h2>'+d.icon+' '+dexName(k)+'</h2><div class="cat">'+(boss?'👑 보스':d.cat)+' · 처치 '+dexData[k]+'회 '+dexMedal(k)+' <small style="opacity:.7">(10·100·1000번에 🥉🥈🥇)</small></div>';
  h += '<p>'+d.desc+'</p>';
  h += '<div class="row">📊 '+d.stats+(boss?' (보통 난이도, 첫 등장 기준)':'')+'</div>';
  h += '<div class="row">📍 출현: '+(boss?bossAppear(k):d.appear)+'</div>';
  const abil = d.abil.slice();
  if(boss) BOSS_SKILLS[k].forEach(([t,nm])=>abil.push('★'+t+' 이상: '+nm));
  h += '<ul>'+abil.map(a=>'<li>'+a+'</li>').join('')+'</ul>';
  if(boss){
    const rk=relicOfBoss(k);
    h += '<div class="row">💡 '+BOSS_TIPS[k]+'</div>';
    if(rk) h += '<div class="row">💎 전용 유물: '+RELICS[rk].icon+' '+RELICS[rk].name+' — '+RELICS[rk].desc+'</div>';
  } else h += '<div class="row">💡 '+d.tip+'</div>';
  return h;
}
function dexSelect(k){
  dexKey=k;
  document.querySelectorAll('.dexlist button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  $('dexdetail').innerHTML = dexDetailHTML(k);
  dexShowModel(k, !(dexData[k]>0));
}
function openDex(from){
  if(from==='play' && mode!=='play') return;
  if(from==='menu' && mode!=='menu') return;
  dexFrom=from; mode='dex'; mouse.down=false; resetTouches();
  try{ document.exitPointerLock(); }catch(e){}
  const total = DEX_ORDER.reduce((a,k)=>a+(dexData[k]||0),0);
  let h = '<button id="dexX" class="sec xbtn">✕</button><h1>📖 적 도감</h1>'
        + '<div class="dexsum">해금 <b>'+dexCount()+' / '+DEX_ORDER.length+'</b> · 총 처치 <b>'+total.toLocaleString()+'</b> · 처치하면 도감에 등록됩니다</div>'
        + '<div class="dexwrap"><div class="dexlist">';
  for(const k of DEX_ORDER){
    const own=dexData[k]>0, boss=!!BOSSES[k];
    h += '<button data-k="'+k+'" class="'+(own?'':'lock')+'"><span class="di">'+(own?DEX[k].icon:'❔')+'</span>'
       + (own?(boss?BOSSES[k].name.replace(/ 「.*」/,''):DEX[k].name):(boss?'??? (보스)':'???'))+'</button>';
  }
  h += '</div><div class="dexdetail" id="dexdetail"></div></div>'
     + '<div style="text-align:center"><button id="dexClose">닫기 '+(TOUCH?'':'(B)')+'</button></div>';
  showOverlay(h, false, true);
  document.querySelectorAll('.dexlist button').forEach(b=>b.onclick=()=>dexSelect(b.dataset.k));
  $('dexX').onclick=closeDex; $('dexClose').onclick=closeDex;
  dexOpen=true;
  dexSelect(dexKey && DEX[dexKey] ? dexKey : DEX_ORDER[0]);
  dexLoop();
}
function closeDex(){
  if(mode!=='dex') return;
  dexOpen=false; dexDispose();
  if(dexFrom==='play'){ mode='play'; hideOverlay(); requestLock(); }
  else showMenu();
}

function openBag(){

let playerName = '', lastEntry = null, saveNote = '';
try { playerName = localStorage.getItem('sheriffName') || ''; } catch(e){}
let db=null, fb=null, myId=null, boardState='local', onlineRuns=[], failedRuns=[];

function cleanRun(x){
  if(!x||typeof x!=='object') return null;
  return {name:String(x.name||'???').slice(0,12), score:Math.max(0,Math.floor(Number(x.score)||0)),
          wave:Math.max(0,Math.floor(Number(x.wave)||0)), bosses:Math.max(0,Math.floor(Number(x.bosses)||0)),
          date:String(x.date||''), diff: DIFFS[x.diff] ? x.diff : 'normal', ...(x.tt?{tt:String(x.tt).slice(0,12)}:{})};
}
function localRuns(){
  try{ const a=JSON.parse(localStorage.getItem('sheriffBoard')||'[]'); return Array.isArray(a)?a.map(cleanRun).filter(Boolean):[]; }
  catch(e){ return []; }
}
// 난이도별로 상위 n개씩만 남기기
function keepPerDiff(runs,n){
  const cnt={}; return runs.filter(r=>{ cnt[r.diff]=(cnt[r.diff]||0)+1; return cnt[r.diff]<=n; });
}
function localSave(entry){
  const runs = localRuns(); runs.push(entry); runs.sort((a,b)=>b.score-a.score);
  try{ localStorage.setItem('sheriffBoard', JSON.stringify(keepPerDiff(runs,15))); }catch(e){}
}
let boardTab = diff;
function displayRuns(){
  const base = (((db||fb) && boardState!=='error') ? onlineRuns.concat(failedRuns) : localRuns()).filter(r=>r.diff===boardTab && nameVisible(r.name));
  return base.slice().sort((a,b)=>b.score-a.score || a.date.localeCompare(b.date)).slice(0,10);
}
const sameRun = (a,b) => a && b && a.date===b.date && a.name===b.name && a.score===b.score;

async function saveRun(entry){
  saveNote='';
  if(fb){
    try{ await fbSave(entry); if(!onlineRuns.some(r=>sameRun(r,entry))) onlineRuns.push(entry); fbLoad(); }
    catch(e){ saveNote='온라인 순위표에 저장하지 못해 이 기기에만 저장했어요. (인터넷 연결 확인)'; failedRuns.push(entry); localSave(entry); }
    return;
  }
  if(db && myId){
    try{
      const ref = db.collection('scores').doc(myId);
      const snap = await ref.get();
      const d = snap.exists ? snap.data() : null;
      const runs = (d && Array.isArray(d.runs)) ? d.runs.map(cleanRun).filter(Boolean) : [];
      runs.push(entry); runs.sort((a,b)=>b.score-a.score);
      if(snap.exists) await ref.update({runs: keepPerDiff(runs,10)}); else await ref.set({runs: keepPerDiff(runs,10)});
      if(!onlineRuns.some(r=>sameRun(r,entry))) onlineRuns.push(entry);
      return;
    }catch(e){
      saveNote = '공용 순위표에 저장할 권한이 없어 이 기기에만 저장했어요.';
      failedRuns.push(entry); localSave(entry); return;
    }
  }
  localSave(entry);
}

function renderBoard(){
  const el = $('board'); if(!el) return;
  el.textContent='';
  const h = document.createElement('h3');
  h.textContent = ((db||fb) && boardState!=='error') ? '🏆 명예의 전당 TOP 10'+(fb?' (전체)':'') : '🏆 TOP 10 (이 기기)';
  el.appendChild(h);
  const tabs=document.createElement('div'); tabs.className='tabs';
  for(const k of DIFF_KEYS.concat(['event','rush','duel','race','cards','tower','night'])){
    const b=document.createElement('button'); b.textContent=k==='night'?'🌙 밤 습격':k==='tower'?'🗼 탑':k==='cards'?'🃏 카드':k==='race'?'🏇 경주':k==='event'?'🎉 이벤트':k==='rush'?'⚔️ 보스 러시':k==='duel'?'🔔 결투':DIFFS[k].icon+' '+DIFFS[k].name;
    if(k===boardTab) b.className='on';
    b.onclick=(ev)=>{ ev.stopPropagation(); boardTab=k; renderBoard(); };
    tabs.appendChild(b);
  }
  el.appendChild(tabs);
  const runs = (boardTab==='rush'||boardTab==='duel'||boardTab==='event'||boardTab==='race'||boardTab==='cards'||boardTab==='tower'||boardTab==='night') ? [] : displayRuns();
  if(boardTab==='rush'){ renderRushBoard(el); renderRush2Board(el); }
  else if(boardTab==='event') renderEventBoard(el);
  else if(boardTab==='duel') renderDuelBoard(el);
  else if(boardTab==='race') renderRaceBoard(el);
  else if(boardTab==='cards') renderCardsBoard(el);
  else if(boardTab==='tower') renderTowerBoard(el);
  else if(boardTab==='night') renderNightBoard(el);
  else if(runs.length===0){
    const p=document.createElement('div'); p.className='note';
    p.textContent = boardState==='loading' ? '순위를 불러오는 중...' : DIFFS[boardTab].name+' 난이도 기록이 아직 없어요. 첫 번째 보안관이 되어 보세요!';
    el.appendChild(p);
  } else {
    const t=document.createElement('table');
    const hr=t.insertRow(); ['순위','이름','점수','웨이브','보스','날짜'].forEach(x=>{const th=document.createElement('th'); th.textContent=x; hr.appendChild(th);});
    runs.forEach((r,i)=>{
      const tr=t.insertRow(); if(sameRun(r,lastEntry)) tr.className='me';
      const dt = r.date ? new Date(r.date) : null;
      const cells=[['🥇','🥈','🥉'][i]||String(i+1), r.name, r.score.toLocaleString(), r.wave, r.bosses,
                   dt&&!isNaN(dt)?(dt.getMonth()+1)+'/'+dt.getDate():'-'];
      cells.forEach((c,k)=>{ const td=tr.insertCell(); td.textContent=c; if(k===1){ td.className='nm'; nameCell(td,r); } });
    });
    el.appendChild(t);
  }
  hookBoardNames(el);
  const notes=[];
  if(boardState==='slow') notes.push('공용 순위를 아직 불러오지 못했어요. 잠시 후 다시 확인해 주세요.');
  if(boardState==='error') notes.push('공용 순위표에 연결할 수 없어 이 기기 기록만 보여줘요.');
  if(saveNote) notes.push(saveNote);
  if(notes.length){ const n=document.createElement('div'); n.className='note'; n.textContent=notes.join(' '); el.appendChild(n); }
  const rm = $('rankMsg');
  if(rm && lastEntry && boardTab!=='rush' && boardTab!=='duel' && boardTab!=='event' && boardTab!=='race' && boardTab!=='cards' && boardTab!=='tower'){
    const idx = runs.findIndex(r=>sameRun(r,lastEntry));
    if(boardTab===lastEntry.diff) rm.textContent = idx>=0 ? '🏅 '+DIFFS[lastEntry.diff].name+' '+(idx+1)+'위에 이름을 올렸습니다!' : 'TOP 10 진입 실패… 다시 도전!';
  }
}

// ---------- 앱용: Firebase(Firestore) 온라인 순위표 ----------
// firebase-config.js 에서 window.SHERIFF_FIREBASE = {apiKey, projectId} 를 정해 주면 사용
function fbBase(){ return 'https://firestore.googleapis.com/v1/projects/'+encodeURIComponent(fb.projectId)+'/databases/(default)/documents'; }
const fbColl = d => d==='normal' ? 'scores' : 'scores_'+d;
async function fbLoadOne(d){
  const r = await fetch(fbBase()+':runQuery?key='+encodeURIComponent(fb.apiKey), {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({structuredQuery:{from:[{collectionId:fbColl(d)}],
      orderBy:[{field:{fieldPath:'score'},direction:'DESCENDING'}], limit:10}})});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const rows = await r.json();
  const v = (f,k,t)=> f[k] ? f[k][t] : undefined;
  return rows.filter(x=>x.document).map(x=>{ const f=x.document.fields||{};
    return cleanRun({name:v(f,'name','stringValue'), score:v(f,'score','integerValue'), wave:v(f,'wave','integerValue'),
                     bosses:v(f,'bosses','integerValue'), date:v(f,'date','stringValue'), diff:d, tt:v(f,'tt','stringValue')}); }).filter(Boolean);
}
async function fbLoad(){
  try{
    const lists = await Promise.all(DIFF_KEYS.map(fbLoadOne));
    try{ onlineRush2 = await fbLoadRush2(); }catch(e){}
    try{ onlineEvent = await fbLoadEvent(); failedEvent = failedEvent.filter(f=>!onlineEvent.some(r=>sameEvent(r,f))); }catch(e){}
    try{ onlineTower = await fbLoadTower(); }catch(e){}
    try{ onlineNight = await fbLoadNight(); }catch(e){}
    try{ onlineCards = await fbLoadCards(); failedCards = failedCards.filter(f=>!onlineCards.some(r=>sameCards(r,f))); }catch(e){}
    try{ onlineRace = await fbLoadRace(); failedRace = failedRace.filter(f=>!onlineRace.some(r=>sameRace(r,f))); }catch(e){}
    try{ onlineDuel = await fbLoadDuel(); failedDuel = failedDuel.filter(f=>!onlineDuel.some(r=>sameDuel(r,f))); }catch(e){}
    try{ onlineRush = await fbLoadRush(); failedRush = failedRush.filter(f=>!onlineRush.some(r=>sameRush(r,f))); }catch(e){}
    onlineRuns = [].concat(...lists);
    failedRuns = failedRuns.filter(f=>!onlineRuns.some(r=>sameRun(r,f)));
    boardState='online';
  }catch(e){ boardState = onlineRuns.length ? 'online' : 'error'; }
  renderBoard();
}
async function fbSave(entry){
  const fields = {name:{stringValue:entry.name}, score:{integerValue:String(entry.score)}, wave:{integerValue:String(entry.wave)},
                  bosses:{integerValue:String(entry.bosses)}, date:{stringValue:entry.date}};
  if(entry.tt) fields.tt={stringValue:entry.tt};
  const r = await fetch(fbBase()+'/'+fbColl(entry.diff)+'?key='+encodeURIComponent(fb.apiKey), {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({fields})});
  if(!r.ok) throw new Error('HTTP '+r.status);
}
function initFirebase(){
  const c = window.SHERIFF_FIREBASE;
  if(!c || !c.apiKey || !c.projectId || /YOUR_/.test(c.apiKey+c.projectId)) return;
  fb = c; boardState='loading'; renderBoard(); fbLoad();
}

(async ()=>{
  try{
    if(!window.claude || !window.claude.use){ initFirebase(); return; }
    const [d,u] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if(!d){ initFirebase(); return; }
    myId = u ? await u.id() : null;
    db = d; boardState='loading'; renderBoard();
    const timer = setTimeout(()=>{ if(boardState==='loading'){ boardState='slow'; renderBoard(); } }, 10000);
    db.collection('scores').onSnapshot(snap=>{
      const all=[], allR=[], allD=[], allR2=[], allE=[], allRc=[], allC=[], allT=[], allN=[], rOn={}, gOn=[];
      snap.docs.forEach(doc=>{ const v=doc.data(); if(v&&Array.isArray(v.runs)) v.runs.forEach(x=>{ const c=cleanRun(x); if(c) all.push(c); });
        if(v&&Array.isArray(v.rush)) v.rush.forEach(x=>{ const c=cleanRush(x); if(c) allR.push(c); });
        if(v&&Array.isArray(v.duel)) v.duel.forEach(x=>{ const c=cleanDuel(x); if(c) allD.push(c); });
        if(v&&Array.isArray(v.race)) v.race.forEach(x=>{ const c=cleanRace(x); if(c) allRc.push(c); });
        if(v&&Array.isArray(v.cards)) v.cards.forEach(x=>{ const c=cleanCards(x); if(c) allC.push(c); });
        if(v&&Array.isArray(v.tower)) v.tower.forEach(x=>{ const c=cleanCards(x); if(c) allT.push(c); });
        if(v&&Array.isArray(v.night)) v.night.forEach(x=>{ const c=cleanCards(x); if(c) allN.push(c); });
        if(v&&v.raid&&v.raid.wk===weekKey()&&v.raid.nm){ const nm=String(v.raid.nm).slice(0,12); if(nameVisible(nm)) rOn[nm]=Math.max(rOn[nm]||0,Math.max(0,Math.min(1e6,v.raid.dmg|0))); }
        if(v&&v.rg&&typeof v.rg==='object') for(const k in v.rg){ const g=v.rg[k]; if(g&&typeof g==='object'&&typeof g.d==='string') gOn.push({c:+String(k).slice(1)|0, t:(g.t|0)/10, mt:String(g.mt||''), nm:String(g.nm||'').slice(0,12), d:g.d.slice(0,12000)}); }
        if(v&&v.league&&v.league.nm) leagueOnline[String(v.league.nm).slice(0,12)]={wk:String(v.league.wk||''), pts:Math.max(0,v.league.pts|0), bs:(v.league.bs&&typeof v.league.bs==='object')?v.league.bs:null};
        if(v&&Array.isArray(v.event)) v.event.forEach(x=>{ const c=cleanEvent(x); if(c) allE.push(c); });
        if(v&&Array.isArray(v.rush2)) v.rush2.forEach(x=>{ const c=cleanRush2(x); if(c) allR2.push(c); }); });
      onlineRush2 = allR2; onlineEvent = allE; failedEvent = failedEvent.filter(f=>!allE.some(r=>sameEvent(r,f)));
      onlineTower = allT; onlineNight = allN; raidOnline = rOn; ghostsOnline = gOn; failedNight = failedNight.filter(f=>!allN.some(r=>sameCards(r,f))); onlineCards = allC; failedCards = failedCards.filter(f=>!allC.some(r=>sameCards(r,f)));
      onlineRace = allRc; failedRace = failedRace.filter(f=>!allRc.some(r=>sameRace(r,f)));
      onlineDuel = allD; failedDuel = failedDuel.filter(f=>!allD.some(r=>sameDuel(r,f)));
      onlineRush = allR; failedRush = failedRush.filter(f=>!allR.some(r=>sameRush(r,f)));
      onlineRuns = all;
      failedRuns = failedRuns.filter(f=>!all.some(r=>sameRun(r,f)));
      if(!snap.metadata.fromCache){ clearTimeout(timer); boardState='online'; }
      renderBoard();
    }, ()=>{ clearTimeout(timer); boardState='error'; renderBoard(); });
  }catch(e){ db=null; boardState='local'; renderBoard(); }
})();

  $('hubFight').onclick=openFight; $('hubChal').onclick=openChallengeHub; $('hubPlay').onclick=openPlayHub;
  $('jnBtn').onclick=openJournal; $('mlBtn').onclick=openMail; $('shBtn').onclick=()=>openStartShop(); $('rankBtn').onclick=openRank;

let lastEsc=-1e9, lockFails=0;
function requestLock(){
  // Esc 키로 닫은 직후에는 브라우저가 마우스 잠금을 거절하므로 요청하지 않음 (다음 클릭 때 다시 잠금)
  if(TOUCH || performance.now()-lastEsc<800) return;
  try{
    const p=canvas.requestPointerLock();
    if(p&&p.catch) p.catch(()=>{ if(++lockFails>=3) noLock=true; });
  }catch(e){ noLock=true; }
}
function startGame(name){
  name = String(name||'').trim().slice(0,12);
  if(!name){ const inp=$('nameIn'); if(inp){ inp.classList.remove('err'); void inp.offsetWidth; inp.classList.add('err'); inp.focus(); } return; }
  { const bad=badName(name); if(bad){ const inp=$('nameIn'); if(inp){ inp.classList.remove('err'); void inp.offsetWidth; inp.classList.add('err'); } toast('🚫 '+bad,'다른 이름을 써 주세요'); return; } }
  playerName = name; try{ localStorage.setItem('sheriffName',name); }catch(e){}
  initAudio(); resetGame(); lastEntry=null; P.down=null; sheriff.rotation.x=0; resumedSlot=-1;
  runMode = mp ? (mp.mode==='crush'?'rush':mp.mode==='cstory'?'story':'normal') : (pendingRun||selMode); pendingRun=null; if(runMode!=='bounty') bounty=null; if(runMode!=='story') story=null; if(runMode!=='sboss') sboss=null; cardsPicked={}; cardWave=0; setsDone={}; tower=null;
  if(!mp && RUN_KINDS[runMode] && runMode!=='story') markPlayed(runMode);
  if(!(mp && mpCoop())) sharedSeed='';
  if(sharedSeed){ applyTheme(0,[{x:0,z:0}]); const ix=Math.max(0,mpIndex()); P.x=(ix-1.5)*3; P.z=2; }
  stageOff=0; if(mp && runMode==='normal'){ stageOff=mpStartStage(); if(stageOff) applyTheme(stageOff,[{x:P.x,z:P.z}]); }
  const kit = (runMode==='rush'||runMode==='bounty'||runMode==='tower'||runMode==='sboss'||runMode==='raid') ? [] : applyKits();
  applyRole(); dailyStart(); petStartRun();
  paintModeHud();
  mode='play'; hideOverlay(); requestLock();
  if(kit.length) showMsg('🎒 시작 보급품 '+kit.join(' '),2.5,dog?dog.D.icon+' '+dog.D.name+'도 함께해요':null);
  else if(dog) showMsg(dog.D.icon+' '+dog.D.name+'와(과) 함께 출발!',2);
  if(runMode==='rush') startRush();
  if(runMode==='event') startEvent();
  if(runMode==='night') startNight();
  if(runMode==='raid') startRaid();
  if(mp && runMode==='story') startCStory();
  ghostStart();
  view=SET.view;
  if(!LS.get('sheriffTut',0) && runMode==='normal' && !mp) setTimeout(()=>{ if(mode==='play' && !tut) startTut(); }, 600);
}
$('overlay').addEventListener('click', (e)=>{
  if(mode==='paused' && !(e.target.closest && e.target.closest('button'))) resumeFromPause();
});

document.addEventListener('pointerlockchange', ()=>{
  locked = document.pointerLockElement===canvas;
  if(locked){ lockedOnce=true; lockFails=0; }
  else if(mode==='photo' && photo && performance.now()-photo.at>400){ closePhoto(); }   // 사진 모드에서 Esc가 마우스 잠금 해제에 쓰인 경우
  else if(mode==='play' && lockedOnce && !noLock){
    pauseGame();
  }
});
document.addEventListener('pointerlockerror', ()=>{ if(++lockFails>=3) noLock=true; });

// =====================================================
function switchWeapon(i){ if(WEAPONS[i] && WEAPONS[i].owned && runMode!=='practice') seenWeapon(i); if(i!==P.weapon && WEAPONS[i].owned){ P.weapon=i; P.reload=0; setGunModel(i); } }
function cycleWeapon(dir){
  let i=P.weapon;
  for(let k=0;k<WEAPONS.length;k++){ i=(i+dir+WEAPONS.length)%WEAPONS.length; if(WEAPONS[i].owned){ switchWeapon(i); return; } }
}
addEventListener('keydown', e0=>{
  if(e0.code==='Escape') lastEsc=performance.now();
  if(keyCapture){ keyCapture(e0); return; }
  if(e0.code==='Escape' && mode==='photo'){ e0.preventDefault(); closePhoto(); return; }
  if(mode==='duel'){ if(e0.code==='Space'||e0.code==='Enter'){ e0.preventDefault(); duelPress(); } return; }
  const e={code:mapCode(e0.code), key:e0.key, target:e0.target, preventDefault:()=>e0.preventDefault()};
  if(celeb && mode==='play' && (e.code==='Space'||e.code==='Enter')){ e.preventDefault(); celebSkip(); return; }
  if(cine && mode==='play' && (e.code==='Space'||e.code==='Enter'||e.code==='Escape')){ e.preventDefault(); endCine(); return; }
  if(mode==='photo'){ if(e.code==='Escape'||e.code==='KeyO') closePhoto(); return; }
  if(e.target && e.target.tagName==='INPUT'){ if(e.key==='Enter' && mode==='menu') startGame(e.target.value); return; }
  keys[e.code]=true;
  if(e.code==='Enter'&&mode==='over'){ if(mp||runMode==='race') $('againBtn').click(); else startGame(playerName); }
  if(e.code==='KeyM'){ initAudio(); setMute(!muted); }
  if(e.code==='KeyB'||(e.code==='Escape'&&mode==='dex')){
    e.preventDefault();
    if(mode==='play') openDex('play'); else if(mode==='menu') openDex('menu'); else if(mode==='dex') closeDex();
    return;
  }
  if(e.code==='Tab'||e.code==='KeyI'||(e.code==='Escape'&&mode==='bag')){
    e.preventDefault();
    if(mode==='play') openBag(); else if(mode==='bag') closeBag();
    return;
  }
  if(e.code==='Escape'&&mode==='shop'){ closeShop(); return; }
  if(mode!=='play') return;
  if(e.code==='KeyP') toggleView();
  if(e.code==='KeyO'){ openPhoto(); return; }
  if(e.code==='KeyZ'){ openChatBar(); return; }
  if(e.code==='KeyX'){ sendPing(); return; }
  if(chatBarOpen){ const ci=parseInt(e.key,10); if(ci>=1&&ci<=PHRASES.length){ sendChat(ci-1); return; } }
  if(e.code==='KeyR') startReload();
  if(e.code==='KeyT') placeTrap('bear');
  if(e.code==='KeyG') placeTrap('barrel');
  if(e.code==='KeyV') toggleAuto();
  if(e.code==='ShiftLeft'||e.code==='ShiftRight') dodge();
  if(e.code==='Space') useMountSkill();
  if(e.code==='KeyF' && P.mount) setRiding(!P.riding);
  if(e.code==='KeyC') cycleMount();
  const n=parseInt(e.key,10); if(n>=1&&n<=WEAPONS.length) switchWeapon(n-1); if(e.key==='0' && WEAPONS[9]) switchWeapon(9);
  if(['Space','ArrowUp','ArrowDown'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e=>{ keys[mapCode(e.code)]=false; keys[e.code]=false;
  if(e.code==='Escape' && mode==='photo' && photo && performance.now()-photo.at>400) closePhoto(); });
addEventListener('mousemove', e=>{
  mouse.nx=e.clientX/innerWidth; mouse.ny=e.clientY/innerHeight;
  if(locked&&mode==='play'&&Math.abs(e.movementX)<250&&Math.abs(e.movementY)<250){
    P.yaw-=e.movementX*0.0022*SET.sens; P.pitch-=e.movementY*0.0022*SET.sens;
    P.pitch=Math.max(-0.6,Math.min(0.5,P.pitch));
  }
});
canvas.addEventListener('mousedown', e=>{
  if(mode!=='play') return;
  if(celeb){ celebSkip(); return; }
  if(vpose) return;
  if(cine){ endCine(); return; }
  if(!locked && inAutoHud(e.clientX,e.clientY)){ toggleAuto(); return; }
  if(!locked&&!noLock){ requestLock(); return; }
  mouse.down=true;
  if(!WEAPONS[P.weapon].auto) shoot();
});
addEventListener('mouseup', ()=>mouse.down=false);
addEventListener('wheel', e=>{ if(mode==='play') cycleWeapon(e.deltaY>0?1:-1); },{passive:true});
addEventListener('contextmenu', e=>e.preventDefault());

resetGame(); applyLook(); updateCamera();
let last=performance.now();
function frame(t){
  if(!frame.ok){ frame.ok=1; const sp=document.getElementById('splash'); if(sp){ sp.style.opacity=0; setTimeout(()=>sp.remove(),600); } }
  requestAnimationFrame(frame);
  if((gfx==='min'||(typeof batteryOn==='function'&&batteryOn())) && t-last<31) return;   // 아주 낮음·배터리 절약: 30프레임
  if(typeof batteryOn==='function' && batteryOn() && mode==='menu' && t-last<200) return;
  const dt=Math.min(0.05,(t-last)/1000); last=t; perfTick(dt);
  if(mode==='play') update(ruleIs('fast')?dt*1.3:dt);
  else if(mode==='spectate') specTick(dt);
  if(mode==='play' && P.down && mp) specDownCam(dt);
  if(mode==='photo') updatePhotoCam();
  else if(mode==='duel') updateDuel(dt);
  updateFP();
  if(mode==='play' && (++mmFrame%2===0)) drawMinimap();
  else if(mode==='menu'){ P.yaw+=dt*0.15; updateCamera(); sheriff.rotation.y=P.yaw; }
  updateHUD();
  updateSky(dt); updateMpGhost(dt);
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);
