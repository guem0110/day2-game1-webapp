<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>황야의 배지 - 마을을 지켜라, 보안관!</title>
<style>
  :root{--bg:#1a120b;--fg:#fff4dc;--accent:#ffd54f;--danger:#e53935;--ok:#66bb6a;--boss:#ff5252;--card:rgba(30,18,8,.86)}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#120c07;--fg:#fff4dc;--card:rgba(20,12,5,.9)}}
  :root[data-theme="dark"]{--bg:#120c07;--fg:#fff4dc;--card:rgba(20,12,5,.9)}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden;user-select:none}
  canvas{display:block;width:100%;height:100%}
  #hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 1px 3px #000;font-weight:bold}
  #topl{position:absolute;left:16px;top:12px;font-size:20px;line-height:1.5}
  #topr{position:absolute;right:16px;top:184px;font-size:18px;text-align:right}
  #minimap{position:absolute;right:16px;top:12px;width:160px;height:160px}
  #topr small{display:block;font-size:12px;opacity:.75;font-weight:normal}
  #ridetxt{color:var(--accent)}
  #bossbar{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:min(480px,56vw);display:none;text-align:center}
  #bossname{font-size:18px;color:var(--boss);margin-bottom:4px}
  #bosswrap{height:16px;background:rgba(0,0,0,.65);border:2px solid #fff;border-radius:4px;overflow:hidden}
  #bossfill{height:100%;width:100%;background:var(--boss);transition:width .1s}
  #cross{position:absolute;left:50%;top:50%;width:0;height:0}
  #cross i{position:absolute;background:#fff;box-shadow:0 0 2px #000}
  #cross i:nth-child(1){left:-1px;top:-16px;width:2px;height:9px}
  #cross i:nth-child(2){left:-1px;top:7px;width:2px;height:9px}
  #cross i:nth-child(3){left:-16px;top:-1px;width:9px;height:2px}
  #cross i:nth-child(4){left:7px;top:-1px;width:9px;height:2px}
  #cross.hit i{background:#ff5252}
  #cross.head i{background:#ffeb3b}
  #dodge{position:absolute;left:270px;bottom:18px;font-size:14px;display:flex;align-items:center;gap:6px}
  #dodge .bar{width:70px;height:8px;background:rgba(0,0,0,.6);border:1px solid #fff}
  #dodge .bar i{display:block;height:100%;background:#4fc3f7}
  body.touch #dodge{display:none}
  #hpbox{position:absolute;left:16px;bottom:18px;width:240px;height:22px;background:rgba(0,0,0,.6);border:2px solid #fff;border-radius:4px;overflow:hidden}
  #hpfill{height:100%;width:100%;background:var(--ok)}
  #hptxt{position:absolute;left:8px;top:1px;font-size:14px}
  #armor{position:absolute;left:16px;bottom:48px;font-size:13px}
  #armor .ar{display:flex;align-items:center;gap:6px;margin-top:3px}
  #armor .bar{width:90px;height:7px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.8)}
  #armor .bar i{display:block;height:100%}
  #weap{position:absolute;right:16px;bottom:14px;text-align:right}
  #wname{font-size:22px}
  #wammo{font-size:30px}
  #wlist{font-size:12px;opacity:.8;font-weight:normal;max-width:60vw}
  #relics{font-size:18px;letter-spacing:2px}
  #mphud{font-size:14px;margin-top:4px;background:rgba(0,0,0,.35);border-radius:8px;padding:4px 8px;display:none;max-width:300px}
  .mpcode{font-size:40px;letter-spacing:6px;color:var(--accent);font-weight:900;text-align:center;margin:4px 0}
  .mpp{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.07);margin:5px 0}
  .mpp.ok{background:rgba(102,187,106,.2)}
  .card .mpmode button{margin:4px;padding:6px 14px;font-size:15px;background:transparent;color:var(--fg);border:2px solid rgba(255,255,255,.35)}
  .card .mpmode button.on{background:var(--accent);color:#2a1a0c;border-color:var(--accent)}
  #diffhud{font-size:15px}
  .diffsel{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0 2px}
  .card .diffsel button{margin:0;padding:6px 12px;font-size:15px;background:transparent;color:var(--fg);border:2px solid rgba(255,255,255,.35)}
  .card .diffsel button.on{background:var(--accent);color:#2a1a0c;border-color:var(--accent)}
  .diffdesc{font-size:13px;opacity:.85;min-height:1.4em}
  .tabs{display:flex;gap:4px;justify-content:center;margin:0 0 8px;flex-wrap:wrap}
  .card .tabs button{margin:0;padding:4px 10px;font-size:13px;background:transparent;color:var(--fg);border:1px solid rgba(255,255,255,.35);border-radius:16px}
  .card .tabs button.on{background:var(--accent);color:#2a1a0c;border-color:var(--accent)}
  #toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:20;pointer-events:none;background:rgba(30,18,8,.92);border:2px solid var(--accent);border-radius:12px;padding:8px 16px;text-align:center;opacity:0;transition:opacity .3s;font-weight:bold;max-width:86vw}
  #toast small{display:block;font-weight:normal;opacity:.85}
  .prog .tabs2{display:flex;gap:6px;justify-content:center;margin:6px 0 10px;flex-wrap:wrap}
  .card .prog .tabs2 button{margin:0;padding:6px 12px;font-size:14px;background:transparent;color:var(--fg);border:2px solid rgba(255,255,255,.35)}
  .card .prog .tabs2 button.on{background:var(--accent);color:#2a1a0c;border-color:var(--accent)}
  .prog .coins{text-align:center;font-size:18px;margin-bottom:6px}
  .prog .row2{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.07);margin:6px 0;font-size:14px}
  .prog .row2.done{background:rgba(102,187,106,.18)} .prog .row2.lock{opacity:.55}
  .prog .row2 .ic{font-size:24px;min-width:30px;text-align:center}
  .prog .row2 .grow{flex:1;min-width:0}
  .prog .pbar{height:7px;background:rgba(0,0,0,.5);border-radius:4px;overflow:hidden;margin-top:4px}
  .prog .pbar i{display:block;height:100%;background:var(--accent)}
  .prog .grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
  .prog .sw{width:22px;height:22px;border-radius:50%;border:2px solid #fff;display:inline-block;vertical-align:middle}
  .card .prog button.mini{margin:4px 0 0;padding:4px 10px;font-size:13px}
  .prog h3{margin:12px 0 4px;color:var(--accent);font-size:16px}
  #pop{position:absolute;left:0;right:0;top:57%;text-align:center;font-size:22px;opacity:0;transition:opacity .25s}
  #msg{position:absolute;left:0;right:0;top:20%;text-align:center;font-size:40px;color:var(--accent);opacity:0;transition:opacity .3s}
  #msg .sub{font-size:20px;color:var(--fg);margin-top:6px}
  #fade{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .45s}
  #vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(200,0,0,.75));opacity:0}
  .ov{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
  .ov.click{cursor:pointer}
  .dexsum{text-align:center;font-size:14px;opacity:.85;margin-bottom:8px}
  .dexwrap{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
  .dexlist{flex:1 1 220px;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
  .card .dexlist button{margin:0;padding:6px 4px;font-size:12px;line-height:1.3;border-radius:8px;background:rgba(255,255,255,.07);color:var(--fg);border:1px solid rgba(255,255,255,.18)}
  .card .dexlist button .di{display:block;font-size:22px}
  .card .dexlist button.lock{opacity:.55}
  .card .dexlist button.on{border-color:var(--accent);background:rgba(255,213,79,.2)}
  .dexdetail{flex:2 1 300px;min-width:0}
  .dexview{width:100%;height:240px;border-radius:10px;background:radial-gradient(circle at 50% 40%,rgba(255,213,79,.18),rgba(0,0,0,.35));overflow:hidden}
  .dexview canvas{display:block;width:100%;height:100%}
  .dexdetail h2{margin:8px 0 2px;color:var(--accent);font-size:20px}
  .dexdetail .cat{font-size:12px;opacity:.75}
  .dexdetail p,.dexdetail li{font-size:13px;margin:4px 0}
  .dexdetail ul{margin:4px 0;padding-left:18px}
  .dexdetail .row{font-size:13px;margin:3px 0}
  .card{touch-action:pan-y;-webkit-overflow-scrolling:touch}
  .card.wide{max-width:760px;text-align:left}
  .card .xbtn{float:right;margin:0;padding:4px 12px;font-size:18px}
  .card.wide h1{text-align:center}
  .bag h3{margin:14px 0 6px;color:var(--accent);font-size:17px;border-bottom:1px solid rgba(255,213,79,.35);padding-bottom:3px}
  .bag .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
  .bag .it{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border-radius:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);font-size:13px;line-height:1.4}
  .bag .it .ic{font-size:22px;line-height:1.1;min-width:26px;text-align:center}
  .bag .it b{font-size:14px}
  .bag .it .sub{opacity:.8}
  .bag .it.on{border-color:var(--accent);background:rgba(255,213,79,.14)}
  .bag .it.lock{opacity:.5;filter:grayscale(1)}
  .bag .stat{font-size:14px;line-height:1.7}
  .bag .dur{display:inline-block;width:70px;height:6px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.6);vertical-align:middle}
  .bag .dur i{display:block;height:100%}
  .card{background:var(--card);border:3px solid var(--accent);border-radius:12px;padding:24px 32px;max-width:540px;margin:16px;text-align:center;line-height:1.6}
  .card h1{margin:0 0 6px;color:var(--accent);font-size:34px}
  .card p{margin:6px 0;font-size:15px}
  .card .go{margin-top:14px;font-size:20px;color:var(--accent);animation:blink 1s infinite}
  .card small{opacity:.7}
  @keyframes blink{50%{opacity:.35}}
  .card{max-height:92vh;overflow:auto;box-sizing:border-box}
  .card input{font:inherit;font-size:20px;padding:8px 12px;border-radius:8px;border:2px solid var(--accent);background:#2a1a0c;color:var(--fg);text-align:center;width:min(260px,70vw);box-sizing:border-box}
  .card input.err{border-color:var(--danger);animation:shake .3s}
  .card button{font:inherit;font-size:20px;font-weight:bold;margin:10px 6px 0;padding:8px 22px;border-radius:8px;border:none;background:var(--accent);color:#2a1a0c;cursor:pointer}
  .card button.sec{background:transparent;color:var(--fg);border:2px solid var(--fg);font-size:16px}
  .card .help{font-size:13px;opacity:.85}
  .card .help p{margin:2px 0;font-size:13px}
  #board{margin-top:14px}
  #board h3{margin:0 0 6px;color:var(--accent);font-size:18px}
  #board table{width:100%;border-collapse:collapse;font-size:14px}
  #board th{color:var(--accent);border-bottom:1px solid rgba(255,255,255,.3);padding:4px 3px;white-space:nowrap}
  #board td{padding:3px;border-bottom:1px solid rgba(255,255,255,.08);white-space:nowrap}
  #board td.nm{max-width:9em;overflow:hidden;text-overflow:ellipsis;text-align:left}
  #board tr.me td{background:rgba(255,213,79,.28);color:#fff}
  #board .note{font-size:12px;opacity:.7;margin-top:6px}
  #rankMsg{font-size:20px;color:var(--accent);min-height:1.4em}
  /* ---------- 모바일 터치 ---------- */
  body.touch{touch-action:none;-webkit-touch-callout:none}
  #touch{position:fixed;inset:0;display:none;touch-action:none;z-index:5}
  body.touch.playing #touch{display:block}
  #joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.45);display:none;pointer-events:none}
  #knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.55)}
  #joyhint{position:absolute;left:24px;bottom:max(24px,env(safe-area-inset-bottom));font-size:12px;opacity:.6;pointer-events:none;text-shadow:0 1px 3px #000}
  #tbtns{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));width:250px;height:200px;pointer-events:none}
  .tb{position:absolute;width:58px;height:58px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(30,18,8,.55);color:#fff;font:bold 13px sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;padding:0;pointer-events:auto}
  .tb.big{width:84px;height:84px;font-size:16px;background:rgba(229,57,53,.55)}
  .tb.act{background:rgba(2,119,189,.8);border-color:#80d8ff}
  body.touch #autohud{display:none!important}
  .tb.on{background:rgba(255,213,79,.75);color:#2a1a0c}
  #bFire{right:0;bottom:0} #bReload{right:98px;bottom:0} #bSwap{right:0;bottom:98px} #bRide{right:74px;bottom:76px} #bMount{right:146px;bottom:84px} #bDodge{right:170px;bottom:0;background:rgba(2,119,189,.6)} #bTrap{right:190px;bottom:142px;background:rgba(239,108,0,.6);font-size:12px}
  #ttop{position:absolute;left:50%;transform:translateX(-50%);top:max(10px,env(safe-area-inset-top));display:flex;gap:8px}
  .tb.sm{position:static;width:42px;height:42px;font-size:16px}
  body.touch #bossbar{top:60px;width:min(440px,calc(100vw - 380px))}
  body.touch #msg{top:max(22%,118px);left:180px;right:180px}
  body.touch #hpbox{bottom:auto;top:100px;width:160px}
  body.touch #armor{bottom:auto;top:128px}
  body.touch #weap{top:auto;bottom:max(8px,env(safe-area-inset-bottom));right:auto;left:50%;transform:translateX(-50%);text-align:center}
  body.touch #minimap{width:112px;height:112px;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top))}
  body.touch #topr{top:128px;right:max(10px,env(safe-area-inset-right));font-size:14px}
  @media (orientation:portrait){
    body.touch #ttop{left:auto;right:max(14px,env(safe-area-inset-right));transform:none;top:158px;flex-direction:column}
    body.touch #bossbar{top:auto;bottom:215px;width:calc(100vw - 40px)}
    body.touch #msg{left:12px;right:72px;top:39%;font-size:22px} body.touch #msg .sub{font-size:13px}
    body.touch #weap{bottom:auto;top:198px;left:16px;right:auto;transform:none;text-align:left}
  }
  body.touch #wname{font-size:16px} body.touch #wammo{font-size:22px} body.touch #wlist{display:none}
  body.touch #topr small{display:none}
  body.touch #bagtxt{display:none}
  @media (max-height:500px){
    #msg{font-size:24px} #msg .sub{font-size:13px}
  }
  @media (max-width:600px){
    #topl{font-size:16px} #topr{font-size:15px}
    #msg{font-size:26px} #msg .sub{font-size:14px}
    .card{padding:18px 16px} .card h1{font-size:26px}
    #board table{font-size:12px}
  }
  .lb{position:fixed;left:0;right:0;height:0;background:#000;z-index:4;transition:height .45s;pointer-events:none}
  #lbT{top:0} #lbB{bottom:0} body.cine .lb{height:11vh}
  body.cine #minimap, body.cine #hpbox, body.cine #weap, body.cine #armor, body.cine #dodge, body.cine #topl, body.cine #topr, body.cine #touch #tbtns, body.cine #ttop, body.cine #tut, body.cine #pop, body.cine #cross{opacity:0}
  body.nohud #hud{display:none} body.photo #touch{display:none!important} body.photo #tut{display:none!important}
  #photobar{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:12;display:none;gap:6px;flex-wrap:wrap;justify-content:center;width:min(96vw,760px)}
  #photobar button{margin:0;padding:8px 12px;font-size:14px;background:rgba(30,18,8,.82);color:#fff;border:2px solid var(--accent);border-radius:10px;cursor:pointer}
  #photobar button.main{background:var(--accent);color:#2a1a0c;font-weight:bold}
  #phHint{position:fixed;left:0;right:0;top:max(12px,env(safe-area-inset-top));text-align:center;z-index:12;font-size:14px;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none;display:none}
  body.photo #phHint{display:block}
  #photoprev{position:fixed;inset:0;z-index:13;background:rgba(0,0,0,.7);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px}
  #photoprev img{max-width:92vw;max-height:70vh;border:3px solid var(--accent);border-radius:8px}
  #photoprev p{margin:0;color:#fff;text-align:center;font-size:14px}
  #tut{position:fixed;left:50%;top:max(28%,150px);transform:translateX(-50%);z-index:6;display:none;background:rgba(20,12,6,.88);border:2px solid #80d8ff;border-radius:12px;padding:10px 16px;text-align:center;max-width:min(92vw,520px);pointer-events:none}
  #tut #tutStep{font-size:13px;color:#80d8ff} #tut #tutTxt{font-size:18px;font-weight:bold;margin:4px 0}
  #tut button{pointer-events:auto;margin:4px 0 0;padding:4px 12px;font-size:13px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:8px}
  body.btnedit #touch{display:block!important;z-index:11} body.btnedit #tbtns .tb{display:block!important;outline:3px dashed #ffd54f;outline-offset:2px}
  body.btnedit #joy, body.btnedit #joyhint, body.btnedit #ttop{display:none!important}
  #btnEditBar{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);z-index:12;display:none;background:rgba(30,18,8,.92);border:2px solid var(--accent);border-radius:12px;padding:10px 14px;text-align:center;width:min(92vw,460px);font-size:14px}
  #btnEditBar button{margin:6px 4px 0;padding:6px 12px;font-size:14px}
  body.duelmode #touch{display:none!important} body.duelmode #hud > *:not(#msg):not(#fade):not(#pop){display:none!important}
  .mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px auto;max-width:440px}
  .card .mgrid button{margin:0;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:22px;line-height:1.2}
  .mgrid button b{font-size:15px} .mgrid button small{font-size:11px;opacity:.75;font-weight:normal}
  .card button.bigstart{font-size:22px;padding:12px 44px;margin-top:8px}
  .intro{display:grid;gap:8px;text-align:left;margin:8px 0} .intro div{background:rgba(255,255,255,.07);border-radius:10px;padding:10px 12px;font-size:14px}
  .attend{display:flex;gap:4px;justify-content:center;margin:10px 0} .attend div{flex:1;max-width:60px;border:2px solid rgba(255,255,255,.25);border-radius:8px;padding:4px 0;display:flex;flex-direction:column;align-items:center;font-size:12px}
  .attend div.got{opacity:.45} .attend div.now{border-color:var(--accent);background:rgba(255,213,79,.2)} .attend b{font-size:18px}
  body.txt1 #hud, body.txt1 .ov .card, body.txt1 #toast, body.txt1 #tut, body.txt1 #captions{zoom:1.15}
  body.txt2 #hud, body.txt2 .ov .card, body.txt2 #toast, body.txt2 #tut, body.txt2 #captions{zoom:1.32}
  #captions{position:fixed;left:50%;bottom:24%;transform:translateX(-50%);z-index:6;pointer-events:none;text-align:center;font-size:15px;display:none}
  #captions div{background:rgba(0,0,0,.65);color:#fff;border-radius:6px;padding:2px 10px;margin:3px auto;width:max-content}
  body.cbmode #hpfill{background:#29b6f6!important}
  #chatbar{position:fixed;left:50%;bottom:max(110px,18%);transform:translateX(-50%);z-index:9;display:none;flex-wrap:wrap;gap:6px;justify-content:center;width:min(94vw,560px)}
  #chatbar button{margin:0;padding:8px 12px;font-size:15px;background:rgba(30,18,8,.88);color:#fff;border:2px solid #80d8ff;border-radius:10px;cursor:pointer}
  body:not(.mpplay) #bChat, body:not(.mpplay) #bPing{display:none}
  #modalbox{position:fixed;inset:0;z-index:14;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px}
  #modalbox .mb{background:rgba(30,18,8,.97);border:2px solid var(--accent);border-radius:14px;padding:16px;max-width:min(92vw,440px);text-align:center;color:var(--fg)}

<script>

//  렌더러 / 씬

const renderer = new THREE.WebGLRenderer({antialias:true});

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 800);

const hemi = new THREE.HemisphereLight(0xfff1d6, 0x8a6a3c, 0.85); scene.add(hemi);

function applyShadowQuality(){
  const N = gfx==='high' ? 2048 : 1024, S = gfx==='high' ? 42 : 30;

  sun.castShadow = gfx!=='min' && !bat;

  if(sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map=null; }

  sun.shadow.camera.updateProjectionMatrix();
  sun.shadow.bias = -0.0005;
}

scene.add(sun); scene.add(sun.target);

const geoCache = {};
function boxGeo(w,h,d){ const k=w+','+h+','+d; if(!geoCache[k]){ geoCache[k]=new THREE.BoxGeometry(w,h,d); geoCache[k].userData.cached=true; } return geoCache[k]; }

{

const groundTexCache = {};
function groundTex(pl){
  const key=pl.name+gfx; if(groundTexCache[key]) return groundTexCache[key];
  const N = gfx==='high' ? 1024 : 512, c=document.createElement('canvas'); c.width=c.height=N; const x=c.getContext('2d');
  const base=new THREE.Color(pl.ground);
  const shade=(dl,ds)=>{ const k=base.clone().offsetHSL(0,ds||0,dl); return 'rgb('+(k.r*255|0)+','+(k.g*255|0)+','+(k.b*255|0)+')'; };
  x.fillStyle=shade(0); x.fillRect(0,0,N,N);
  const wrap=(fn)=>{ for(const ox of [-N,0,N]) for(const oy of [-N,0,N]) fn(ox,oy); };
  // 큰 얼룩
  for(let i=0;i<46;i++){
    const r=N*(0.05+Math.random()*0.16), px=Math.random()*N, py=Math.random()*N, dl=(Math.random()-0.5)*0.14;
    wrap((ox,oy)=>{ const g=x.createRadialGradient(px+ox,py+oy,0,px+ox,py+oy,r); const col=shade(dl,(Math.random()-0.5)*0.05);
      g.addColorStop(0,col.replace('rgb','rgba').replace(')',',0.55)')); g.addColorStop(1,col.replace('rgb','rgba').replace(')',',0)'));
      x.fillStyle=g; x.fillRect(px+ox-r,py+oy-r,r*2,r*2); });
  }
  // 알갱이
  const tones=[-0.12,-0.07,-0.03,0.03,0.07,0.1].map(d=>shade(d));
  const grains=N*N/45, gs=N/512;
  for(let i=0;i<grains;i++){ x.fillStyle=tones[i%tones.length]; const s=gs*(1+Math.random()*1.6); x.fillRect(Math.random()*N,Math.random()*N,s,s); }
  // 무대별 무늬
  x.lineCap='round';
  if(pl.name==='황금 사막'){ x.strokeStyle=shade(0.08); x.lineWidth=2*gs;
    for(let i=0;i<60;i++){ const y0=Math.random()*N, x0=Math.random()*N, w=N*(0.08+Math.random()*0.15);
      x.beginPath(); for(let k=0;k<=12;k++){ const xx=x0+k/12*w, yy=y0+Math.sin(k/12*Math.PI*2)*4*gs; k?x.lineTo(xx,yy):x.moveTo(xx,yy); } x.stroke(); } }
  else if(pl.name==='붉은 협곡'){ x.strokeStyle=shade(-0.16); x.lineWidth=1.6*gs;
    for(let i=0;i<70;i++){ let xx=Math.random()*N, yy=Math.random()*N; x.beginPath(); x.moveTo(xx,yy);
      for(let k=0;k<6;k++){ xx+=(Math.random()-0.5)*30*gs; yy+=(Math.random()-0.5)*30*gs; x.lineTo(xx,yy); } x.stroke(); } }
  else if(pl.name==='설원 고개'){ for(let i=0;i<grains/6;i++){ x.fillStyle=Math.random()<0.5?'#ffffff':'#d8ecff'; x.fillRect(Math.random()*N,Math.random()*N,gs*1.4,gs*1.4); } }
  else if(pl.name==='유령 묘지' || pl.name==='서부 마을'){ x.lineWidth=1.4*gs;
    const greens = pl.name==='유령 묘지' ? [shade(0.06,0.1),shade(-0.08,0.05),'#3f6b34'] : [shade(-0.1),shade(0.08),'#8a7a52'];
    for(let i=0;i<grains/10;i++){ x.strokeStyle=greens[i%3]; const xx=Math.random()*N, yy=Math.random()*N; x.beginPath(); x.moveTo(xx,yy); x.lineTo(xx+(Math.random()-0.5)*4*gs, yy-5*gs*Math.random()); x.stroke(); } }
  const tex=new THREE.CanvasTexture(c); tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.repeat.set(1400/14,1400/14);

function banditFace(g,M,face){
  const Z=-0.205;
  const eyeW=M(0xf3efe6), pup=M(0x1a1a1a), brow=M(0x2b1a0e), dark=M(0x5a0f0f);
  const eye1=(sx,w,h,y,pw,ph,px)=>{ addBox(g,w,h,0.02,eyeW,sx*0.09,y,Z); addBox(g,pw,ph,0.02,pup,sx*(0.09-(px||0)),y,Z-0.009); };
  const eyes=(w,h,y,pw,ph,px)=>{ eye1(-1,w,h,y,pw,ph,px); eye1(1,w,h,y,pw,ph,px); };
  const brows=(w,y,rot,col)=>{ for(const sx of [-1,1]){ const b=addBox(g,w,0.035,0.035,col||brow,sx*0.09,y,Z-0.008); b.rotation.z=sx*rot; } };
  const wrinkles=()=>{ for(const y of [1.72,1.79]) addBox(g,0.36,0.014,0.01,dark,0,y,-0.222); };
  switch(face){
    case 'runner':   // 크게 뜬 광기 어린 눈, 치켜올린 눈썹, 식은땀
      eyes(0.12,0.09,1.935,0.035,0.035,0.02); brows(0.11,2.005,-0.25);
      addBox(g,0.03,0.05,0.02,M(0x81d4fa),0.17,1.975,Z); wrinkles(); break;
    case 'tank': {   // 작은 눈, 일자 눈썹, 구레나룻, 눈을 가로지르는 흉터
      eyes(0.06,0.035,1.93,0.03,0.03); addBox(g,0.32,0.05,0.04,brow,0,1.975,Z-0.01);
      for(const sx of [-1,1]) addBox(g,0.04,0.14,0.08,brow,sx*0.2,1.87,-0.12);
      const sc=addBox(g,0.015,0.17,0.012,M(0xa0604a),0.09,1.93,Z-0.018); sc.rotation.z=0.3; wrinkles(); break; }
    case 'lieut': {  // 한쪽 눈 안대
      eye1(-1,0.09,0.045,1.93,0.04,0.04); brows(0.11,1.98,0.22);
      addBox(g,0.12,0.09,0.02,M(0x111111),0.09,1.93,Z-0.012);
      const st=addBox(g,0.45,0.02,0.02,M(0x111111),0,1.965,Z-0.014); st.rotation.z=0.32; break; }
    case 'gunner': { // 차가운 눈, 다크서클, 매서운 눈썹, 모자띠의 에이스 카드
      eyes(0.1,0.035,1.93,0.035,0.035); brows(0.13,1.972,0.38);
      for(const sx of [-1,1]) addBox(g,0.1,0.02,0.01,M(0x6d4c41),sx*0.09,1.903,Z);
      addBox(g,0.1,0.13,0.02,M(0xfafafa),0.12,2.18,-0.315);
      const d=addBox(g,0.04,0.04,0.02,M(0xd50000),0.12,2.18,-0.327); d.rotation.z=Math.PI/4; break; }
    case 'miner': {  // 이마의 고글, 그을음, 크게 뜬 눈
      const rim=M(0x8d6e63), lens=M(0x80deea);
      for(const sx of [-1,1]){ const r1=addCyl(g,0.07,0.07,0.05,12,rim,sx*0.1,2.0,-0.23); r1.rotation.x=Math.PI/2; const l=addCyl(g,0.055,0.055,0.02,12,lens,sx*0.1,2.0,-0.258); l.rotation.x=Math.PI/2; }

      eyes(0.1,0.07,1.925,0.04,0.04);

    case 'ghost':    // 빛나는 텅 빈 눈
      for(const sx of [-1,1]){ const m=new THREE.Mesh(boxGeo(0.1,0.06,0.02),GHOST_EYE); m.position.set(sx*0.09,1.93,Z-0.005); g.add(m); }
      brows(0.12,1.985,0.3,M(0x37474f)); break;
    case 'gang': {   // 외알 안경, 숱 많은 회색 눈썹과 구레나룻
      eyes(0.1,0.045,1.93,0.04,0.04); brows(0.15,1.988,0.25,M(0x9e9e9e));

      addBox(g,0.01,0.16,0.01,gold,0.155,1.85,Z-0.02);

function makeBandit(torsoColor, s, boss, face){

  for(const L of [legL,legR]){ addBox(L,0.3,0.75,0.3,pants,0,-0.38,0); addBox(L,0.32,0.18,0.4,boot,0,-0.76,-0.04); }

    addBox(g,0.95,0.5,0.46,M(0x3a2a1a),0,0.7,0.02);                 // 긴 코트 자락

  const armL = legGroup(g,-0.55,1.55,0); armL.rotation.x = boss?0.2:1.3;

const mtof = m => 440*Math.pow(2,(m-69)/12);
function initAudio(){
  if(ac){ if(ac.state==='suspended') ac.resume(); return; }
  try{
    ac = new (window.AudioContext||window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = muted?0:0.35; master.connect(ac.destination);
    musicBus=ac.createGain(); sfxBus=ac.createGain(); musicBus.connect(master); sfxBus.connect(master); bus=sfxBus; applyVolumes();
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    nextT = ac.currentTime+0.1; stepNo=0;
    setInterval(schedule, 30);

}
function tone(freq,t,dur,type,vol,slideTo){
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(bus||master); o.start(t); o.stop(t+dur+0.02);
}
function noise(t,dur,vol,hp){
  const s=ac.createBufferSource(); s.buffer=noiseBuf;
  const f=ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp;
  const g=ac.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f); f.connect(g); g.connect(bus||master); s.start(t); s.stop(t+dur+0.02);
}
function playStep(s,t,sd){
  if(t < songUntil) return;
  const bar=(s>>4)&3, st=s&15, b=st&3;
  const tr = bossAlive ? -2 : 0;   // 보스전에는 음을 살짝 낮춰 긴장감
  if(b===0||b===2||b===3) tone(mtof(BASS[bar]+12+tr), t, b===0?sd*1.8:sd*0.9, 'square', 0.13);
  const mel = MEL[bar][st];
  if(mel) tone(mtof(mel+tr), t, sd*2, 'square', 0.08);
  if((st&1)===0) tone(mtof(CHORD[bar][(st>>1)&3]+tr), t, sd*1.2, 'triangle', 0.1);
  if(b===0) tone(150,t,0.14,'sine',0.5,40);
  if(st===4||st===12) noise(t,0.12,0.28,1500);
  if((st&1)===0) noise(t,0.035,0.07,7000);
  if(bossAlive && (st&1)===1) noise(t,0.025,0.05,9000);
}
function schedule(){
  if(!ac||ac.state!=='running') return;
  if(nextT < ac.currentTime-0.1) nextT = ac.currentTime;
  while(nextT < ac.currentTime+0.15){
    const bpm = Math.min(200, 135+wave*5+(bossAlive?15:0)), sd = 60/bpm/4;

const _c=new THREE.Vector3(), _mp=new THREE.Vector3(), _d=new THREE.Vector3(), _end=new THREE.Vector3();
function raySphere(o,d,c,r){
  const ox=o.x-c.x, oy=o.y-c.y, oz=o.z-c.z;
  const b=ox*d.x+oy*d.y+oz*d.z, cc=ox*ox+oy*oy+oz*oz-r*r, disc=b*b-cc;
  if(disc<0) return null;
  const sq=Math.sqrt(disc); let t=-b-sq; if(t<0) t=-b+sq; return t<0?null:t;
}
function rayEnemy(o,d,e){
  if(e.hidden) return null;
  if(e.segs){
    const hp=e.mesh.position;
    const th=raySphere(o,d,_c.set(hp.x,hp.y+0.75*e.s,hp.z),0.7*e.s);
    if(th!==null) return {t:th,head:true};
    let bt=null;
    for(const sg of e.segs){ const t=raySphere(o,d,_c.set(sg.position.x,sg.position.y,sg.position.z),0.55*e.s*sg.scale.x/e.s); if(t!==null&&(bt===null||t<bt)) bt=t; }
    return bt!==null?{t:bt,head:false}:null;
  }
  const p=e.mesh.position, ry=e.mesh.rotation.y, fx=-Math.sin(ry), fz=-Math.cos(ry);
  let ht=null, bt=null;
  for(const h of e.hit){
    const t=raySphere(o,d,_c.set(p.x+fx*h.fwd*e.s, p.y+h.y*e.s, p.z+fz*h.fwd*e.s), h.r*e.s);
    if(t===null) continue;
    if(h.head){ if(ht===null||t<ht) ht=t; } else if(bt===null||t<bt) bt=t;
  }
  if(ht!==null) return {t:ht,head:true};
  if(bt!==null) return {t:bt,head:false};
  return null;
}
function groundT(o,d,max){ return d.y<-1e-4 ? Math.min(max,-o.y/d.y) : max; }

function shoot(){
  const w=WEAPONS[P.weapon], wm=wDmg(P.weapon);
  if(celeb||vpose||mode!=='play'||P.reload>0||P.cd>0||P.down) return;
  if(P.ammo[P.weapon]<=0){ startReload(); return; }
  P.ammo[P.weapon]--; P.cd=w.rate/(1+0.15*cardN('rate'));
  updateCamera(); sheriff.updateMatrixWorld(true);
  SH.muzzle.getWorldPosition(_mp);
  let anyHit=false, anyHead=false;

  if(w.thrown){
    // 다이너마이트: 조준점으로 포물선 투척
    let bt=groundT(camera.position,tmpF,40);
    for(const e of enemies){ const r=rayEnemy(camera.position,tmpF,e); if(r&&r.t<bt) bt=r.t; }
    _end.copy(camera.position).addScaledVector(tmpF,bt); _end.y=0;
    throwDynamite(_mp,_end,w.fire);
  } else {
    for(let i=0;i<w.pellets;i++){
      _d.copy(tmpF).addScaledVector(tmpR,(Math.random()*2-1)*w.spread).addScaledVector(tmpU,(Math.random()*2-1)*w.spread).normalize();
      const gT = Math.min(groundT(camera.position,_d,90), w.range||90);
      if(w.pierce){
        const hits=[];
        for(const e of enemies){ const r=rayEnemy(camera.position,_d,e); if(r&&r.t<gT) hits.push([e,r.head]); }
        _end.copy(camera.position).addScaledVector(_d,gT);
        addTracer(_mp,_end,w.color);
        for(const [e,head] of hits){ anyHit=true; if(head) anyHead=true; playerHit(e,w.dmg*wm*(head?(w.headMul||2)*(P.relics.includes('twin')?1.5:1)*(roleIs('sniper')?1.4:1):1),head); }
        if(w.twice){ const hh=hits.map(h=>h[0]), dd=w.dmg*wm, a=_end.clone(), b=_mp.clone(); setTimeout(()=>{ if(mode!=='play') return; addTracer(a,b,w.color); for(const e of hh) if(enemies.includes(e) && e.hp>0) playerHit(e,dd,false); sfx('whoosh'); },380); }
      } else {
        let bt=w.lasso?Math.min(gT,22):gT, be=null, bh=false;
        for(const e of enemies){ const r=rayEnemy(camera.position,_d,e); if(r&&r.t<bt){ bt=r.t; be=e; bh=r.head; } }
        _end.copy(camera.position).addScaledVector(_d,bt);
        addTracer(_mp,_end,w.color);
        if(be){ anyHit=true; if(bh) anyHead=true; playerHit(be,w.dmg*wm*(bh?(w.headMul||2)*(P.relics.includes('twin')?1.5:1)*(roleIs('sniper')?1.4:1):1),bh); if(w.lasso) lassoHit(be); weaponExtra(w,be,bh,w.dmg*wm); }
      }
    }
    SH.flash.visible=true; P.flashT=0.05;
  }
  if(anyHit){ hitT=0.12; $('cross').className = anyHead?'head':'hit'; }
  P.kick = Math.min(0.12, P.kick + (w.pellets>1?0.06:w.pierce?0.05:0.02));
  sfx(w.snd);
  if(P.ammo[P.weapon]<=0) startReload();
}
function addTracer(a,b,color){

  const line=new THREE.Line(geo,new THREE.LineBasicMaterial({color,transparent:true}));
  scene.add(line); tracers.push({line,life:0.07});
}

    showMsg('🏆 '+e.name+' 격파!',3,'보물 상자·금 방어구·전용 유물을 주우세요'); queueVPose();
    const rid=relicOfBoss(e.kind); if(rid) spawnItem(p.x-3,p.z,'relic',{id:rid});

// ---------- 쓰러지는 연출 ----------
//  fall: 맞은 방향 뒤로 털썩 · blast: 폭발에 날아감 · boss: 무릎 꿇고 쓰러짐
//  side: 황소는 옆으로 · snake: 축 늘어짐 · fade: 유령은 떠오르며 사라짐
function startCorpse(e, head){
  setEmissive(e, e.baseEm||0);
  if(e.mk){ scene.remove(e.mk); e.mk.material.dispose(); e.mk=null; }
  const p=e.mesh.position;
  let dx=p.x-P.x, dz=p.z-P.z;
  if(e.lastBlast){ dx=p.x-e.lastBlast.x; dz=p.z-e.lastBlast.z; }
  const dl=Math.hypot(dx,dz)||1; dx/=dl; dz/=dl;
  const k = (e.kind==='ghost'||e.kind==='decoy'||e.kind==='mghost') ? 'fade' : e.segs ? 'snake' : (e.kind==='bull'||e.kind==='calf') ? 'side'
          : (e.lastBlast && !e.boss) ? 'blast' : e.boss ? 'boss' : 'fall';
  e.mesh.rotation.order='YXZ';
  if(k==='fall'||k==='blast'||k==='boss') e.mesh.rotation.y=Math.atan2(dx,dz);   // 보안관 쪽을 본 채로 뒤로 넘어지게
  if(k==='fade') e.mats.forEach(m=>{ m.transparent=true; });
  const c={e, k, t:0, dx, dz, vy:k==='blast'?7:0, side:Math.random()<0.5?1:-1, hats:[], hv:null};
  if(head && (k==='fall'||k==='blast')){
    e.mesh.updateMatrixWorld(true);
    const hs=[]; e.mesh.traverse(o=>{ if(o.userData.hat) hs.push(o); });
    hs.forEach(h=>scene.attach(h));
    c.hats=hs; c.hv={x:dx*3+(Math.random()-0.5)*2, y:6, z:dz*3+(Math.random()-0.5)*2};
  }
  corpses.push(c);
}
function updateCorpses(dt){
  const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
  for(let i=corpses.length-1;i>=0;i--){
    const c=corpses[i], e=c.e, m=e.mesh, p=m.position; c.t+=dt;
    let done=false;
    if(c.k==='fall'){
      m.rotation.x=ease(c.t/0.4)*Math.PI/2;
      if(c.t<0.4){ const v=3*(1-c.t/0.4); p.x+=c.dx*v*dt; p.z+=c.dz*v*dt; }
      if(c.t>2.4) p.y-=dt*1.2*e.s;
      done=c.t>3.2;
    } else if(c.k==='blast'){
      if(c.land===undefined){
        c.vy-=20*dt; p.y=Math.max(0,p.y+c.vy*dt); p.x+=c.dx*6*dt; p.z+=c.dz*6*dt; m.rotation.x+=dt*11;
        if(p.y<=0 && c.vy<0){ c.land=c.t; m.rotation.x=Math.PI/2; burst(p.x,0.3,p.z,0xc8a26a,8); }
      } else if(c.t>c.land+2) p.y-=dt*1.2*e.s;
      done = c.land!==undefined && c.t>c.land+2.8;
    } else if(c.k==='boss'){
      if(c.t<0.6){ const f=ease(c.t/0.6); p.y=-0.25*e.s*f; m.rotation.x=-0.25*f; }
      else { m.rotation.x=-0.25+ease((c.t-0.6)/0.8)*(Math.PI/2+0.25); if(c.t<1.5 && c.t+dt>=1.4){ burst(p.x,0.4,p.z,0xc8a26a,20); P.shake=Math.max(P.shake,0.3); } }
      if(c.t>4.4) p.y-=dt*1.0*e.s;
      done=c.t>5.6;
    } else if(c.k==='side'){
      m.rotation.z=ease(c.t/0.7)*Math.PI/2*c.side;
      if(c.t<0.75 && c.t+dt>=0.7){ burst(p.x,0.4,p.z,0xc8a26a,20); P.shake=Math.max(P.shake,0.35); }
      if(c.t>4.4) p.y-=dt*1.0*e.s;
      done=c.t>5.6;
    } else if(c.k==='snake'){
      m.rotation.z=ease(c.t/0.5)*0.9; p.y=-0.3*e.s*ease(c.t/0.5);
      if(c.t>3.4){ p.y-=dt*0.8*e.s; e.segs.forEach(sg=>sg.position.y-=dt*0.8*e.s); }
      done=c.t>4.6;
    } else { // fade
      p.y+=dt*1.5; e.mats.forEach(mt=>mt.opacity=Math.max(0,0.6*(1-c.t)));
      if(Math.random()<0.4) burst(p.x,1.5*e.s+p.y,p.z,0xb3e5fc,1);
      done=c.t>1.0;
    }
    if(c.k==='fall'||c.k==='blast'||c.k==='boss'){
      const f=Math.min(1,c.t/0.4);
      e.legs.forEach(([g],j)=>g.rotation.x=(j%2?0.45:-0.3)*f);
    }
    if(c.hv){
      c.hv.y-=18*dt;
      for(const h of c.hats){ h.position.x+=c.hv.x*dt; h.position.z+=c.hv.z*dt; h.position.y=Math.max(0.05,h.position.y+c.hv.y*dt); h.rotation.x+=dt*9; h.rotation.z+=dt*5; }
      if(c.hats.length && c.hats[0].position.y<=0.06 && c.hv.y<0){ c.hv.x*=0.3; c.hv.z*=0.3; c.hv.y=0; for(const h of c.hats) h.rotation.x=Math.PI; c.hv=null; }
    }
    if(done){ removeEnemyMeshes(e); c.hats.forEach(h=>scene.remove(h)); corpses.splice(i,1); }
  }
}

function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function dailyState(){
  let st=LS.get('sheriffDaily',null); const k=todayKey();
  if(!st || st.date!==k){
    let h=0; for(const ch of k) h=(h*31+ch.charCodeAt(0))>>>0;
    const ids=[]; while(ids.length<3){ h=(Math.imul(h,1103515245)+12345)>>>0; const id=DAILY_POOL[(h>>>8)%DAILY_POOL.length].id; if(!ids.includes(id)) ids.push(id); }
    st={date:k, ids, prog:{}, done:{}}; LS.set('sheriffDaily',st);
  }
  return st;
}
let toastQ=[], toastBusy=false;
function toast(t,sub){
  if(typeof toastFilter==='function' && !toastFilter(t,sub)) return;
  toastQ.push([t,sub]); if(toastBusy) return;
  const next=()=>{ const it=toastQ.shift(); if(!it){ toastBusy=false; return; } toastBusy=true;
    const el=$('toast'); el.textContent=it[0]; if(it[1]){ const sm=document.createElement('small'); sm.textContent=it[1]; el.appendChild(sm); }
    el.style.opacity=1; sfx('reward'); setTimeout(()=>{ el.style.opacity=0; setTimeout(next,350); },2600); };
  next();
}
function addCoins(n){ if(n<=0) return; coins+=n; LS.set('sheriffCoins',coins); track('coinsEarned',n); }
function track(key,n,isMax){
  if(mp && (key==='kill'||key==='boss')) weeklyTrack(key==='kill'?'mpKill':'mpBoss', n===undefined?1:n);
  if(runMode==='practice') return;   // 연습장은 기록하지 않음
  if(n===undefined) n=1; isMax = isMax || !!MAXKEYS[key];
  // 오늘의 도전 (한 판 기준 최고값 / 누적)
  const st=dailyState(); let ch=false;
  for(const id of st.ids){
    const d=DAILY_POOL.find(x=>x.id===id); if(!d || d.key!==key || st.done[id]) continue;
    st.prog[id] = isMax ? Math.max(st.prog[id]||0,n) : (st.prog[id]||0)+n; ch=true;
    if(st.prog[id]>=d.n){ st.done[id]=true; LS.set('sheriffDaily',st); addCoins(d.coin); seasonStar(2,'오늘의 도전'); toast('📅 오늘의 도전 완료! '+d.text,'+'+d.coin+' 코인'); }
  }
  if(ch) LS.set('sheriffDaily',st);
  // 누적 기록
  if(isMax){ if(n<=stat(key)) return; stats[key]=n; } else stats[key]=stat(key)+n;
  LS.set('sheriffStats',stats);
  for(const a of ACH){
    if(achDone[a.id] || a.key!==key || stat(key)<a.n) continue;
    achDone[a.id]=Date.now(); LS.set('sheriffAch',achDone); seasonStar(1);
    addCoins(a.coin);
    toast('🏅 업적 달성: '+a.icon+' '+a.name, (a.coin?'+'+a.coin+' 코인':'')+(a.unlock?(a.coin?' · ':'')+a.unlock+' 해금!':''));
    if(a.unlock) applyLook();
  }
}

function startWeather(type){

function endWeather(){

const wxSlow=()=> weather && weather.type==='snow' ? 0.85 : 1;
function updateWeather(dt){
  if(!weather) return;
  const w=weather, a=w.obj.geometry.attributes.position, arr=a.array, cx=camera.position.x, cz=camera.position.z;
  const vx = w.type==='sand'?26 : w.type==='snow'?5 : 2, vy = w.type==='rain'?-38 : w.type==='snow'?-3 : -0.5;
  const stride = w.type==='rain'?6:3, t=performance.now()/1000;
  for(let i=0;i<w.n;i++){
    const k=i*stride;
    let x=arr[k]+vx*dt+(w.type==='snow'?Math.sin(t+i)*dt:0), y=arr[k+1]+vy*dt, z=arr[k+2]+(w.type==='sand'?Math.sin(t*2+i)*3*dt:0);
    if(y<0) y+=26; if(y>26) y-=26;
    if(x-cx>30) x-=60; if(x-cx<-30) x+=60; if(z-cz>30) z-=60; if(z-cz<-30) z+=60;
    arr[k]=x; arr[k+1]=y; arr[k+2]=z;
    if(stride===6){ arr[k+3]=x+0.08; arr[k+4]=y-0.9; arr[k+5]=z; }
  }
  a.needsUpdate=true;
  if(w.type==='rain'){
    w.bolt-=dt;
    if(w.bolt<=0){
      w.bolt=4+Math.random()*4;
      const near=enemies.filter(e=>!e.hidden && Math.hypot(e.mesh.position.x-P.x,e.mesh.position.z-P.z)<45);
      const tgt=near.length?near[Math.floor(Math.random()*near.length)]:null;
      const bx = tgt?tgt.mesh.position.x : P.x+(Math.random()-0.5)*60, bz = tgt?tgt.mesh.position.z : P.z+(Math.random()-0.5)*60;
      const pts=[]; let x=bx+(Math.random()-0.5)*6, y=40, z=bz+(Math.random()-0.5)*6;
      for(let k=0;k<9;k++){ const nx=k===8?bx:x+(Math.random()-0.5)*4, ny=40-(k+1)*5, nz=k===8?bz:z+(Math.random()-0.5)*4; pts.push(x,y,z,nx,ny,nz); x=nx; y=ny; z=nz; }
      const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
      const line=new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0xffffff})); scene.add(line); w.bolts.push({line,life:0.18});
      w.flash=0.25; burst(bx,0.5,bz,0xfff59d,16);
      if(tgt) hitEnemy(tgt, tgt.boss ? Math.ceil(tgt.maxHp*0.04) : 8, false);
      if(ac&&!muted){ const tt=ac.currentTime; noise(tt,0.15,0.6,2000); noise(tt+0.25,1.2,0.6,60); tone(60,tt+0.25,1.0,'sine',0.4,30); }
    }
    for(let i=w.bolts.length-1;i>=0;i--){ const b=w.bolts[i]; b.life-=dt; if(b.life<=0){ scene.remove(b.line); b.line.geometry.dispose(); b.line.material.dispose(); w.bolts.splice(i,1); } }
    if(w.flash>0){ w.flash-=dt; hemi.intensity = w.hemiBase*0.7 + (w.flash>0?w.flash*6:0); }
  }
}

const LYRICS=['🎵 황금빛 사막 위로 해가 지면~','🎵 보안관의 별이 반짝이네~','🎵 악당들아 도망쳐라, 이히~!','🎵 이 마을은 내가 지킨다~ 🤠'];
function singNote(f,t,dur){
  const o=ac.createOscillator(), lfo=ac.createOscillator(), lg=ac.createGain(), bp=ac.createBiquadFilter(), lp=ac.createBiquadFilter(), g=ac.createGain();
  o.type='sawtooth'; o.frequency.setValueAtTime(f,t);
  lfo.frequency.value=5.6; lg.gain.value=f*0.014; lfo.connect(lg); lg.connect(o.frequency);   // 비브라토
  bp.type='bandpass'; bp.frequency.value=1000; bp.Q.value=0.9; lp.type='lowpass'; lp.frequency.value=2600;
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.5,t+0.03); g.gain.setValueAtTime(0.42,t+dur*0.7); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(bp); bp.connect(lp); lp.connect(g); g.connect(songGain);
  o.start(t); lfo.start(t); o.stop(t+dur+0.05); lfo.stop(t+dur+0.05);
}
function songTone(f,t,dur,type,vol,slide){
  const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur); o.connect(g); g.connect(songGain); o.start(t); o.stop(t+dur+0.02);
}
function playSong(){
  if(!ac) return;
  songGain=ac.createGain(); songGain.gain.value=1; songGain.connect(musicBus||master);
  const t0=ac.currentTime+0.9, e=0.25;   // 120 BPM, 8분음표 0.25초
  songUntil=t0+8.4;
  const MELO=[[67,69,71,74,74,0,71,69],[69,71,72,74,76,74,72,71],[74,74,76,74,71,69,67,69],[71,69,67,62,67,0,0,0]];
  const ROOT=[43,50,48,50,43,50,45,43];   // 마디마다 베이스 (오-파)
  MELO.forEach((line,li)=>line.forEach((n,i)=>{ if(n) singNote(mtof(n), t0+(li*8+i)*e, e*(line[i+1]===0?1.9:0.95)); }));
  for(let beat=0;beat<16;beat++){
    const t=t0+beat*0.5, r=ROOT[Math.floor(beat/2)];
    songTone(mtof(r+12),t,0.22,'square',0.12);                          // 쿵
    songTone(mtof(r+19),t+0.25,0.15,'triangle',0.1);                    // 짝
    if(beat%2===1) noiseClap(t);

  songTone(500,t0+8.0,0.45,'sawtooth',0.18,1300); songTone(760,t0+8.05,0.4,'square',0.07,1600);
}

const labelMats = {};
function labelMat(text, color){
  const key=text+color; if(labelMats[key]) return labelMats[key];
  const c=document.createElement('canvas'), x=c.getContext('2d');
  const font='bold 44px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
  x.font=font; const tw=Math.ceil(x.measureText(text).width);
  c.width=tw+44; c.height=72;
  x.font=font; x.textAlign='center'; x.textBaseline='middle';
  const r=18, w=c.width, h=c.height;
  x.beginPath(); x.moveTo(r,2); x.lineTo(w-r,2); x.quadraticCurveTo(w-2,2,w-2,r); x.lineTo(w-2,h-r); x.quadraticCurveTo(w-2,h-2,w-r,h-2);
  x.lineTo(r,h-2); x.quadraticCurveTo(2,h-2,2,h-r); x.lineTo(2,r); x.quadraticCurveTo(2,2,r,2); x.closePath();
  x.fillStyle='rgba(20,12,6,.78)'; x.fill(); x.lineWidth=4; x.strokeStyle=color; x.stroke();
  x.fillStyle='#fff'; x.fillText(text, w/2, h/2+2);
  const tex=new THREE.CanvasTexture(c); tex.minFilter=THREE.LinearFilter;
  const m=new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false});
  m.userData.aspect = w/h;
  return labelMats[key]=m;
}
function itemLabelInfo(it){
  const hex=n=>'#'+n.toString(16).padStart(6,'0');
  switch(it.type){
    case 'hp':    return ['❤️ 체력 +25', '#66bb6a', false];
    case 'ammo':  return ['🔫 탄약', '#42a5f5', false];

    case 'relic': { const R=RELICS[it.rid]; return [R.icon+' '+R.name, '#b388ff', true]; }
    case 'armor': { const A=ARMOR[it.slot]; return [A.icon+' '+TIERN[it.tier]+' '+A.name, hex(TIERC[it.tier]), it.tier>=3]; }

}
function attachLabel(it){

function spawnBoss(kind){
  const [x,z]=spawnPos(32);

  const wlvSum = (P.wlv||[]).reduce((a,b)=>a+b,0), hpExtra = Math.max(0,P.maxHp-100);
  const gearB = runMode==='practice' ? 0 : Math.floor((extra+mounts+relics+Math.floor(armorSum/3)+Math.floor(wlvSum/4)+Math.floor(hpExtra/40))/2);
  const tier = 1 + n + gearB + D().bossTier;                                                     // ★ 단계
  const hpMul = (1+0.45*n) * (1+0.45*extra+0.2*mounts) * (1+0.25*relics) * (1+0.05*wlvSum) * (1+hpExtra/250);          // 등장 횟수 × 내 장비
  const dMul = 1 + 0.15*(tier-1), T1=tier-1;

  const common = {kind, boss:true, name:BOSSES[kind].name, tier, hp, score:500*tier, dmg:Math.round(15*dMul), summon:5};
  let e;
  if(kind==='gunner'){
    const s=Math.min(3.2,2.2+0.1*T1);
    e = baseEnemy(makeBandit(tier>=4?0x4a0f0f:0x2b2b2b,s,true,'gunner'), {...common, s, rad:0.5*s, speed:3+0.15*T1, t:2,
      bdmg:Math.round(8*dMul), bombDmg:Math.round(20*dMul), ringT:4, bombT:3, special:0});

    const s=Math.min(2.8,2.0+0.08*T1);

  } else if(kind==='snake'){
    const s=Math.min(2.2,1.5+0.06*T1), md=makeSnake(s);
    e = baseEnemy(md, {...common, s, rad:0.8*s, speed:4+0.2*T1, t:6, spitT:3, chain:1,
      eruptDmg:Math.round(25*dMul), venomDmg:Math.round(5*dMul)});
    e.segs=md.segs; md.segs.forEach(sg=>{ sg.position.x=x; sg.position.z=z; scene.add(sg); e.mats.push(sg.material); });
  } else if(kind==='miner'){
    const s=Math.min(2.8,2.0+0.08*T1);
    e = baseEnemy(makeMiner(s), {...common, s, rad:0.5*s, speed:2.6+0.12*T1, t:2, digT:6, mineT:4,
      bombDmg:Math.round(20*dMul)});
  } else if(kind==='ghost'){
    const s=Math.min(2.8,2.0+0.08*T1);
    e = baseEnemy(makeGhost(s), {...common, s, rad:0.5*s, speed:3.2+0.15*T1, t:2, tpT:6, baseEm:0x1a3a6a,
      bdmg:Math.round(10*dMul)});
  } else if(kind==='eagle'){
    const s=Math.min(2.4,1.6+0.07*T1);
    e = baseEnemy(makeEagle(s), {...common, s, rad:1.1*s, hit:EAGLE_HIT, speed:6+0.25*T1, t:3.5, dir:1, state:'circle', noMelee:true,
      chargeDmg:Math.round(26*dMul), bdmg:Math.round(7*dMul)});
  } else if(kind==='golem'){
    const s=Math.min(2.2,1.5+0.06*T1);
    e = baseEnemy(makeGolem(s), {...common, s, rad:0.75*s, hit:GOLEM_HIT, speed:1.9+0.1*T1, t:3, bdmg:Math.round(8*dMul), shockDmg:Math.round(16*dMul)});
  } else if(kind==='lava'||kind==='croc'||kind==='cav'){
    e = spawnNewBoss(kind,common,T1,dMul);
  } else if(kind==='twins'){
    const s=Math.min(2.6,1.8+0.08*T1);
    e = baseEnemy(makeBandit(0x8e1b1b,s,true,'gunner'), {...common, name:'쌍둥이 무법자 「왼손」', side:'L', s, rad:0.5*s, speed:3.2+0.15*T1, t:2,
      bdmg:Math.round(7*dMul), bombDmg:Math.round(18*dMul)});
  } else {
    const s=Math.min(3.0,2.1+0.08*T1);

function summonMinions(e){
  const cap = ({easy:4,normal:5,hard:6,hell:8})[(runMode==='rush'||runMode==='practice')?'normal':diff]||5;
  const alive = enemies.filter(x=>x.minion && x.hp>0).length;
  const n = Math.min(2+Math.floor((e.tier-2)/2), cap-alive, 32-enemies.length);
  if(n<=0) return;
  const p=e.mesh.position;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, r=e.rad+2.5+Math.random()*2;
    const pos={x:p.x+Math.cos(a)*r, z:p.z+Math.sin(a)*r};
    clampArena(pos,3); pushOut(pos,0.6);
    spawnMinion(e,pos.x,pos.z);
    burst(pos.x,1,pos.z,0x9e9e9e,12);
  }
  showMsg('📣 '+e.name+': '+MINION_NAME[e.kind]+' '+n+'마리 소환!',1.8);
  sfx('whistle');
}

function snakeFollow(e){

}

function strafe(e,dt,ux,uz,d,near,far){
  const p=e.mesh.position; let mx=0,mz=0;

}
function aimShot(e,ux,uz,d,n,spreadA,dmg,opt){
  const p=e.mesh.position, base=Math.atan2(ux,uz), y=1.55*e.s+p.y;
  for(let i=0;i<n;i++){

    fireEnemyBullet(p.x+ux*1.2*e.s, y, p.z+uz*1.2*e.s, Math.sin(a), Math.cos(a), d, dmg, opt);
  }
}

function setSnakeVis(e,v){ e.mesh.visible=v; e.segs.forEach(sg=>sg.visible=v); }
function updateSnake(e,dt,ux,uz,d){
  const p=e.mesh.position, T=e.tier; e.t-=dt;
  let spd=0;
  if(e.state==='chase'){
    e.wv=(e.wv||0)+dt*3;
    const a=Math.atan2(ux,uz)+Math.sin(e.wv)*0.6, dx=Math.sin(a), dz=Math.cos(a);

      scene.remove(e.mk); e.mk.material.dispose(); e.mk=null;

      else { e.state='chase'; e.t=Math.max(4.5,(T>=4?7:9)-T*0.3); }
    }
  } else if(e.state==='rest'){
    if(e.t<=0){ e.state='burrow'; e.t=0.8; e.hidden=true; setSnakeVis(e,false); }
  }
  // 몸통이 머리를 따라감
  let px=p.x, pz=p.z;
  for(const sg of e.segs){
    const gap=0.95*sg.scale.x;

    if(dd>gap){ sg.position.x=px+dx/dd*gap; sg.position.z=pz+dz/dd*gap; }
    if(dd>0.01) sg.rotation.y=Math.atan2(dx,dz);
    px=sg.position.x; pz=sg.position.z;

function updateMiner(e,dt,ux,uz,d){
  const p=e.mesh.position, T=e.tier;
  if(e.state==='dig'){ e.t-=dt; p.y=-3*(1-Math.max(0,e.t)/0.6); if(e.t<=0){ e.hidden=true; e.state='under'; e.t=0.8; } return 0; }
  if(e.state==='under'){
    e.t-=dt; if(Math.random()<0.4) burst(p.x,0.2,p.z,0x8d6e63,1);
    if(e.t<=0){
      const a=Math.random()*Math.PI*2, r=14+Math.random()*6;
      const pos={x:P.x+Math.cos(a)*r, z:P.z+Math.sin(a)*r}; clampArena(pos,4); pushOut(pos,e.rad);
      p.x=pos.x; p.z=pos.z; e.state='rise'; e.t=0.6; e.hidden=false;
      burst(p.x,0.5,p.z,0x8d6e63,25); sfx('thud');
    }
    return 0;
  }
  if(e.state==='rise'){ e.t-=dt; p.y=-3*Math.max(0,e.t)/0.6; if(e.t<=0){ p.y=0; e.state='chase'; } return 0; }
  strafe(e,dt,ux,uz,d,10,18);
  e.t-=dt;
  if(e.t<=0){
    e.t=Math.max(1.2,2.4-T*0.15);
    const n=T>=4?3:1;
    for(let i=0;i<n;i++) throwLob(e, P.x+(i?(Math.random()-0.5)*9:0), P.z+(i?(Math.random()-0.5)*9:0), 'boom', e.bombDmg);
  }
  if(T>=3){ e.digT-=dt; if(e.digT<=0){ e.digT=Math.max(6,9-T*0.4); e.state='dig'; e.t=0.6; sfx('thud'); } }
  if(T>=5){
    e.mineT-=dt;
    if(e.mineT<=0){ e.mineT=10; for(let i=0;i<3;i++){ const a=Math.random()*Math.PI*2, r=3+Math.random()*5; placeMine(p.x+Math.cos(a)*r,p.z+Math.sin(a)*r,e.bombDmg); } }
  }
  return e.speed;
}

function updateGunner(e,dt,ux,uz,d){
  const p=e.mesh.position, T=e.tier, ph2 = e.hp < e.maxHp*0.5;
  e.mesh.rotation.y=Math.atan2(-ux,-uz);
  // ★3+ 360° 탄막 난사: 금빛으로 번쩍이며 준비 후 사방으로 발사
  if(e.special>0){
    e.special-=dt; e.mesh.rotation.y += Math.sin(e.special*30)*0.2;
    if(e.special<=0){
      const n=10+T*2, y=1.55*e.s;
      for(let i=0;i<n;i++){ const a=i/n*Math.PI*2; fireEnemyBullet(p.x,y,p.z,Math.sin(a),Math.cos(a),20,e.bdmg); }
      setEmissive(e,0); sfx('shotgun');
    }
    return 0;
  }
  let mx=0,mz=0;
  if(d>15){ mx=ux; mz=uz; } else if(d<9){ mx=-ux; mz=-uz; } else { mx=-uz*e.dir; mz=ux*e.dir; }
  e.dirT-=dt; if(e.dirT<=0){ e.dir*=-1; e.dirT=1.5+Math.random()*2; }
  p.x+=mx*e.speed*dt; p.z+=mz*e.speed*dt;
  e.t-=dt;
  if(e.t<=0){
    e.t = (ph2?0.85:1.4) * Math.max(0.5, 1-0.06*(T-1));
    const n = ph2 ? (T>=4?5:3) : 1, base=Math.atan2(ux,uz), y=1.55*e.s;
    for(let i=0;i<n;i++){
      const a=base+(i-(n-1)/2)*0.22;
      fireEnemyBullet(p.x+ux*1.6*e.s, y, p.z+uz*1.6*e.s, Math.sin(a), Math.cos(a), d, e.bdmg);
    }
    sfx('eshot');
  }
  if(T>=3){
    e.ringT-=dt;
    if(e.ringT<=0){ e.ringT=Math.max(4.5,8-T*0.4); e.special=0.8; setEmissive(e,0x806000); sfx('roar'); }
  }
  if(T>=5){
    e.bombT-=dt;
    if(e.bombT<=0){ e.bombT=Math.max(3.5,6.5-T*0.3); throwBossBomb(e); }
  }
  return e.speed;
}
function updateBull(e,dt,ux,uz){
  const p=e.mesh.position, ph2 = e.hp < e.maxHp*0.5, T=e.tier;
  e.t-=dt;
  switch(e.state){
    case 'chase':
      p.x+=ux*e.speed*dt; p.z+=uz*e.speed*dt; e.mesh.rotation.y=Math.atan2(-ux,-uz);
      if(e.t<=0){
        e.state='windup'; e.t=Math.max(0.4,(ph2?0.6:1.0)-0.05*(T-1));
        e.chain = T>=5 ? 3 : (T>=2 && ph2) ? 2 : 1;
        setEmissive(e,0x660000); sfx('roar');
      }
      return e.speed;
    case 'windup':
      e.mesh.rotation.y=Math.atan2(-ux,-uz); e.cx=ux; e.cz=uz;
      if(Math.random()<0.5) burst(p.x+ux*1.95*e.s, 1.25*e.s, p.z+uz*1.95*e.s, 0xeeeeee, 1);   // 콧김
      p.y=Math.abs(Math.sin(e.t*40))*0.12;
      if(e.t<=0){ e.state='charge'; e.t=1.4; e.hitP=false; p.y=0; setEmissive(e,0); }
      return 0;
    case 'charge': {
      const sp=(ph2?27:22)+T*0.8;
      p.x+=e.cx*sp*dt; p.z+=e.cz*sp*dt;
      const bx=p.x, bz=p.z; pushOut(p,e.rad*0.6);
      let stop = Math.abs(p.x-bx)+Math.abs(p.z-bz) > 0.01;
      if(clampArena(p,2.5)) stop=true;
      if(!e.hitP && Math.hypot(P.x-p.x,P.z-p.z) < e.rad+0.8){
        e.hitP=true; hurtPlayer(e.chargeDmg,'melee'); P.x+=e.cx*4; P.z+=e.cz*4; P.shake=0.6;
      }
      if(stop||e.t<=0){
        e.chain--;
        if(stop){
          e.state='stun'; e.t=e.stunT;
          P.shake=Math.max(P.shake,0.35); sfx('thud'); burst(p.x,1,p.z,0xd9a95f,16);
          if(T>=3) shockwave(e);
        } else if(e.chain>0){
          e.state='windup'; e.t=0.35; setEmissive(e,0x660000); sfx('roar');
        } else {
          e.state='chase'; e.t=(ph2?1.4:2.4)*Math.max(0.6,1-0.05*(T-1));
        }
      }
      return sp;
    }
    case 'stun':
      e.mesh.rotation.z = Math.sin(e.t*12)*0.05;
      if(e.t<=0){ e.state='chase'; e.t=(ph2?1.4:2.4)*Math.max(0.6,1-0.05*(T-1)); e.mesh.rotation.z=0; }
      return 0;
  }
  return 0;
}

function mutTotal(){ let n=0; for(const k in muts) n+=muts[k]; return n; }

function scoreMul(){ if(ruleIs('fast')) return 1.5; if(runMode==='event') return curEvent().scoreMul||1; return runMode==='endless' ? 1+0.1*mutTotal()+0.3*(muts.rich||0) : 1; }

// ---------- ⚔️ 주간 보스 러시 ----------
const RUSH_ICON={gunner:'🎩', bull:'🐂', snake:'🐍', miner:'⛏', ghost:'👻', gang:'🚂', eagle:'🦅', golem:'🌵', twins:'👯'};
let rush=null;
function weekKey(d){
  d=d||new Date(); const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day);
  const y=t.getUTCFullYear(), w=Math.ceil(((t-Date.UTC(y,0,1))/86400000+1)/7);
  return y+'-W'+String(w).padStart(2,'0');
}
function seeded(str){ let h=2166136261; for(const ch of str) h=Math.imul(h^ch.charCodeAt(0),16777619)>>>0; return ()=>{ h=(Math.imul(h,1103515245)+12345)>>>0; return (h>>>8)/16777216; }; }
const RUSH_N=9;
function rushPlan(){
  const wk=weekKey(), R=seeded('rush'+wk), order=['gunner','bull','snake','miner','ghost','gang','eagle','golem','twins'];
  for(let i=order.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
  order.length=RUSH_N;
  const rules=MUT_KEYS.filter(k=>k!=='rich');
  return {wk:wk+'-9', order, rule:rules[Math.floor(R()*rules.length)]};
}
function bossStage(kind){ const a=STAGE_BOSSES.findIndex(x=>x[0]===kind); return a>=0 ? a : STAGE_BOSSES.length+STAGE_BOSSES.findIndex(x=>x[1]===kind); }
function fmtTime(sec){ const m=Math.floor(sec/60), s=sec-m*60; return m+':'+(s<10?'0':'')+s.toFixed(1); }
function startRush(){
  const pl=rushPlan();
  rush={...pl, idx:0, t:0, brk:3};
  muts={[pl.rule]:1};
  // 러시 기본 장비: 개틀링건 · 다이너마이트 · 애마 · 곰덫 2개
  for(const i of [3,4]){ WEAPONS[i].owned=true; P.ammo[i]=wMag(i); }
  if(!P.mounts.includes('horse')) P.mounts.push('horse'); P.mount=P.mount||'horse';
  P.traps.bear+=2;
  paintModeHud();
  showMsg('⚔️ 주간 보스 러시 ('+pl.wk.slice(0,8)+')',3.5,'순서: '+pl.order.map(k=>RUSH_ICON[k]).join(' → ')+' · 이번 주 규칙: '+MUTS[pl.rule].icon+' '+MUTS[pl.rule].name);
}
function updateRush(dt){
  rush.t+=dt;
  if(toSpawn===0 && enemies.length===0){
    if(rush.idx>=RUSH_N){ rushEnd(true); return; }
    rush.brk-=dt;
    if(rush.brk<=0){
      const kind=rush.order[rush.idx]; rush.idx++; wave=rush.idx;
      const st=bossStage(kind); if(st!==curTheme) changeTheme(st);
      bossSpawned=Math.round((rush.idx-1)*5/8); spawnBoss(kind);
      toSpawn=Math.round(3*mutCount()); spawnT=2; rush.brk=6;
    }
  }
}
function rushEnd(cleared){

let onlineRush=[], failedRush=[], lastRush=null;
function cleanRush(x){
  if(!x||typeof x!=='object') return null;
  const t=Math.floor(Number(x.t)); if(!(t>0 && t<360000)) return null;
  return {name:String(x.name||'???').slice(0,12), t, wk:String(x.wk||'').slice(0,10), date:String(x.date||'').slice(0,40), ...(x.tt?{tt:String(x.tt).slice(0,12)}:{})};
}
const sameRush=(a,b)=>a&&b&&a.date===b.date&&a.name===b.name&&a.t===b.t;
function localRush(){ const a=LS.get('sheriffRush',[]); return Array.isArray(a)?a.map(cleanRush).filter(Boolean):[]; }
function localSaveRush(en){ const a=localRush(); a.push(en); a.sort((x,y)=>x.t-y.t); LS.set('sheriffRush',a.slice(0,30)); }
function rushRuns(){
  const wk=rushPlan().wk;
  const base = (((db||fb) && boardState!=='error') ? onlineRush.concat(failedRush) : localRush()).filter(r=>r.wk===wk && nameVisible(r.name));
  return base.slice().sort((a,b)=>a.t-b.t || a.date.localeCompare(b.date)).slice(0,10);
}
async function saveRush(en){
  saveNote='';
  if(fb){
    try{ await fbSaveRush(en); if(!onlineRush.some(r=>sameRush(r,en))) onlineRush.push(en); fbLoad(); }
    catch(e){ saveNote='온라인 순위표에 저장하지 못해 이 기기에만 저장했어요.'; failedRush.push(en); localSaveRush(en); }
    return;
  }
  if(db && myId){
    try{
      const ref=db.collection('scores').doc(myId), snap=await ref.get(), d=snap.exists?snap.data():null;
      const runs=(d&&Array.isArray(d.runs))?d.runs.map(cleanRun).filter(Boolean):[];
      const rr=(d&&Array.isArray(d.rush))?d.rush.map(cleanRush).filter(Boolean):[];
      rr.push(en); rr.sort((a,b)=>a.t-b.t);
      if(snap.exists) await ref.update({rush:rr.slice(0,20)}); else await ref.set({rush:rr.slice(0,20)});
      if(!onlineRush.some(r=>sameRush(r,en))) onlineRush.push(en);
      return;
    }catch(e){ saveNote='공용 순위표에 저장할 권한이 없어 이 기기에만 저장했어요.'; failedRush.push(en); localSaveRush(en); return; }
  }
  localSaveRush(en);
}
async function fbLoadRush(){
  const r = await fetch(fbBase()+':runQuery?key='+encodeURIComponent(fb.apiKey), {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({structuredQuery:{from:[{collectionId:'scores_rush'}],
      where:{fieldFilter:{field:{fieldPath:'wk'},op:'EQUAL',value:{stringValue:rushPlan().wk}}}, limit:200}})});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const rows=await r.json(), v=(f,k,t)=>f[k]?f[k][t]:undefined;
  return rows.filter(x=>x.document).map(x=>{ const f=x.document.fields||{};
    return cleanRush({name:v(f,'name','stringValue'), t:v(f,'t','integerValue'), wk:v(f,'wk','stringValue'), date:v(f,'date','stringValue'), tt:v(f,'tt','stringValue')}); }).filter(Boolean);
}
async function fbSaveRush(en){
  const fields={name:{stringValue:en.name}, t:{integerValue:String(en.t)}, wk:{stringValue:en.wk}, date:{stringValue:en.date}}; if(en.tt) fields.tt={stringValue:en.tt};
  const r=await fetch(fbBase()+'/scores_rush?key='+encodeURIComponent(fb.apiKey), {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({fields})});
  if(!r.ok) throw new Error('HTTP '+r.status);
}

function startMission(id){

function endMission(ok, silent){

  if(m.obj){ scene.remove(m.obj.g); if(m.obj.flag) scene.remove(m.obj.flag); }
  if(m.e && enemies.includes(m.e) && !ok) removeEnemy(m.e);

function updateMission(dt){
  const m=mission; if(!m) return;
  m.t = m.id==='bounty' ? m.t-dt : m.t+dt;
  const cleared = toSpawn===0 && enemies.length===0;
  if(m.obj){
    const o=m.obj;
    // 지키는 대상을 공격하는 악당
    for(const e of enemies){ if(!e.toW) continue; const p=e.mesh.position;
      if(Math.hypot(p.x-o.x,p.z-o.z)<e.rad+o.rad+0.4){ o.hp-=e.dmg*0.45*dt; if(Math.random()<dt*3) burst(o.x,1.2,o.z,0x9e9e9e,2); } }
    if(m.id==='escort'){
      const dx=o.to.x-o.x, dz=o.to.z-o.z, d=Math.hypot(dx,dz), sp=3.2;
      if(d>0.5){ o.x+=dx/d*sp*dt; o.z+=dz/d*sp*dt; o.g.position.set(o.x,0,o.z);
        const U=o.g.userData, w=performance.now()/1000*9; U.legs.forEach(([g,s])=>g.rotation.x=Math.sin(w)*0.7*s); U.wheels.forEach(wh=>wh.rotation.x-=sp*dt/0.7); }
      else { endMission(true); return; }
    } else if(cleared){ endMission(true); return; }
    if(o.hp<=0){ burst(o.x,1.5,o.z,0xff7043,30); P.shake=Math.max(P.shake,0.4); endMission(false); return; }
  } else if(m.id==='bounty'){
    if(!enemies.includes(m.e)){ endMission(true); return; }
    if(m.t<=0){ burst(m.e.mesh.position.x,1,m.e.mesh.position.z,0xd9c29a,24); endMission(false); return; }
  } else if(m.id==='head'){
    if(cleared){ endMission(true); return; }
  }
}

// 현상수배범: 보안관에게서 도망치기 (울타리 근처에선 옆으로 빠짐)
function updateBountyMove(e,dt,ux,uz){
  const p=e.mesh.position; let mx=-ux, mz=-uz;
  const r=Math.hypot(p.x,p.z);
  if(r>ARENA-18){ const tx=-p.z/r, tz=p.x/r, sg=(tx*mx+tz*mz)>=0?1:-1; mx=mx*0.3+tx*sg; mz=mz*0.3+tz*sg; }
  mx+=Math.sin(e.ph*0.7)*0.35; const l=Math.hypot(mx,mz)||1;
  p.x+=mx/l*e.speed*dt; p.z+=mz/l*e.speed*dt; e.mesh.rotation.y=Math.atan2(-mx,-mz);
  return e.speed;
}

function buyGood(id){

function buyUpgrade(i){

}

  if(d.carry && (d.carry.life<=0 || !items.includes(d.carry))) d.carry=null;
  // 주인 근처(14m)의 가장 가까운 악당
  let tgt=null, bd=1e9;
  if(!d.carry) for(const e of enemies){
    if(e.hidden || e.kind==='decoy' || e.dummy || e.hp<=0 || e.mesh.position.y>1.5) continue;
    const p=e.mesh.position; if(Math.hypot(p.x-P.x,p.z-P.z)>14) continue;
    const dd=Math.hypot(p.x-d.x,p.z-d.z); if(dd<bd){ bd=dd; tgt=e; }
  }
  let goal, fast=true;
  if(d.carry) goal={x:P.x,z:P.z,stop:0.4};
  else if(tgt){
    const p=tgt.mesh.position; goal={x:p.x,z:p.z,stop:tgt.rad+0.45};
    if(bd<tgt.rad+0.95 && d.cd<=0){
      d.cd=d.D.cd; U.head.rotation.x=0.5; dogBark(); burst(p.x,0.9,p.z,0xffffff,3);
      track('dogBite'); dogGainXp(d);
      if(dogLv(d.id)>=5 && tgt.hp>0) tgt.held=Math.max(tgt.held||0, tgt.boss?0.2:0.6);
      hitEnemy(tgt,d.D.dmg*(1+0.12*(dogLv(d.id)-1)),false);
    }
  } else {
    // 떨어진 아이템 물어 오기 (보물 상자·유물은 직접 줍기)
    let bi=null, bdi=22;
    for(const it of items){
      if(it.type!=='hp' && it.type!=='ammo' && it.type!=='armor') continue;
      const p=it.mesh.position; if(Math.hypot(p.x-P.x,p.z-P.z)<2.5) continue;
      const di=Math.hypot(p.x-d.x,p.z-d.z); if(di<bdi){ bdi=di; bi=it; }
    }
    if(bi){ const p=bi.mesh.position; goal={x:p.x,z:p.z,stop:0}; if(bdi<0.9){ d.carry=bi; bi.life=Math.max(bi.life,8); } }
    else {
      const rx=Math.cos(P.yaw), rz=-Math.sin(P.yaw), fx=-Math.sin(P.yaw), fz=-Math.cos(P.yaw);
      goal={x:P.x+rx*1.9+fx*0.9, z:P.z+rz*1.9+fz*0.9, stop:0.5}; fast=false;
    }
  }
  dogSkills(d,dt);
  if(d.D.finds){ d.find-=dt; if(d.find<=0 && !tgt){ d.find=35; spawnItem(d.x,d.z,'hp'); dogBark(); popText(d.D.icon+' '+d.D.short+'이(가) 회복약을 찾아왔어요!','#80d8ff',1.4); } }
  const gx=goal.x-d.x, gz=goal.z-d.z, gd=Math.hypot(gx,gz);
  let speed=0;
  if(gd>60){ d.x=P.x+1.5; d.z=P.z+1.5; }
  else if(gd>goal.stop){
    const top = (fast || gd>5) ? d.D.speed : Math.min(d.D.speed, 3+gd*2);
    speed=Math.min(top, (gd-goal.stop)/dt);
    d.x+=gx/gd*speed*dt; d.z+=gz/gd*speed*dt;
    d.g.rotation.y=Math.atan2(-gx,-gz);
  } else if(tgt){ const p=tgt.mesh.position; d.g.rotation.y=Math.atan2(-(p.x-d.x),-(p.z-d.z)); }
  const pos={x:d.x,z:d.z}; pushOut(pos,0.5); clampArena(pos,2); d.x=pos.x; d.z=pos.z;
  d.g.position.set(d.x,0,d.z);
  d.ph+=dt*(speed>0.3?speed*1.6:0);
  for(const [lg,s] of U.legs) lg.rotation.x = speed>0.3 ? Math.sin(d.ph)*0.8*s : 0;
  U.body.position.y = speed>0.3 ? Math.abs(Math.sin(d.ph))*0.06 : 0;
  U.tail.rotation.y = Math.sin(performance.now()/(tgt?60:110))*0.7;
  U.head.rotation.x *= Math.max(0,1-dt*8);
  if(d.carry){
    const ry=d.g.rotation.y, cp=d.carry.mesh.position;
    cp.x=d.x-Math.sin(ry)*0.75; cp.z=d.z-Math.cos(ry)*0.75;
  }
}

let traps=[];
function placeTrap(kind){
  if(mode!=='play' || celeb || P.down) return;
  if(!P.traps) P.traps={bear:0,barrel:0};
  if(!kind) kind = P.traps.bear>0 ? 'bear' : 'barrel';
  if(P.traps[kind]<=0){ popText(kind==='bear'?'🪤 곰덫이 없어요 (상인에게서 사요)':'🛢 폭약통이 없어요 (상인에게서 사요)','#ffab40',1.2); return; }
  if(traps.length>=12){ popText('함정은 한 번에 12개까지 놓을 수 있어요','#ffab40',1); return; }
  const fx=-Math.sin(P.yaw), fz=-Math.cos(P.yaw), pos={x:P.x+fx*2.4, z:P.z+fz*2.4};
  pushOut(pos,0.8); clampArena(pos,3);
  P.traps[kind]--;
  const g=new THREE.Group();
  if(kind==='bear'){
    const steel=lam(0x8a8f96), dk=lam(0x4a4f56);
    const ring=new THREE.Mesh(new THREE.TorusGeometry(0.55,0.06,6,20), steel); ring.rotation.x=Math.PI/2; ring.position.y=0.08; g.add(ring);
    addBox(g,1.0,0.05,0.12,dk,0,0.06,0); addBox(g,0.26,0.04,0.26,lam(0xb0b4ba),0,0.09,0);
    for(let i=0;i<12;i++){ const a=i/12*Math.PI*2; addBox(g,0.06,0.2,0.06,steel,Math.cos(a)*0.55,0.2,Math.sin(a)*0.55); }
  } else {
    const red=lam(0xb71c1c), band=lam(0x333333);
    addCyl(g,0.42,0.42,1.0,14,red,0,0.5,0);
    for(const y of [0.18,0.82]) addCyl(g,0.44,0.44,0.07,14,band,0,y,0);
    addBox(g,0.5,0.22,0.03,lam(0xffeb3b),0,0.55,-0.43); addBox(g,0.5,0.22,0.03,lam(0xffeb3b),0,0.55,0.43);
    addCyl(g,0.03,0.03,0.25,6,lam(0x6d4c41),0.15,1.12,0);
  }
  g.position.set(pos.x,0,pos.z); g.rotation.y=P.yaw; scene.add(g);
  traps.push({kind,g,x:pos.x,z:pos.z,arm:0.6,life:kind==='bear'?90:120});
  sfx('reload'); track('trap');
  popText(kind==='bear'?'🪤 곰덫 설치 (남은 '+P.traps.bear+')':'🛢 폭약통 설치 (남은 '+P.traps.barrel+')','#ffcc80',0.9);
}
function updateTraps(dt){
  for(let i=traps.length-1;i>=0;i--){
    const t=traps[i]; t.arm-=dt; t.life-=dt; let hit=null;
    if(t.arm<=0) for(const e of enemies){
      if(e.hidden || e.kind==='decoy' || e.hp<=0 || e.mesh.position.y>1.5) continue;
      const p=e.mesh.position; if(Math.hypot(p.x-t.x,p.z-t.z) < e.rad+(t.kind==='bear'?0.5:1.8)){ hit=e; break; }
    }
    if(hit){
      if(t.kind==='bear'){
        hit.held = hit.boss ? 1.2 : 3;
        burst(t.x,0.4,t.z,0xb0b4ba,12); sfx('clang'); popText('🪤 덫에 걸렸다!','#ffd54f',0.8); track('trapHit');
        hitEnemy(hit, (hit.boss?5:3)*(roleIs('engineer')?2:1), false);
      } else explode(t.x,t.z,roleIs('engineer')?3.2:1.6,1.3);
    }
    if(hit || t.life<=0){ scene.remove(t.g); traps.splice(i,1); }
    else if(t.life<5) t.g.visible = Math.sin(t.life*12)>0;
  }
}

  camera.lookAt(p.x, p.y+1.1*s, p.z); camera.updateMatrixWorld();

const TUT_STEPS=[
  {id:'move',  t:()=>TOUCH?'왼쪽 화면을 드래그해서 걸어 보세요':'W A S D 키로 걸어 보세요'},

  {id:'kill',  t:()=>runMode==='practice' ? (TOUCH?'조준선(+)에 허수아비를 맞추면 자동으로 쏴요 · 허수아비 맞히기!':'클릭해서 허수아비를 쏴 보세요 (머리를 맞히면 2배)') : TOUCH?'조준선(+)에 악당이 들어오면 자동으로 쏴요 · 악당 1명 처치!':'클릭해서 쏘세요 · 악당 1명 처치! (머리를 맞히면 2배)'},
  {id:'reload',t:()=>TOUCH?'장전 버튼을 눌러 재장전해 보세요':'R 키로 재장전해 보세요'},
  {id:'dodge', t:()=>TOUCH?'회피 버튼으로 굴러 보세요 (잠깐 무적)':'Shift 키로 굴러 보세요 (잠깐 무적)'},
  {id:'pick',  t:()=>'앞에 떨어진 탄약 상자(파란 상자)를 주우세요'},
];
let tut=null;
function startTut(){ tut={i:-1, moved:0, look:0, lx:P.x, lz:P.z, ly:P.yaw}; nextTut(); }
function nextTut(){
  tut.i++;
  if(tut.i>=TUT_STEPS.length){ endTut(true); return; }
  const st=TUT_STEPS[tut.i];
  if(st.id==='pick'){ const fx=-Math.sin(P.yaw), fz=-Math.cos(P.yaw); spawnItem(P.x+fx*5,P.z+fz*5,'ammo'); }
  $('tutStep').textContent='🎓 따라 해 보기 '+(tut.i+1)+' / '+TUT_STEPS.length; $('tutTxt').textContent=st.t();
  $('tut').style.display='block'; if(tut.i>0) sfx('pickup');
}
function tutEvent(id){ if(tut && TUT_STEPS[tut.i] && TUT_STEPS[tut.i].id===id) nextTut(); }
function endTut(done){
  const was=LS.get('sheriffTut',0);
  tut=null; $('tut').style.display='none'; LS.set('sheriffTut',1);
  if(done){ if(!was) addCoins(50); toast('🎓 튜토리얼 완료!', was ? '연습은 언제든 시작 화면의 🎯 연습장에서!' : '+50 코인 · 이제 마을을 지켜 주세요, 보안관님!'); }
}
function updateTut(){
  if(!tut) return;
  const id=TUT_STEPS[tut.i].id;
  if(id==='move'){ tut.moved+=Math.hypot(P.x-tut.lx,P.z-tut.lz); if(tut.moved>6) nextTut(); }
  else if(id==='look'){ tut.look+=Math.abs(P.yaw-tut.ly); if(tut.look>1.5) nextTut(); }
  tut.lx=P.x; tut.lz=P.z; tut.ly=P.yaw;
}

let floaters=[];
function floatText(x,y,z,txt,col){
  const m=labelMat(txt,col), sp=new THREE.Sprite(m); sp.scale.set(0.45*m.userData.aspect,0.45,1);
  sp.position.set(x+(Math.random()-0.5)*0.4,y,z+(Math.random()-0.5)*0.4); sp.renderOrder=999; scene.add(sp);
  floaters.push({sp,life:0.9});
}
function updateFloaters(dt){
  for(let i=floaters.length-1;i>=0;i--){ const f=floaters[i]; f.life-=dt; f.sp.position.y+=dt*1.4; if(f.life<=0){ scene.remove(f.sp); floaters.splice(i,1); } }
}
function makeDummy(mover){
  const mats=[], M=c=>{ const m=lam(c); mats.push(m); return m; };
  const g=new THREE.Group(), wood=M(0x7a5230), straw=M(0xd9b45a), sack=M(0xcdb38a), shirt=M(mover?0x2f5f8f:0x8e3b2f), hat=M(0x5d4037), dark=M(0x222222), red=M(0xd32f2f), white=M(0xffffff);
  addBox(g,0.6,0.08,0.6,wood,0,0.04,0);
  addBox(g,0.14,1.2,0.14,wood,0,0.6,0);
  addBox(g,0.62,0.75,0.34,shirt,0,1.17,0);
  addBox(g,1.5,0.12,0.12,wood,0,1.42,0);
  for(const x of [-0.75,0.75]) addBox(g,0.16,0.22,0.16,straw,x,1.32,0);
  addBox(g,0.42,0.42,0.42,sack,0,1.82,0);
  for(const x of [-0.09,0.09]){ const a=addBox(g,0.1,0.025,0.02,dark,x,1.87,-0.215); a.rotation.z=0.785; const b=addBox(g,0.1,0.025,0.02,dark,x,1.87,-0.215); b.rotation.z=-0.785; }   // X자 바느질 눈
  addBox(g,0.22,0.025,0.02,dark,0,1.72,-0.215);
  for(const x of [-0.08,0,0.08]) addBox(g,0.015,0.06,0.02,dark,x,1.72,-0.22);
  addCyl(g,0.42,0.42,0.05,12,hat,0,2.05,0); addCyl(g,0.2,0.23,0.24,12,hat,0,2.18,0);
  for(const x of [-0.25,0.25]) addBox(g,0.08,0.18,0.08,straw,x,1.98,0.12);
  const t1=addCyl(g,0.22,0.22,0.03,18,white,0,1.2,-0.18); t1.rotation.x=Math.PI/2;
  const t2=addCyl(g,0.14,0.14,0.04,18,red,0,1.2,-0.19); t2.rotation.x=Math.PI/2;
  const t3=addCyl(g,0.06,0.06,0.05,12,white,0,1.2,-0.2); t3.rotation.x=Math.PI/2;
  return {mesh:g, mats, legs:[]};
}
function spawnDummy(x,z,mover){
  const e=baseEnemy(makeDummy(mover), {kind:'dummy', dex:'dummy', dummy:true, invuln:true, noDrop:true, s:1, rad:0.5, hp:9999, speed:0, score:0, dmg:0});
  e.mesh.position.set(x,0,z); e.mesh.rotation.y=Math.atan2(-(0-x),-(8-z))+Math.PI; e.ox=x; e.oz=z; e.mover=!!mover; e.tt=Math.random()*6;
  e.mesh.rotation.y=Math.atan2(x-0, z-8);   // 출발점 쪽을 바라봄
  enemies.push(e); return e;
}
BOSS_AI.dummy=(e,dt)=>{
  if(e.mover){ e.tt+=dt; e.mesh.position.x=e.ox+Math.sin(e.tt*0.9)*7; }
  e.mesh.rotation.z=e.wob>0 ? Math.sin(e.wob*30)*0.12 : 0; if(e.wob>0) e.wob-=dt;
  return 0;
};
const DUMMY_SPOTS=[[-6,-10,0],[0,-12,0],[6,-10,0],[-4,-24,1],[5,-30,1]];

function updatePractice(dt){
  if(P.hp<P.maxHp) P.hp=Math.min(P.maxHp,P.hp+(P.hurt>0?0:25*dt));

  // 보스 공격 피하기 연습: 보스는 다치지 않고 자리를 지키며 공격만
  const b=practice && practice.boss;

function practiceBoss(kind){
  practiceClearBoss();
  const fx=-Math.sin(P.yaw), fz=-Math.cos(P.yaw);
  bossSpawned=1; spawnBoss(kind);
  const b=enemies.filter(e=>e.boss).pop(); if(!b) return;
  b.invuln=true; b.summon=1e9; b.score=0; b.noDrop=true;

const KEY_ACTS=[['up','앞으로','KeyW'],['down','뒤로','KeyS'],['left','왼쪽','KeyA'],['right','오른쪽','KeyD'],['turnL','왼쪽으로 돌기','KeyQ'],['turnR','오른쪽으로 돌기','KeyE'],

let keyMap=LS.get('sheriffKeys',{}), keyCapture=null;
function curKey(a){ const d=KEY_ACTS.find(x=>x[0]===a); return keyMap[a]||d[2]; }
function mapCode(c){
  for(const [a,,d] of KEY_ACTS) if(keyMap[a]===c) return d;
  for(const [a,,d] of KEY_ACTS) if(keyMap[a] && keyMap[a]!==d && (c===d || (d==='ShiftLeft'&&c==='ShiftRight'))) return 'Unbound';
  return c;
}
function keyLabel(c){
  if(!c) return '-';
  if(c.startsWith('Key')) return c.slice(3);
  if(c.startsWith('Digit')) return c.slice(5);
  if(c.startsWith('Numpad')) return '숫자패드 '+c.slice(6);
  return ({ShiftLeft:'왼쪽 Shift',ShiftRight:'오른쪽 Shift',ControlLeft:'왼쪽 Ctrl',ControlRight:'오른쪽 Ctrl',AltLeft:'왼쪽 Alt',AltRight:'오른쪽 Alt',Space:'Space',Tab:'Tab',
    ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→',Backquote:'`',Minus:'-',Equal:'=',BracketLeft:'[',BracketRight:']',Semicolon:';',Quote:"'",Comma:',',Period:'.',Slash:'/',Backslash:'\\',CapsLock:'CapsLock'})[c]||c;
}

  for(const [a,lb] of KEY_ACTS) h+='<div class="row2"><div class="grow"><b>'+lb+'</b><br><button class="mini" data-k="'+a+'">'+keyLabel(curKey(a))+'</button>'+(keyMap[a]?' <small style="opacity:.6">(바뀜)</small>':'')+'</div></div>';

async function saveNativePhoto(name,dataUrl){
  const Cap=window.Capacitor;
  if(!(Cap && Cap.isNativePlatform && Cap.isNativePlatform())) return null;
  const FS=(Cap.Plugins&&Cap.Plugins.Filesystem)||Cap.registerPlugin('Filesystem');
  const SHR=(Cap.Plugins&&Cap.Plugins.Share)||Cap.registerPlugin('Share');
  const data=dataUrl.split(',')[1];
  let uri=null, where='';
  try{ const r=await FS.writeFile({path:'Sheriff3D/'+name, data, directory:'DOCUMENTS', recursive:true}); uri=r.uri; where='📁 내 파일 › 문서(Documents) › Sheriff3D 폴더에 저장했어요.'; }
  catch(e){ try{ const r=await FS.writeFile({path:name, data, directory:'CACHE'}); uri=r.uri; }catch(e2){ return '저장하지 못했어요. 사진을 길게 눌러 저장해 보세요.'; } }
  try{ await SHR.share({title:'황야의 배지 사진', files:[uri], dialogTitle:'사진 저장·공유'}); }catch(e){}
  return where || '공유 화면에서 「갤러리에 저장」이나 원하는 앱을 고르세요.';
}

let fires=[];

  const m=new THREE.Mesh(fireGeo,new THREE.MeshBasicMaterial({color:0xff6d00,transparent:true,opacity:0.55,depthWrite:false}));
  m.rotation.x=-Math.PI/2; m.position.set(x,0.06,z); scene.add(m);

function updateFires(dt){

    const f=fires[i]; f.life-=dt; f.tick-=dt;
    if(Math.random()<0.7) burst(f.x+(Math.random()-0.5)*5.5,0.25,f.z+(Math.random()-0.5)*5.5,Math.random()<0.5?0xff9800:0xffeb3b,1);
    f.mesh.material.opacity=0.55*Math.min(1,f.life)*(0.8+0.2*Math.sin(performance.now()/60));
    if(f.tick<=0){ f.tick=0.5;
      for(const e of enemies.slice()){ if(e.hidden||e.hp<=0) continue; const p=e.mesh.position;
        if(Math.hypot(p.x-f.x,p.z-f.z)<3.4+e.rad*0.5) playerHit(e,Math.round(3*f.mul),false); } }
    if(f.life<=0){ scene.remove(f.mesh); f.mesh.material.dispose(); fires.splice(i,1); }
  }

function duelPresence(){ if(duel && duel.vs==='friend' && mp) mp.room.presence({st:'duel', dk:duel.dk, dr:duel.r, dm:duel.my.slice()}).catch(()=>{}); }
function duelOps(){ return mpOthers().map(o=>o.presence); }
function duelPose(){ SH.armR.rotation.set(duel && duel.shot ? 0 : -1.25,0,0); SH.armL.rotation.set(0,0,0); SH.legL.rotation.set(0,0,0); SH.legR.rotation.set(0,0,0); }
function updateDuel(dt){
  const d=duel; if(!d) return;
  d.t+=dt; duelPose();
  sheriff.position.set(P.x,0,P.z); sheriff.rotation.set(0,P.yaw,0);
  camera.position.set(1.4,2.1,4.6); camera.lookAt(0,1.4,-13); camera.updateMatrixWorld();
  if(d.fall){ d.fall.t=Math.min(1,d.fall.t+dt*2.5); const o=d.fall.who==='op'?d.og:sheriff; o.rotation.x=(d.fall.who==='op'?1:-1)*d.fall.t*Math.PI/2; }
  if(d.t<0) return;
  const ops=d.vs==='friend'?duelOps():[];
  if(d.vs==='friend' && !ops.length){ if(d.phase!=='end'){ d.phase='end'; endDuel('친구가 모두 나갔어요'); } return; }
  if(d.phase==='ready'){
    if(d.vs==='friend' && ops.some(p=>p.dk!==d.dk || (p.dr|0)<d.r) && d.t<15){ if(Math.floor(d.t*2)%4===0) popText('⏳ 친구를 기다리는 중…','#80d8ff',0.4); return; }
    d.delay = 1.6 + duelRand(d.seed+'#'+d.r)*3.2;
    d.phase='wait'; d.t=0; d.shot=false;
    showMsg('라운드 '+(d.r+1)+' / '+DUEL_ROUNDS, 30, '준비… (아직 누르지 마세요)'); sfx('reload');
  } else if(d.phase==='wait'){
    if(d.t>=d.delay){ d.phase='signal'; d.sig=performance.now(); d.cpu = DUEL_CPU[d.r]+(Math.random()-0.5)*80;
      showMsg('🔔 쏴!', 30); sfx('bell'); $('fade').style.opacity=0.12; setTimeout(()=>{ $('fade').style.opacity=0; },90); }
  } else if(d.phase==='signal'){
    const el=performance.now()-d.sig;
    if(d.vs==='cpu' && el>=d.cpu && !d.shot){ duelResolve(1500); }
    else if(!d.shot && el>1500) duelResolve(1500);
  } else if(d.phase==='waitop'){
    const oms = ops.map(p=> p.dk===d.dk && Array.isArray(p.dm) ? p.dm[d.r] : undefined);
    d.waitT+=dt;
    if(oms.every(x=>x!==undefined && x!==null) || d.waitT>6) duelFinishRound(oms.map(x=>x===undefined||x===null?1500:x), ops.map(p=>String(p.nm).slice(0,12)));
  } else if(d.phase==='result'){
    if(d.t>2.4){ d.r++; d.fall=null; d.og.rotation.x=0; sheriff.rotation.x=0; d.shot=false;
      if(d.r>=DUEL_ROUNDS){ d.phase='end'; endDuel(); } else { d.phase='ready'; d.t=0; duelPresence(); } }
  }
}
function duelPress(){
  const d=duel; if(!d || d.t<0) return;

  else if(d.phase==='signal' && !d.shot){ const ms=Math.round(performance.now()-d.sig); duelResolve(ms<100?-1:ms); }   // 0.1초 미만은 신호를 보고 누를 수 없는 속도 → 반칙
}
function duelResolve(ms){

  if(d.shot){ SH.flash.visible=true; P.flashT=0.06; setTimeout(()=>{ SH.flash.visible=false; },60); sfx('revolver'); }
  if(d.vs==='cpu') duelFinishRound(d.cpu);
  else { d.phase='waitop'; d.waitT=0; showMsg(ms<0?'❌ 반칙!':ms>=1500?'⌛ 늦었어요':'⏱ '+(ms/1000).toFixed(3)+'초', 30, '상대 결과를 기다리는 중…'); }
}
function duelFinishRound(om,names){
  const d=duel, my=d.my[d.r];

  if(Array.isArray(om)){ const v=om.map((x,i)=>[x,i]).filter(([x])=>x>0&&x<1500).sort((a,b)=>a[0]-b[0]);
    if(v.length){ opName=names[v[0][1]]+(om.length>1?' (가장 빠른 상대)':''); om=v[0][0]; } else om = om.every(x=>x<0) ? -1 : 1500; }

  else if(!myOk && !opOk) res='draw'; else if(!opOk) res='win'; else if(!myOk) res='lose';

  d.res=d.res||[]; d.res[d.r]=res;

}

let onlineDuel=[], failedDuel=[], lastDuel=null;
function cleanDuel(x){
  if(!x||typeof x!=='object') return null;
  const ms=Math.floor(Number(x.ms)), w=Math.floor(Number(x.w));
  if(!(ms>=80 && ms<1500) || !(w>=0 && w<=DUEL_ROUNDS)) return null;
  return {name:String(x.name||'???').slice(0,12), ms, w, date:String(x.date||'').slice(0,40), ...(x.tt?{tt:String(x.tt).slice(0,12)}:{})};
}
const sameDuel=(a,b)=>a&&b&&a.date===b.date&&a.name===b.name&&a.ms===b.ms;
function localDuel(){ const a=LS.get('sheriffDuel',[]); return Array.isArray(a)?a.map(cleanDuel).filter(Boolean):[]; }
function duelSort(a,b){ return b.w-a.w || a.ms-b.ms || a.date.localeCompare(b.date); }
function duelRuns(){ return ((((db||fb) && boardState!=='error') ? onlineDuel.concat(failedDuel) : localDuel())).filter(r=>nameVisible(r.name)).sort(duelSort).slice(0,10); }
async function saveDuel(en){
  saveNote='';
  if(fb){
    try{ const fields={name:{stringValue:en.name}, ms:{integerValue:String(en.ms)}, w:{integerValue:String(en.w)}, date:{stringValue:en.date}}; if(en.tt) fields.tt={stringValue:en.tt};
      const r=await fetch(fbBase()+'/scores_duel?key='+encodeURIComponent(fb.apiKey),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields})});
      if(!r.ok) throw new Error('HTTP '+r.status); if(!onlineDuel.some(r2=>sameDuel(r2,en))) onlineDuel.push(en); fbLoad(); }
    catch(e){ saveNote='온라인 순위표에 저장하지 못해 이 기기에만 저장했어요.'; failedDuel.push(en); const a=localDuel(); a.push(en); a.sort(duelSort); LS.set('sheriffDuel',a.slice(0,20)); }
    return;
  }
  if(db && myId){
    try{
      const ref=db.collection('scores').doc(myId), snap=await ref.get(), d=snap.exists?snap.data():null;
      const keep=(k,f)=>(d&&Array.isArray(d[k]))?d[k].map(f).filter(Boolean):[];
      const dd=keep('duel',cleanDuel); dd.push(en); dd.sort(duelSort);
      if(snap.exists) await ref.update({duel:dd.slice(0,10)}); else await ref.set({duel:dd.slice(0,10)});
      if(!onlineDuel.some(r=>sameDuel(r,en))) onlineDuel.push(en);
      return;
    }catch(e){ saveNote='공용 순위표에 저장할 권한이 없어 이 기기에만 저장했어요.'; failedDuel.push(en); }
  }
  const a=localDuel(); a.push(en); a.sort(duelSort); LS.set('sheriffDuel',a.slice(0,20));
}
async function fbLoadDuel(){
  const r=await fetch(fbBase()+':runQuery?key='+encodeURIComponent(fb.apiKey),{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({structuredQuery:{from:[{collectionId:'scores_duel'}],orderBy:[{field:{fieldPath:'ms'},direction:'ASCENDING'}],limit:100}})});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const rows=await r.json(), v=(f,k,t)=>f[k]?f[k][t]:undefined;
  return rows.filter(x=>x.document).map(x=>{ const f=x.document.fields||{}; return cleanDuel({name:v(f,'name','stringValue'), ms:v(f,'ms','integerValue'), w:v(f,'w','integerValue'), date:v(f,'date','stringValue'), tt:v(f,'tt','stringValue')}); }).filter(Boolean);
}
